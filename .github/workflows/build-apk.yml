name: Build APK

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Install dependencies
        working-directory: ./app
        run: npm install
      
      - name: Expo Prebuild
        working-directory: ./app
        run: npx expo prebuild --platform android --clean
      
      - name: Make gradlew executable
        working-directory: ./app/android
        run: chmod +x gradlew
      
      - name: Build APK
        working-directory: ./app/android
        run: ./gradlew assembleRelease --no-daemon
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      
      - name: Find APK
        working-directory: ./app
        run: |
          echo "=== Searching for APK ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "No APK"
          mkdir -p /tmp/apk-output
          find . -name "app-release.apk" -exec cp {} /tmp/apk-output/ \; 2>/dev/null || true
          find . -name "app-debug.apk" -exec cp {} /tmp/apk-output/ \; 2>/dev/null || true
          ls -la /tmp/apk-output/
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moshtriyar-apk
          path: /tmp/apk-output/*.apk
          retention-days: 30
          if-no-files-found: warn
      
      - name: Copy APK to download folder
        run: |
          mkdir -p download
          cp /tmp/apk-output/app-release.apk download/moshtriyar.apk
      
      - name: Commit and push APK to repo
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add download/moshtriyar.apk
          git diff --staged --quiet || git commit -m "chore: update APK [skip ci]"
          git push
