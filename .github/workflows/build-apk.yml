name: Build APK

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        working-directory: ./app
        run: npm install
      
      - name: Install EAS CLI
        run: npm install -g eas-cli
      
      - name: Build APK with EAS (Cloud)
        working-directory: ./app
        id: build
        run: |
          eas build --platform android --profile preview --non-interactive --json > build-output.json
          cat build-output.json
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      
      - name: Get APK URL
        working-directory: ./app
        id: get-url
        run: |
          APK_URL=$(cat build-output.json | jq -r '.[0].artifacts.buildUrl')
          echo "APK_URL=$APK_URL" >> $GITHUB_OUTPUT
          echo "APK URL: $APK_URL"
      
      - name: Download APK
        working-directory: ./app
        run: |
          curl -L -o build-output.apk "${{ steps.get-url.outputs.APK_URL }}"
          ls -la build-output.apk
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moshtriyar-apk
          path: app/build-output.apk
          retention-days: 30
