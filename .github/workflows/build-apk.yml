name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        working-directory: ./app
        run: npm install

      - name: Expo Prebuild
        working-directory: ./app
        env:
          EXPO_PUBLIC_CAFEBAZAAR_RSA_KEY: ${{ secrets.EXPO_PUBLIC_CAFEBAZAAR_RSA_KEY }}
        run: npx expo prebuild --platform android --clean

      # --- تزریق امن امضای دیجیتال ---
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ./app/android/app/release.keystore

      - name: Patch build.gradle for Signing
        working-directory: ./app/android/app
        run: |
          # ایجاد یک فایل جداگانه برای تنظیمات امضا
          cat <<EOF > signing.gradle
          android {
              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword '${{ secrets.KEYSTORE_PASSWORD }}'
                      keyAlias '${{ secrets.KEY_ALIAS }}'
                      keyPassword '${{ secrets.KEY_PASSWORD }}'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF
          # فراخوانی فایل تنظیمات در build.gradle اصلی
          echo "apply from: 'signing.gradle'" >> build.gradle
      # ------------------------------

      - name: Make gradlew executable
        working-directory: ./app/android
        run: chmod +x gradlew

      - name: Build APK
        working-directory: ./app/android
        env:
          EXPO_PUBLIC_CAFEBAZAAR_RSA_KEY: ${{ secrets.EXPO_PUBLIC_CAFEBAZAAR_RSA_KEY }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Find APK
        working-directory: ./app
        run: |
          mkdir -p /tmp/apk-output
          find . -name "app-release.apk" -exec cp {} /tmp/apk-output/ \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moshtriyar-apk-signed
          path: /tmp/apk-output/*.apk
          if-no-files-found: error
