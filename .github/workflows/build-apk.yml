name: Build APK

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Install dependencies
        working-directory: ./app
        run: npm install
      
      - name: Expo Prebuild
        working-directory: ./app
        run: npx expo prebuild --platform android --clean
      
      - name: Make gradlew executable
        working-directory: ./app/android
        run: chmod +x gradlew
      
      - name: Build APK (Release)
        working-directory: ./app/android
        run: ./gradlew assembleRelease --no-daemon
      
      - name: Build APK (Debug - fallback)
        if: failure()
        working-directory: ./app/android
        run: ./gradlew assembleDebug --no-daemon
      
      - name: Find APK files
        working-directory: ./app
        run: |
          echo "=== Searching for APK files ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "No APK found"
          mkdir -p /tmp/apk-output
          find . -name "app-release.apk" -type f -exec cp {} /tmp/apk-output/ \; 2>/dev/null || true
          find . -name "app-debug.apk" -type f -exec cp {} /tmp/apk-output/ \; 2>/dev/null || true
          ls -la /tmp/apk-output/
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moshtriyar-apk
          path: /tmp/apk-output/*.apk
          retention-days: 30
          if-no-files-found: warn
