name: Build APK

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'
          accept-licenses: true
          cmdline-tools-version: '12.0'
      
      - name: Install dependencies
        working-directory: ./app
        run: npm install
      
      - name: Install EAS CLI
        run: npm install -g eas-cli
      
      - name: Build APK Locally
        working-directory: ./app
        run: |
          eas build --platform android --profile production --local --non-interactive --output=./build-output.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moshtriyar-apk
          path: app/build-output.apk
          retention-days: 30
