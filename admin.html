<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل مدیریت | مشتری‌یار</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
<link rel="icon" href="icon-192.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:#f1f5f9;color:#0f172a;line-height:1.7;padding-bottom:40px}
.header{background:#1e293b;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.header h1{font-size:16px;font-weight:800}
.header a{color:#fff;text-decoration:none;background:#334155;padding:8px 14px;border-radius:10px;font-size:13px;font-weight:700}
.container{max-width:1000px;margin:0 auto;padding:20px}
.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.card h2{font-size:16px;font-weight:800;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{background:#f8fafc;border-radius:12px;padding:14px;text-align:center}
.stat b{font-size:22px;display:block;font-weight:900}
.stat.y b{color:#d97706}.stat.g b{color:#16a34a}.stat.r b{color:#dc2626}
.stat span{font-size:11px;color:#64748b;font-weight:700}
.settings{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.field label{display:block;font-size:12px;font-weight:700;color:#475569;margin-bottom:4px}
.field input{width:100%;padding:10px;border:2px solid #e2e8f0;border-radius:10px;font-family:inherit;font-size:14px;background:#f8fafc;direction:ltr;text-align:right}
.btn-save{width:100%;padding:12px;background:#2563eb;color:#fff;border:none;border-radius:10px;font-family:inherit;font-weight:800;font-size:14px;cursor:pointer;margin-top:12px}
.msg{text-align:center;margin-top:10px;font-size:13px;font-weight:700;min-height:18px}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tab{padding:7px 14px;border-radius:10px;background:#fff;border:2px solid #e2e8f0;font-family:inherit;font-weight:700;font-size:12px;cursor:pointer;color:#475569}
.tab.active{background:#2563eb;color:#fff;border-color:#2563eb}
.pay{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;border-right:5px solid #cbd5e1}
.pay.pending{border-right-color:#f59e0b}
.pay.approved{border-right-color:#16a34a}
.pay.rejected{border-right-color:#dc2626}
.pay-head{display:flex;justify-content:space-between;margin-bottom:10px;gap:8px}
.pay-user{font-weight:800;font-size:14px}
.pay-email{font-size:11px;color:#64748b;direction:ltr;text-align:right}
.badge{padding:4px 10px;border-radius:20px;font-size:10px;font-weight:800;white-space:nowrap;height:fit-content}
.badge.pending{background:#fef3c7;color:#92400e}
.badge.approved{background:#dcfce7;color:#166534}
.badge.rejected{background:#fee2e2;color:#991b1b}
.pay-info{background:#f8fafc;border-radius:10px;padding:10px;margin-bottom:10px;font-size:12px}
.pay-info div{display:flex;justify-content:space-between;padding:3px 0}
.pay-info span:first-child{color:#64748b;font-weight:600}
.pay-info span:last-child{color:#1e293b;font-weight:700}
.pay-info .code{font-family:monospace;direction:ltr}
.actions{display:flex;gap:8px}
.btn{flex:1;padding:10px;border-radius:10px;border:none;font-family:inherit;font-weight:800;font-size:12px;cursor:pointer}
.btn-ok{background:#16a34a;color:#fff}
.btn-no{background:#fee2e2;color:#dc2626}
.btn:disabled{opacity:.5}
.empty{text-align:center;padding:40px;color:#94a3b8;background:#fff;border-radius:14px}
.loading{text-align:center;padding:40px;color:#64748b}
.hidden{display:none!important}
@media(max-width:600px){.stats,.settings{grid-template-columns:1fr}.pay-head{flex-direction:column}}
</style>
</head>
<body>

<header class="header">
    <h1>⚙️ پنل مدیریت</h1>
    <a href="dashboard.html">← داشبورد</a>
</header>

<div class="container" id="app">
    <div class="loading">در حال بارگذاری...</div>
</div>

<script type="module">
import { supabase } from './js/supabase.js';

const app = document.getElementById('app');
let all = [], filter = 'pending', me = null;

async function init() {
    try {
        // ۱. چک لاگین
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) {
            window.location.href = 'login.html';
            return;
        }
        me = session.user;

        // ۲. چک ادمین با RPC
        const isAdmin = me.user_metadata?.role === 'admin';
console.log('is_admin check:', isAdmin, 'metadata:', me.user_metadata);

if (!isAdmin) {
    app.innerHTML = '<div class="empty">⛔ شما ادمین نیستید. (role: ' + (me.user_metadata?.role || 'ندارد') + ')</div>';
    return;
    }

        // ۳. بارگذاری
        await loadSettings();
        await loadPayments();
        renderUI();

    } catch (err) {
        console.error('Init error:', err);
        app.innerHTML = '<div class="empty">⚠️ خطای غیرمنتظره: ' + err.message + '</div>';
    }
}

async function loadSettings() {
    const { data } = await supabase.from('settings').select('*');
    const s = {};
    (data || []).forEach(x => s[x.key] = x.value);
    window._settings = s;
}

async function loadPayments() {
    const { data, error } = await supabase.from('payments').select('*').order('created_at', { ascending: false });
    if (error) {
        console.error('Payments error:', error);
        all = [];
        return;
    }

    // اطلاعات کاربران رو از profiles بگیر
    all = await Promise.all((data || []).map(async p => {
        const { data: prof } = await supabase.from('profiles').select('email,full_name').eq('id', p.user_id).maybeSingle();
        return { ...p, prof };
    }));
}

function renderUI() {
    const s = window._settings || {};
    app.innerHTML = `
        <div class="card">
            <h2>📊 آمار</h2>
            <div class="stats">
                <div class="stat y"><b id="stP">0</b><span>در انتظار</span></div>
                <div class="stat g"><b id="stA">0</b><span>تایید شده</span></div>
                <div class="stat r"><b id="stR">0</b><span>رد شده</span></div>
            </div>
        </div>

        <div class="card">
            <h2>⚙️ تنظیمات قیمت و مدت زمان</h2>
            <div class="settings">
                <div class="field"><label>قیمت پلن حرفه‌ای (تومان)</label><input type="number" id="proPrice" value="${s.pro_price || '490000'}"></div>
                <div class="field"><label>قیمت پلن کسب‌وکار (تومان)</label><input type="number" id="bizPrice" value="${s.business_price || '990000'}"></div>
                <div class="field"><label>مدت پلن تست (روز)</label><input type="number" id="trialDays" value="${s.trial_days || '3'}"></div>
                <div class="field"><label>مدت پلن‌های اصلی (روز)</label><input type="number" id="planDays" value="${s.pro_days || '30'}"></div>
            </div>
            <button class="btn-save" id="saveBtn">💾 ذخیره تنظیمات</button>
            <p class="msg" id="saveMsg"></p>
        </div>

        <div class="tabs">
            <button class="tab active" data-f="pending">⏳ در انتظار</button>
            <button class="tab" data-f="approved">✅ تایید شده</button>
            <button class="tab" data-f="rejected">❌ رد شده</button>
            <button class="tab" data-f="all">📋 همه</button>
        </div>

        <div id="list"></div>
    `;

    document.getElementById('saveBtn').onclick = saveSettings;
    document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
        document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        filter = t.dataset.f;
        renderList();
    });

    updateStats();
    renderList();
}

function updateStats() {
    document.getElementById('stP').textContent = all.filter(p => p.status === 'pending').length;
    document.getElementById('stA').textContent = all.filter(p => p.status === 'approved').length;
    document.getElementById('stR').textContent = all.filter(p => p.status === 'rejected').length;
}

function renderList() {
    const list = document.getElementById('list');
    const items = filter === 'all' ? all : all.filter(p => p.status === filter);

    if (!items.length) {
        list.innerHTML = '<div class="empty">📭 هیچ پرداختی نیست</div>';
        return;
    }

    list.innerHTML = '';
    items.forEach(p => {
        const badge = p.status === 'pending' ? '⏳ در انتظار' : p.status === 'approved' ? '✅ تایید' : '❌ رد';
        const date = new Date(p.created_at).toLocaleString('fa-IR');
        const actions = p.status === 'pending' ? `
            <div class="actions">
                <button class="btn btn-ok" data-id="${p.id}" data-u="${p.user_id}" data-d="${p.days || 30}">✅ تایید</button>
                <button class="btn btn-no" data-id="${p.id}">❌ رد</button>
            </div>` : '';

        const div = document.createElement('div');
        div.className = 'pay ' + p.status;
        div.innerHTML = `
            <div class="pay-head">
                <div>
                    <div class="pay-user">${p.prof?.full_name || 'بدون نام'}</div>
                    <div class="pay-email">${p.prof?.email || '-'}</div>
                </div>
                <span class="badge ${p.status}">${badge}</span>
            </div>
            <div class="pay-info">
                <div><span>پلن</span><span>${p.plan_name || '-'}</span></div>
                <div><span>مبلغ</span><span>${parseInt(p.amount || 0).toLocaleString('fa-IR')} تومان</span></div>
                <div><span>مدت</span><span>${p.days || 30} روز</span></div>
                <div><span>کد پیگیری</span><span class="code">${p.tracking_code || '-'}</span></div>
                ${p.description ? `<div><span>توضیحات</span><span style="font-weight:400">${p.description}</span></div>` : ''}
                <div><span>تاریخ</span><span style="font-weight:400;font-size:11px">${date}</span></div>
            </div>
            ${actions}`;
        list.appendChild(div);
    });

    list.querySelectorAll('[data-id][data-u]').forEach(b => b.onclick = () => approve(b.dataset.id, b.dataset.u, b.dataset.d, b));
    list.querySelectorAll('.btn-no').forEach(b => b.onclick = () => reject(b.dataset.id, b));
}

async function saveSettings() {
    const btn = document.getElementById('saveBtn');
    const msg = document.getElementById('saveMsg');
    btn.disabled = true;
    msg.textContent = 'در حال ذخیره...';
    msg.style.color = '#2563eb';

    try {
        const items = [
            { key: 'pro_price', value: document.getElementById('proPrice').value },
            { key: 'business_price', value: document.getElementById('bizPrice').value },
            { key: 'trial_days', value: document.getElementById('trialDays').value },
            { key: 'pro_days', value: document.getElementById('planDays').value },
            { key: 'business_days', value: document.getElementById('planDays').value }
        ];
        for (const it of items) {
            await supabase.from('settings').upsert({ key: it.key, value: it.value });
        }
        msg.textContent = '✅ ذخیره شد';
        msg.style.color = '#16a34a';
    } catch (e) {
        msg.textContent = '❌ ' + e.message;
        msg.style.color = '#dc2626';
    } finally {
        btn.disabled = false;
        setTimeout(() => msg.textContent = '', 3000);
    }
}

async function approve(id, uid, days, btn) {
    if (!confirm(`تایید پرداخت و فعال‌سازی اشتراک ${days} روزه؟`)) return;
    btn.disabled = true;
    btn.textContent = 'در حال تایید...';
    try {
        const res = await fetch('/api/approve-payment', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ paymentId: id, userId: uid })
        });
        const r = await res.json();
        if (!res.ok || !r.success) throw new Error(r.error || 'خطا');
        alert('✅ ' + r.message);
        await loadPayments();
        renderUI();
    } catch (e) {
        alert('❌ ' + e.message + '\n\n(آیا API روی Vercel دیپلوی شده؟)');
        btn.disabled = false;
        btn.textContent = '✅ تایید';
    }
}

async function reject(id, btn) {
    if (!confirm('از رد این پرداخت مطمئنید؟')) return;
    btn.disabled = true;
    btn.textContent = 'در حال رد...';
    try {
        const { error } = await supabase.from('payments').update({ status: 'rejected' }).eq('id', id);
        if (error) throw error;
        alert('پرداخت رد شد');
        await loadPayments();
        renderUI();
    } catch (e) {
        alert('❌ ' + e.message);
        btn.disabled = false;
        btn.textContent = '❌ رد';
    }
}

init();
</script>
</body>
  </html>
