<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل مدیریت | مشتری‌یار</title>

<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<link rel="icon" href="icon-192.png">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:#f1f5f9;color:#0f172a;line-height:1.7;padding-bottom:40px}
.header{background:#1e293b;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;gap:8px}
.header h1{font-size:16px;font-weight:800;margin-left:auto}
.header a{color:#fff;text-decoration:none;background:#334155;padding:8px 14px;border-radius:10px;font-size:13px;font-weight:700;white-space:nowrap}
.header a.blue{background:#2563eb}
.container{max-width:1000px;margin:0 auto;padding:20px}
.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.card h2{font-size:16px;font-weight:800;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{background:#f8fafc;border-radius:12px;padding:14px;text-align:center}
.stat b{font-size:22px;display:block;font-weight:900}
.stat.y b{color:#d97706}
.stat.g b{color:#16a34a}
.stat.r b{color:#dc2626}
.stat span{font-size:11px;color:#64748b;font-weight:700}
.settings{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.field label{display:block;font-size:12px;font-weight:700;color:#475569;margin-bottom:4px}
.field input{width:100%;padding:10px;border:2px solid #e2e8f0;border-radius:10px;font-family:inherit;font-size:14px;background:#f8fafc;direction:ltr;text-align:right}
.btn-save{width:100%;padding:12px;background:#2563eb;color:#fff;border:none;border-radius:10px;font-family:inherit;font-weight:800;font-size:14px;cursor:pointer;margin-top:12px}
.msg{text-align:center;margin-top:10px;font-size:13px;font-weight:700;min-height:18px}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tab{padding:7px 14px;border-radius:10px;background:#fff;border:2px solid #e2e8f0;font-family:inherit;font-weight:700;font-size:12px;cursor:pointer;color:#475569}
.tab.active{background:#2563eb;color:#fff;border-color:#2563eb}
.pay{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;border-right:5px solid #cbd5e1}
.pay.pending{border-right-color:#f59e0b}
.pay.approved{border-right-color:#16a34a}
.pay.rejected{border-right-color:#dc2626}
.pay-head{display:flex;justify-content:space-between;margin-bottom:10px;gap:8px}
.pay-user{font-weight:800;font-size:14px}
.pay-email{font-size:11px;color:#64748b;direction:ltr;text-align:right}
.badge{padding:4px 10px;border-radius:20px;font-size:10px;font-weight:800;white-space:nowrap;height:fit-content}
.badge.pending{background:#fef3c7;color:#92400e}
.badge.approved{background:#dcfce7;color:#166534}
.badge.rejected{background:#fee2e2;color:#991b1b}
.pay-info{background:#f8fafc;border-radius:10px;padding:10px;margin-bottom:10px;font-size:12px}
.pay-info div{display:flex;justify-content:space-between;padding:3px 0;gap:10px}
.pay-info span:first-child{color:#64748b;font-weight:600}
.pay-info span:last-child{color:#1e293b;font-weight:700;text-align:left}
.pay-info .code{font-family:monospace;direction:ltr}
.actions{display:flex;gap:8px}
.btn{flex:1;padding:10px;border-radius:10px;border:none;font-family:inherit;font-weight:800;font-size:12px;cursor:pointer}
.btn-ok{background:#16a34a;color:#fff}
.btn-no{background:#fee2e2;color:#dc2626}
.btn:disabled{opacity:.5}
.empty{text-align:center;padding:40px;color:#94a3b8;background:#fff;border-radius:14px}
.loading{text-align:center;padding:40px;color:#64748b}
.hidden{display:none!important}

/* 🆕 استایل کلیدهای Gemini */
.key-item{background:#f8fafc;border-radius:12px;padding:14px;margin-bottom:10px}
.key-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.key-name{font-weight:800;font-size:14px}
.key-val{font-size:11px;color:#64748b;direction:ltr;text-align:left;font-family:monospace}
.key-badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:800}
.key-badge.active{background:#dcfce7;color:#166534}
.key-badge.inactive{background:#fee2e2;color:#991b1b}
.key-progress{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.progress-track{flex:1;height:8px;background:#e2e8f0;border-radius:5px;overflow:hidden}
.progress-fill{height:100%;transition:width .3s}
.key-stats{display:flex;justify-content:space-between;font-size:12px;color:#64748b;align-items:center}
.key-btn{border:none;padding:6px 12px;border-radius:8px;font-family:inherit;font-weight:700;font-size:11px;cursor:pointer}
.key-btn.disable{background:#fee2e2;color:#991b1b}
.key-btn.enable{background:#dcfce7;color:#166534}

/* 🆕 استایل سایت‌ها */
.site-item{background:#f8fafc;border-radius:12px;padding:14px;margin-bottom:10px}
.site-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.site-name{font-weight:800;font-size:14px}
.site-plan{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:800;background:#eef2ff;color:#4f46e5}
.site-plan.pro{background:#fef3c7;color:#92400e}
.site-plan.business{background:#dbeafe;color:#1e40af}
.site-domain{font-size:12px;color:#64748b;margin-bottom:8px}
.site-key{font-size:11px;color:#94a3b8;direction:ltr;text-align:left;font-family:monospace}

@media(max-width:600px){
.stats,.settings{grid-template-columns:1fr}
.pay-head{flex-direction:column}
.header{flex-wrap:wrap}
.header h1{width:100%}
}
</style>
</head>

<body>

<header class="header">
    <h1>⚙️ پنل مدیریت</h1>

    <a class="blue" href="special-customers.html">
        👑 مشتریان ویژه
    </a>

    <a href="dashboard.html">
        ← داشبورد
    </a>
</header>

<div class="container" id="app">
    <div class="loading">
        در حال بارگذاری...
    </div>
</div>

<script type="module">
import { supabase } from './js/supabase.js';

const app = document.getElementById('app');

let all = [];
let filter = 'pending';
let me = null;

const esc = (value) => String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');


async function init() {
    try {
        const { data: { session }, error } = await supabase.auth.getSession();
        if (error) throw error;
        if (!session) { window.location.replace('login.html'); return; }

        me = session.user;
        const role = me.user_metadata?.role;

        console.log('Admin user:', me.email);
        console.log('User role:', role);

        if (role !== 'admin') {
            app.innerHTML = `
                <div class="empty">
                    ⛔ شما ادمین نیستید.
                    <br>
                    <small style="color:#94a3b8">
                        دسترسی فقط برای مدیر سیستم مجاز است.
                    </small>
                </div>
            `;
            return;
        }

        await Promise.all([
            loadSettings(),
            loadPayments(),
            loadGeminiKeys(),
            loadSites()
        ]);

        renderUI();

    } catch (err) {
        console.error('Admin init error:', err);
        app.innerHTML = `
            <div class="empty">
                ⚠️ خطا در بارگذاری پنل
                <br>
                <small>${esc(err.message)}</small>
            </div>
        `;
    }
}


async function loadSettings() {
    const { data, error } = await supabase
        .from('settings')
        .select('*');

    if (error) throw error;

    const settings = {};
    (data || []).forEach(item => { settings[item.key] = item.value; });
    window._settings = settings;
}


async function loadPayments() {
    const { data, error } = await supabase
        .from('payments')
        .select('*')
        .order('created_at', { ascending: false });

    if (error) throw error;

    all = await Promise.all(
        (data || []).map(async payment => {
            const { data: profile } = await supabase
                .from('profiles')
                .select('email,full_name')
                .eq('id', payment.user_id)
                .maybeSingle();

            return { ...payment, prof: profile };
        })
    );
}


// 🆕 کلیدهای Gemini
async function loadGeminiKeys() {
    try {
        const { data, error } = await supabase
            .from('gemini_keys')
            .select('*')
            .order('id', { ascending: true });

        if (error) throw error;

        const container = document.getElementById('keysList');
        if (!container) return;

        if (!data || data.length === 0) {
            container.innerHTML = '<div class="empty" style="padding:20px;font-size:13px;">هیچ کلیدی ثبت نشده</div>';
            return;
        }

        container.innerHTML = data.map(key => {
            const percent = Math.min(100, (key.used_today / key.daily_limit) * 100);
            let color = '#16a34a';
            if (percent > 90) color = '#dc2626';
            else if (percent > 70) color = '#f59e0b';

            return `
                <div class="key-item">
                    <div class="key-head">
                        <div>
                            <div class="key-name">${esc(key.name || '-')}</div>
                            <div class="key-val">${esc((key.api_key || '').slice(0, 20))}...</div>
                        </div>
                        <span class="key-badge ${key.active ? 'active' : 'inactive'}">
                            ${key.active ? '✅ فعال' : '❌ غیرفعال'}
                        </span>
                    </div>
                    <div class="key-progress">
                        <div class="progress-track">
                            <div class="progress-fill" style="width:${percent}%;background:${color};"></div>
                        </div>
                        <span style="font-size:12px;font-weight:700;white-space:nowrap;">
                            ${key.used_today}/${key.daily_limit}
                        </span>
                    </div>
                    <div class="key-stats">
                        <span>مصرف کل: ${(key.total_used || 0).toLocaleString('fa-IR')}</span>
                        <button class="key-btn ${key.active ? 'disable' : 'enable'}"
                                onclick="toggleGeminiKey(${key.id}, ${!key.active})">
                            ${key.active ? 'غیرفعال کن' : 'فعال کن'}
                        </button>
                    </div>
                </div>
            `;
        }).join('');

    } catch (err) {
        console.error('Gemini keys error:', err);
    }
}

// 🆕 سایت‌های متصل
async function loadSites() {
    const container = document.getElementById('sitesList');
    if (!container) return;

    try {
        const { data: connections, error: connError } = await supabase
            .from('wordpress_connections')
            .select('id, user_id, site_url, expires_at, used_at, created_at')
            .order('created_at', { ascending: false });

        if (connError) throw connError;

        if (!connections || connections.length === 0) {
            container.innerHTML = '<div class="empty" style="padding:20px;font-size:13px;">هیچ سایتی متصل نشده</div>';
            return;
        }

        const userIds = [...new Set(connections.map(c => c.user_id).filter(Boolean))];
        let profilesMap = {};

        if (userIds.length > 0) {
            const { data: profiles, error: profError } = await supabase
    .from('profiles')
    .select('id, email, full_name')
    .in('id', userIds);

console.log('Profiles fetched:', profiles, profError);




            (profiles || []).forEach(p => {
                profilesMap[p.id] = p;
            });
        }

        container.innerHTML = connections.map(conn => {
            const profile = profilesMap[conn.user_id] || {};
            const plan = 'trial'; // فعلاً همه trial
            const planLabel = plan === 'pro' ? '💎 حرفه‌ای'
                : plan === 'business' ? '🏢 کسب‌وکار'
                : '🆓 تست';

            const isActive = conn.used_at != null;
            const statusLabel = isActive ? '✅ متصل' : '⏳ در انتظار';
            const statusColor = isActive ? '#166534' : '#92400e';
            const statusBg = isActive ? '#dcfce7' : '#fef3c7';

            const domain = (conn.site_url || '').replace(/^https?:\/\//, '').replace(/\/$/, '');

            return `
                <div class="site-item">
                    <div class="site-head">
                        <div class="site-name">${esc(domain || 'بدون دامنه')}</div>
                        <span class="site-plan ${plan}">${planLabel}</span>
                    </div>
                    <div class="site-domain">
                        ${esc(profile.full_name || profile.email || 'کاربر ناشناس')}
                    </div>
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;">
                        <span style="font-size:11px;color:#94a3b8;direction:ltr;">
                            ${esc(conn.site_url || '')}
                        </span>
                        <span style="padding:4px 10px;border-radius:20px;font-size:11px;font-weight:800;
                                     background:${statusBg};color:${statusColor};">
                            ${statusLabel}
                        </span>
                    </div>
                </div>
            `;
        }).join('');

    } catch (err) {
        console.error('Sites error:', err);
        container.innerHTML = `<div class="empty" style="padding:20px;font-size:13px;">
            ❌ ${esc(err.message)}
        </div>`;
    }
}

// 🆕 تغییر وضعیت کلید
window.toggleGeminiKey = async function(keyId, active) {
    if (!confirm(active ? 'کلید فعال شود؟' : 'کلید غیرفعال شود؟')) return;

    try {
        const { error } = await supabase
            .from('gemini_keys')
            .update({ active: active })
            .eq('id', keyId);

        if (error) throw error;

        await loadGeminiKeys();
    } catch (err) {
        alert('خطا: ' + err.message);
    }
};


function renderUI() {
    const s = window._settings || {};

    app.innerHTML = `
        <div class="card">
            <h2>📊 آمار پرداخت‌ها</h2>
            <div class="stats">
                <div class="stat y">
                    <b id="stP">0</b>
                    <span>در انتظار</span>
                </div>
                <div class="stat g">
                    <b id="stA">0</b>
                    <span>تایید شده</span>
                </div>
                <div class="stat r">
                    <b id="stR">0</b>
                    <span>رد شده</span>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>⚙️ تنظیمات قیمت و مدت زمان</h2>
            <div class="settings">
                <div class="field">
                    <label>قیمت پلن حرفه‌ای (تومان)</label>
                    <input type="number" id="proPrice" value="${esc(s.pro_price || '490000')}">
                </div>
                <div class="field">
                    <label>قیمت پلن کسب‌وکار (تومان)</label>
                    <input type="number" id="bizPrice" value="${esc(s.business_price || '990000')}">
                </div>
                <div class="field">
                    <label>مدت پلن تست (روز)</label>
                    <input type="number" id="trialDays" value="${esc(s.trial_days || '3')}">
                </div>
                <div class="field">
                    <label>مدت پلن‌های اصلی (روز)</label>
                    <input type="number" id="planDays" value="${esc(s.pro_days || '30')}">
                </div>
            </div>
            <button class="btn-save" id="saveBtn">💾 ذخیره تنظیمات</button>
            <p class="msg" id="saveMsg"></p>
        </div>

        <!-- 🆕 کلیدهای Gemini -->
        <div class="card">
            <h2>🔑 کلیدهای Gemini</h2>
            <div id="keysList" style="display:flex;flex-direction:column;">
                <div class="loading" style="padding:20px;font-size:13px;">در حال بارگذاری...</div>
            </div>
        </div>

        <!-- 🆕 سایت‌های متصل -->
        <div class="card">
            <h2>🌐 سایت‌های متصل</h2>
            <div id="sitesList" style="display:flex;flex-direction:column;">
                <div class="loading" style="padding:20px;font-size:13px;">در حال بارگذاری...</div>
            </div>
        </div>

        <div class="tabs">
            <button class="tab active" data-f="pending">⏳ در انتظار</button>
            <button class="tab" data-f="approved">✅ تایید شده</button>
            <button class="tab" data-f="rejected">❌ رد شده</button>
            <button class="tab" data-f="all">📋 همه</button>
        </div>

        <div id="list"></div>
    `;

    document.getElementById('saveBtn').onclick = saveSettings;

    document.querySelectorAll('.tab').forEach(tab => {
        tab.onclick = () => {
            document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
            tab.classList.add('active');
            filter = tab.dataset.f;
            renderList();
        };
    });

    updateStats();
    renderList();

    // 🆕 دوباره لود کن چون DOM جدید ساخته شده
    loadGeminiKeys();
    loadSites();
}


function updateStats() {
    document.getElementById('stP').textContent =
        all.filter(p => p.status === 'pending').length;

    document.getElementById('stA').textContent =
        all.filter(p => p.status === 'approved').length;

    document.getElementById('stR').textContent =
        all.filter(p => p.status === 'rejected').length;
}


function renderList() {
    const list = document.getElementById('list');

    const items = filter === 'all'
        ? all
        : all.filter(p => p.status === filter);

    if (!items.length) {
        list.innerHTML = `
            <div class="empty">
                📭 هیچ پرداختی نیست
            </div>
        `;
        return;
    }

    list.innerHTML = '';

    items.forEach(payment => {
        const badge = payment.status === 'pending'
            ? '⏳ در انتظار'
            : payment.status === 'approved'
                ? '✅ تایید'
                : '❌ رد';

        const date = payment.created_at
            ? new Date(payment.created_at).toLocaleString('fa-IR')
            : '-';

        const actions = payment.status === 'pending'
            ? `
                <div class="actions">
                    <button class="btn btn-ok" data-approve="${esc(payment.id)}">
                        ✅ تایید و فعال‌سازی
                    </button>
                    <button class="btn btn-no" data-reject="${esc(payment.id)}">
                        ❌ رد
                    </button>
                </div>
            `
            : '';

        const div = document.createElement('div');
        div.className = 'pay ' + esc(payment.status);

        div.innerHTML = `
            <div class="pay-head">
                <div>
                    <div class="pay-user">
                        ${esc(payment.prof?.full_name || 'بدون نام')}
                    </div>
                    <div class="pay-email">
                        ${esc(payment.prof?.email || '-')}
                    </div>
                </div>
                <span class="badge ${esc(payment.status)}">
                    ${badge}
                </span>
            </div>

            <div class="pay-info">
                <div>
                    <span>پلن</span>
                    <span>${esc(payment.plan_name || '-')}</span>
                </div>
                <div>
                    <span>مبلغ</span>
                    <span>
                        ${parseInt(payment.amount || 0, 10).toLocaleString('fa-IR')}
                        تومان
                    </span>
                </div>
                <div>
                    <span>مدت</span>
                    <span>${esc(payment.days || 30)} روز</span>
                </div>
                <div>
                    <span>کد پیگیری</span>
                    <span class="code">${esc(payment.tracking_code || '-')}</span>
                </div>
                ${payment.description ? `
                    <div>
                        <span>توضیحات</span>
                        <span>${esc(payment.description)}</span>
                    </div>
                ` : ''}
                <div>
                    <span>تاریخ</span>
                    <span style="font-weight:400;font-size:11px;">${date}</span>
                </div>
            </div>

            ${actions}
        `;

        list.appendChild(div);
    });

    list.querySelectorAll('[data-approve]').forEach(button => {
        button.onclick = () => approve(button.dataset.approve, button);
    });

    list.querySelectorAll('[data-reject]').forEach(button => {
        button.onclick = () => reject(button.dataset.reject, button);
    });
}


async function saveSettings() {
    const btn = document.getElementById('saveBtn');
    const msg = document.getElementById('saveMsg');

    btn.disabled = true;
    msg.textContent = 'در حال ذخیره...';
    msg.style.color = '#2563eb';

    try {
        const items = [
            { key: 'pro_price', value: document.getElementById('proPrice').value },
            { key: 'business_price', value: document.getElementById('bizPrice').value },
            { key: 'trial_days', value: document.getElementById('trialDays').value },
            { key: 'pro_days', value: document.getElementById('planDays').value },
            { key: 'business_days', value: document.getElementById('planDays').value }
        ];

        for (const item of items) {
            const { error } = await supabase
                .from('settings')
                .upsert(item, { onConflict: 'key' });

            if (error) throw error;
        }

        msg.textContent = '✅ تنظیمات ذخیره شد';
        msg.style.color = '#16a34a';
        await loadSettings();

    } catch (error) {
        console.error('Settings error:', error);
        msg.textContent = '❌ ' + error.message;
        msg.style.color = '#dc2626';
    } finally {
        btn.disabled = false;
        setTimeout(() => { msg.textContent = ''; }, 3000);
    }
}


async function approve(paymentId, btn) {
    if (!confirm('این پرداخت تایید و اشتراک کاربر فعال شود؟')) return;

    btn.disabled = true;
    btn.textContent = 'در حال تایید...';

    try {
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) throw new Error('جلسه ورود مدیر منقضی شده است.');

        const response = await fetch('/api/approve-payment', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + session.access_token
            },
            body: JSON.stringify({ paymentId: paymentId })
        });

        const result = await response.json().catch(() => ({}));

        if (!response.ok || !result.success) {
            throw new Error(result.error || 'خطا در تایید پرداخت');
        }

        alert('✅ پرداخت تایید شد');

        await loadPayments();
        renderUI();

    } catch (error) {
        console.error('Approve error:', error);
        alert('❌ ' + error.message);
        btn.disabled = false;
        btn.textContent = '✅ تایید و فعال‌سازی';
    }
}


async function reject(paymentId, btn) {
    if (!confirm('این پرداخت رد شود؟')) return;

    btn.disabled = true;
    btn.textContent = 'در حال رد...';

    try {
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) throw new Error('جلسه ورود مدیر منقضی شده است.');

        const { error } = await supabase
            .from('payments')
            .update({ status: 'rejected' })
            .eq('id', paymentId);

        if (error) throw error;

        alert('❌ پرداخت رد شد');

        await loadPayments();
        renderUI();

    } catch (error) {
        console.error('Reject error:', error);
        alert('❌ ' + error.message);
        btn.disabled = false;
        btn.textContent = '❌ رد';
    }
}


init();

</script>
