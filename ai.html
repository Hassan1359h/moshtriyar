<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2563eb">
<title>دستیار فروش | مشتری‌یار</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
<link rel="icon" href="icon-192.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:#f8fafc;color:#0f172a;line-height:1.7;padding-bottom:90px;display:flex;flex-direction:column;height:100vh}
.header{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.05);padding:12px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.header h1{font-size:17px;font-weight:800}
.btn-logout{background:#fee2e2;color:#dc2626;border:none;padding:8px 14px;border-radius:10px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer}
.chat{flex:1;overflow-y:auto;padding:20px;max-width:800px;margin:0 auto;width:100%}
.msg{margin-bottom:16px;display:flex;gap:10px;align-items:flex-start}
.msg.user{flex-direction:row-reverse}
.msg .avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff}
.msg.user .avatar{background:#e2e8f0;color:#475569}
.msg .bubble{background:#fff;padding:12px 16px;border-radius:16px;max-width:75%;box-shadow:0 2px 8px rgba(0,0,0,.05);white-space:pre-wrap;word-wrap:break-word;font-size:14px}
.msg.user .bubble{background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff}
.msg .bubble img{max-width:100%;border-radius:10px;margin-top:8px;display:block}
.suggestions{display:flex;gap:8px;padding:10px 20px;overflow-x:auto;max-width:800px;margin:0 auto;width:100%}
.suggestion{background:#fff;border:2px solid #e2e8f0;border-radius:20px;padding:8px 16px;font-family:inherit;font-size:12px;font-weight:700;white-space:nowrap;cursor:pointer;color:#475569;transition:all .2s}
.suggestion:hover{border-color:#3b82f6;color:#2563eb}
.input-bar{background:#fff;padding:12px 20px;box-shadow:0 -2px 10px rgba(0,0,0,.05);display:flex;gap:10px;align-items:flex-end;position:fixed;bottom:0;right:0;left:0;z-index:100;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.input-bar textarea{flex:1;padding:12px;border:2px solid #e2e8f0;border-radius:16px;font-family:inherit;font-size:14px;resize:none;max-height:120px;background:#f8fafc;color:#0f172a}
.input-bar textarea:focus{outline:none;border-color:#3b82f6;background:#fff}
.input-bar button{background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff;border:none;width:44px;height:44px;border-radius:50%;font-size:18px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.input-bar button:disabled{opacity:.5;cursor:not-allowed}
.msg .actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.msg .actions button{padding:6px 12px;border:none;border-radius:8px;font-family:inherit;font-size:11px;font-weight:700;cursor:pointer}
.msg .act-copy{background:#dbeafe;color:#2563eb}
.msg .act-wa{background:#dcfce7;color:#16a34a}
.msg .act-sms{background:#fef3c7;color:#92400e}  
.typing{display:inline-block;width:8px;height:8px;background:#94a3b8;border-radius:50%;margin:0 2px;animation:typing 1.4s infinite}
.typing:nth-child(2){animation-delay:.2s}
.typing:nth-child(3){animation-delay:.4s}
@keyframes typing{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-6px);opacity:1}}
.loading{text-align:center;padding:20px;color:#94a3b8;font-size:13px}
@media(max-width:600px){.msg .bubble{max-width:85%}.header h1{font-size:15px}}
</style>
</head>
<body>

<header class="header">
    <h1>✨ دستیار فروش</h1>
    <a href="dashboard.html" class="btn-logout" style="text-decoration:none;background:#2563eb;color:#fff;">← داشبورد</a>
</header>

<div class="chat" id="chat">
    <div class="msg">
        <div class="avatar">🤖</div>
        <div class="bubble">سلام! من دستیار فروش تو هستم.

می‌تونم کمکت کنم:
• مشتری چی پرسیده، جواب مناسب بسازم
• عکس و مشخصات محصولاتت رو بفرستم
• پیام فروش حرفه‌ای بنویسم

بنویس مشتری چی گفته 👇</div>
    </div>
</div>
<div style="background:#fff;padding:12px 20px;box-shadow:0 1px 3px rgba(0,0,0,.05);">
    <div style="max-width:800px;margin:0 auto;display:flex;gap:10px;align-items:center;">
        <label style="font-size:13px;font-weight:700;color:#475569;white-space:nowrap;">👤 مشتری:</label>
        <select id="customerSelect" style="flex:1;padding:10px;border:2px solid #e2e8f0;border-radius:10px;font-family:inherit;font-size:14px;background:#f8fafc;">
            <option value="">— بدون مشتری خاص —</option>
        </select>
    </div>
</div>
<div class="suggestions" id="suggestions">
    <button class="suggestion" data-q="مشتری میگه قیمتت بالاست، چی بگم؟">💰 گرونه</button>
    <button class="suggestion" data-q="مشتری میگه باتوم کوهنوردی دارین؟">🎒 محصول دارین؟</button>
    <button class="suggestion" data-q="مشتری جواب نمیده، چطور پیگیری کنم؟">📭 جواب نمیده</button>
    <button class="suggestion" data-q="مشتری میگه بعداً میخرم، چی بگم؟">⏰ بعداً</button>
    <button class="suggestion" data-q="پیام تشکر از خرید بنویس">🙏 تشکر</button>
</div>

<div class="input-bar">
    <textarea id="input" placeholder="بنویس..." rows="1"></textarea>
    <button id="sendBtn">➤</button>
</div>

<script type="module">
import { supabase } from './js/supabase.js';

const $ = id => document.getElementById(id);
let messages = [];
let products = [];
const { data: { session } } = await supabase.auth.getSession();
if (!session) {
    window.location.href = 'login.html';
    throw new Error('No session');
    }

// بارگذاری محصولات
async function loadProducts() {
    const { data } = await supabase
        .from('products')
        .select('*')
        .eq('user_id', session.user.id);
    products = data || [];
}

// اضافه کردن پیام به چت
function addMessage(role, text, imageUrl = null) {
    const div = document.createElement('div');
    div.className = 'msg ' + (role === 'user' ? 'user' : '');
    const avatar = role === 'user' ? '👤' : '🤖';
    let content = text.replace(/\n/g, '<br>');
    if (imageUrl) content += '<img src="' + imageUrl + '">';

    // دکمه‌های عملیات فقط برای پیام‌های AI
    let actionsHtml = '';
    if (role === 'bot') {
        actionsHtml = '<div class="actions">' +
            '<button class="act-copy" onclick="copyMsg(this)">📋 کپی</button>' +
            '<button class="act-wa" onclick="sendWA(this)">📱 واتساپ</button>' +
            '<button class="act-sms" onclick="sendSMS(this)">💬 پیامک</button>' +
            '</div>';
    }

    div.innerHTML = '<div class="avatar">' + avatar + '</div>' +
        '<div class="bubble">' + content + actionsHtml + '</div>';
    $('chat').appendChild(div);
    $('chat').scrollTop = $('chat').scrollHeight;
}
    
// اضافه کردن لودینگ
function addTyping() {
    const div = document.createElement('div');
    div.className = 'msg';
    div.id = 'typing-msg';
    div.innerHTML = `
        <div class="avatar">🤖</div>
        <div class="bubble"><span class="typing"></span><span class="typing"></span><span class="typing"></span></div>
    `;
    $('chat').appendChild(div);
    $('chat').scrollTop = $('chat').scrollHeight;
}

function removeTyping() {
    const el = $('typing-msg');
    if (el) el.remove();
}

// ارسال پیام
async function sendMessage() {
    const text = $('input').value.trim();
    if (!text) return;

    $('input').value = '';
    $('input').style.height = 'auto';

    addMessage('user', text);
    messages.push({ role: 'user', content: text });

    $('sendBtn').disabled = true;
    addTyping();

    try {
        // آماده‌سازی اطلاعات محصولات
        let productContext = '';
        if (products.length) {
            productContext = '\n\nمحصولات موجود من:\n' + products.map(p => 
                `- ${p.name} | مارک: ${p.brand || 'ندارد'} | قیمت: ${(parseInt(p.price) || 0).toLocaleString('fa-IR')} تومان | توضیحات: ${p.description || 'ندارد'} | عکس: ${p.image_url || 'ندارد'}`
            ).join('\n');
        }

        const response = await fetch('/api/ai-chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
    messages: messages,
    products: productContext,
    customerName: window.customerName || ''
}
        });

        const data = await response.json();
        if (!response.ok || !data.success) throw new Error(data.error || 'خطا در پاسخ');

        removeTyping();

        // بررسی اینکه AI عکس فرستاده یا نه
        const imageMatch = data.text.match(/\[IMG:(.*?)\]/);
        let imageUrl = null;
        let cleanText = data.text;

        if (imageMatch) {
    imageUrl = imageMatch[1];
    // لینک رو توی متن نگه دار، ولی فرمتش رو تمیز کن
    cleanText = data.text.replace(/\[IMG:(.*?)\]/g, '📸 عکس: $1').trim();
        }
        
        addMessage('bot', cleanText, imageUrl);
        messages.push({ role: 'assistant', content: data.text });

    } catch (err) {
        removeTyping();
        addMessage('bot', '❌ خطا: ' + err.message);
    } finally {
        $('sendBtn').disabled = false;
    }
}
// کپی پیام AI
window.copyMsg = async function(btn) {
    const bubble = btn.closest('.bubble');
    const clone = bubble.cloneNode(true);
    clone.querySelectorAll('.actions').forEach(el => el.remove());
    const text = clone.innerText.trim();
    try {
        await navigator.clipboard.writeText(text);
        const original = btn.textContent;
        btn.textContent = '✅ کپی شد';
        setTimeout(() => { btn.textContent = original; }, 2000);
    } catch (e) {
        alert('کپی نشد. دستی انتخاب کن.');
    }
};

// ارسال به واتساپ
window.sendWA = function(btn) {
    const bubble = btn.closest('.bubble');
    const clone = bubble.cloneNode(true);
    clone.querySelectorAll('.actions').forEach(el => el.remove());
    clone.querySelectorAll('img').forEach(el => el.remove());
    const text = clone.innerText.trim();

    // اگه شماره مشتری رو داریم، مستقیم به چتش برو
    if (window.customerPhone) {
        let phone = window.customerPhone.replace(/\D/g, '');
        if (phone.startsWith('0')) phone = '98' + phone.substring(1);
        else if (!phone.startsWith('98')) phone = '98' + phone;
        window.location.href = 'whatsapp://send?phone=' + phone + '&text=' + encodeURIComponent(text);
    } else {
        window.location.href = 'whatsapp://send?text=' + encodeURIComponent(text);
    }
};

// ارسال پیامک
window.sendSMS = function(btn) {
    const bubble = btn.closest('.bubble');
    const clone = bubble.cloneNode(true);
    clone.querySelectorAll('.actions').forEach(el => el.remove());
    const text = clone.innerText.trim();
    const url = 'sms:?body=' + encodeURIComponent(text);
    window.location.href = url;
};

// دکمه ارسال
$('sendBtn').onclick = sendMessage;

// Enter برای ارسال
$('input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
});

// بزرگ‌شدن خودکار textarea
$('input').addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

// سناریوهای آماده
document.querySelectorAll('.suggestion').forEach(btn => {
    btn.onclick = () => {
        $('input').value = btn.dataset.q;
        sendMessage();
    };
});

// بارگذاری اولیه
// بارگذاری مشتری‌ها
async function loadCustomers() {
    const { data } = await supabase
        .from('customers')
        .select('id, name, phone')

        .order('name');

    const select = $('customerSelect');
    (data || []).forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.id;
        opt.textContent = c.name + (c.phone ? ' — ' + c.phone : '');
        opt.dataset.phone = c.phone || '';
        opt.dataset.name = c.name || '';
        select.appendChild(opt);
    });
}

// انتخاب مشتری
$('customerSelect').onchange = function() {
    const opt = this.options[this.selectedIndex];
    window.customerPhone = opt.dataset.phone || '';
    window.customerName = opt.dataset.name || '';
};
  
await loadCustomers();
await loadProducts();
</script>
</body>
  </html>
