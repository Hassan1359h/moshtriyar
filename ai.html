<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2563eb">
<title>دستیار فروش | مشتری‌یار</title>

<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<link rel="icon" href="icon-192.png">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0
}

body{
    font-family:Vazirmatn,Tahoma,sans-serif;
    background:#f8fafc;
    color:#0f172a;
    line-height:1.7;
    display:flex;
    flex-direction:column;
    height:100vh;
}

.header{
    background:#fff;
    box-shadow:0 1px 3px rgba(0,0,0,.05);
    padding:12px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-shrink:0;
}

.header h1{
    font-size:17px;
    font-weight:800;
}

.btn-back{
    background:#2563eb;
    color:#fff;
    text-decoration:none;
    padding:8px 14px;
    border-radius:10px;
    font-weight:700;
    font-size:13px;
}

.chat{
    flex:1;
    overflow-y:auto;
    padding:20px;
    max-width:800px;
    margin:0 auto;
    width:100%;
}

.msg{
    margin-bottom:16px;
    display:flex;
    gap:10px;
    align-items:flex-start;
}

.msg.user{
    flex-direction:row-reverse;
}

.msg .avatar{
    width:36px;
    height:36px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    flex-shrink:0;
    background:linear-gradient(135deg,#3b82f6,#8b5cf6);
    color:#fff;
}

.msg.user .avatar{
    background:#e2e8f0;
    color:#475569;
}

.msg .bubble{
    background:#fff;
    padding:12px 16px;
    border-radius:16px;
    max-width:75%;
    box-shadow:0 2px 8px rgba(0,0,0,.05);
    white-space:pre-wrap;
    word-wrap:break-word;
    overflow-wrap:anywhere;
    font-size:14px;
}

.msg.user .bubble{
    background:linear-gradient(135deg,#3b82f6,#8b5cf6);
    color:#fff;
}

.msg .bubble img{
    max-width:100%;
    border-radius:10px;
    margin-top:8px;
    display:block;
}

.msg .actions{
    display:flex;
    gap:6px;
    margin-top:8px;
    flex-wrap:wrap;
}

.msg .actions button{
    padding:6px 12px;
    border:none;
    border-radius:8px;
    font-family:inherit;
    font-size:11px;
    font-weight:700;
    cursor:pointer;
}

.act-copy{
    background:#dbeafe;
    color:#2563eb;
}

.act-wa{
    background:#dcfce7;
    color:#16a34a;
}

.act-sms{
    background:#fef3c7;
    color:#92400e;
}

.suggestions{
    display:flex;
    gap:8px;
    padding:10px 20px;
    overflow-x:auto;
    max-width:800px;
    margin:0 auto;
    width:100%;
    flex-shrink:0;
    scrollbar-width:none;
}

.suggestions::-webkit-scrollbar{
    display:none;
}

.suggestion{
    background:#fff;
    border:2px solid #e2e8f0;
    border-radius:20px;
    padding:8px 16px;
    font-family:inherit;
    font-size:12px;
    font-weight:700;
    white-space:nowrap;
    cursor:pointer;
    color:#475569;
    transition:all .2s;
}

.suggestion:hover{
    border-color:#3b82f6;
    color:#2563eb;
}

.suggestion:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.input-bar{
    background:#fff;
    padding:12px 20px;
    box-shadow:0 -2px 10px rgba(0,0,0,.05);
    display:flex;
    gap:10px;
    align-items:flex-end;
    flex-shrink:0;
}

.input-bar textarea{
    flex:1;
    padding:12px;
    border:2px solid #e2e8f0;
    border-radius:16px;
    font-family:inherit;
    font-size:14px;
    resize:none;
    max-height:120px;
    background:#f8fafc;
    color:#0f172a;
}

.input-bar textarea:focus{
    outline:none;
    border-color:#3b82f6;
    background:#fff;
}

.input-bar button{
    background:linear-gradient(135deg,#3b82f6,#8b5cf6);
    color:#fff;
    border:none;
    width:44px;
    height:44px;
    border-radius:50%;
    font-size:18px;
    cursor:pointer;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
}

.input-bar button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.typing{
    display:inline-block;
    width:8px;
    height:8px;
    background:#94a3b8;
    border-radius:50%;
    margin:0 2px;
    animation:typing 1.4s infinite;
}

.typing:nth-child(2){
    animation-delay:.2s;
}

.typing:nth-child(3){
    animation-delay:.4s;
}

@keyframes typing{
    0%,60%,100%{
        transform:translateY(0);
        opacity:.4
    }

    30%{
        transform:translateY(-6px);
        opacity:1
    }
}

@media(max-width:600px){
    .msg .bubble{
        max-width:85%;
    }

    .header h1{
        font-size:15px;
    }

    .suggestions{
        padding:8px 12px;
    }

    .input-bar{
        padding:10px 12px;
    }
}
</style>
</head>

<body>

<header class="header">
    <h1>✨ دستیار فروش</h1>
    <a href="dashboard.html" class="btn-back">← داشبورد</a>
</header>

<div class="chat" id="chat">

    <div class="msg">
        <div class="avatar">🤖</div>

        <div class="bubble">
سلام! من دستیار فروش تو هستم.

می‌تونم کمکت کنم:
• جواب مناسب برای مشتری بسازم
• محصول مناسب پیشنهاد بدم
• قیمت و مشخصات محصول رو بررسی کنم
• پیام فروش حرفه‌ای بنویسم

بنویس مشتری چی گفته 👇
        </div>
    </div>

</div>

<div class="suggestions" id="suggestions">

    <button class="suggestion"
        data-q="مشتری میگه قیمتت بالاست، چی بگم؟">
        💰 گرونه
    </button>

    <button class="suggestion"
        data-q="مشتری میگه باتوم کوهنوردی دارین؟">
        🎒 محصول دارین؟
    </button>

    <button class="suggestion"
        data-q="مشتری جواب نمیده، چطور پیگیری کنم؟">
        📭 جواب نمیده
    </button>

    <button class="suggestion"
        data-q="مشتری میگه بعداً میخرم، چی بگم؟">
        ⏰ بعداً
    </button>

    <button class="suggestion"
        data-q="پیام تشکر از خرید بنویس">
        🙏 تشکر
    </button>

</div>

<div class="input-bar">

    <textarea
        id="input"
        placeholder="بنویس..."
        rows="1"></textarea>

    <button id="sendBtn" type="button">➤</button>

</div>


<script type="module">

import { supabase } from './js/supabase.js';


/* =========================
   ابزار انتخاب المنت
========================= */

const $ = id => document.getElementById(id);


/* =========================
   متغیرها
========================= */

let messages = [];
let products = [];
let customerName = "";


/* =========================
   بررسی ورود کاربر
========================= */

const {
    data: { session },
    error: sessionError
} = await supabase.auth.getSession();

if (sessionError) {
    console.error("Session error:", sessionError);
}

if (!session) {
    window.location.href = 'login.html';
    throw new Error('No session');
}


/* =========================
   دریافت نام کاربر
========================= */

async function loadProfile(){

    try{

        const { data, error } = await supabase
            .from('profiles')
            .select('full_name')
            .eq('id', session.user.id)
            .maybeSingle();

        if(error){
            console.warn("Profile error:", error);
            return;
        }

        customerName =
            data?.full_name ||
            session.user.user_metadata?.full_name ||
            "";

    }catch(error){

        console.warn("Profile load failed:", error);

    }
}


/* =========================
   دریافت محصولات
========================= */

async function loadProducts(){

    try{

        const { data, error } = await supabase
            .from('products')
            .select('*');

        if(error){

            console.error("Products error:", error);

            addMessage(
                'bot',
                '⚠️ محصولات شما بارگذاری نشدند، اما می‌توانید سؤال خود را از دستیار بپرسید.'
            );

            products = [];
            return;
        }

        products = Array.isArray(data) ? data : [];

        console.log("Products loaded:", products.length);

    }catch(error){

        console.error("Products load error:", error);

        products = [];
    }
}


/* =========================
   ساخت متن محصولات
========================= */

function buildProductContext(){

    if(!products.length){
        return "";
    }

    return "\n\nمحصولات موجود من:\n" +

        products.map((p, index) => {

            const price =
                Number(p.price || 0).toLocaleString('fa-IR');

            return `
${index + 1}) نام محصول: ${p.name || 'بدون نام'}
مارک: ${p.brand || 'ندارد'}
قیمت: ${price} تومان
توضیحات: ${p.description || 'ندارد'}
IMAGE_URL: ${p.image_url || 'ندارد'}
`;

        }).join("\n");

}


/* =========================
   اضافه کردن پیام
========================= */

function addMessage(role, text, imageUrl = null){

    const div = document.createElement('div');

    div.className =
        'msg ' + (role === 'user' ? 'user' : '');

    const avatar =
        role === 'user' ? '👤' : '🤖';


    const bubble = document.createElement('div');

    bubble.className = 'bubble';


    /*
     * استفاده از textContent برای امنیت
     * و حفظ خطوط
     */

    const textDiv = document.createElement('div');

    textDiv.textContent = text || "";

    bubble.appendChild(textDiv);


    /*
     * عکس محصول
     */

    if(imageUrl){

        const img = document.createElement('img');

        img.src = imageUrl;
        img.alt = "عکس محصول";
        img.loading = "lazy";

        img.onerror = function(){
            this.remove();
        };

        bubble.appendChild(img);
    }


    /*
     * دکمه‌های پاسخ AI
     */

    if(role === 'bot'){

        const actions = document.createElement('div');

        actions.className = 'actions';


        const copyBtn = document.createElement('button');

        copyBtn.className = 'act-copy';
        copyBtn.textContent = '📋 کپی';

        copyBtn.onclick = function(){
            copyMsg(this);
        };


        const waBtn = document.createElement('button');

        waBtn.className = 'act-wa';
        waBtn.textContent = '📱 واتساپ';

        waBtn.onclick = function(){
            sendWA(this);
        };


        const smsBtn = document.createElement('button');

        smsBtn.className = 'act-sms';
        smsBtn.textContent = '💬 پیامک';

        smsBtn.onclick = function(){
            sendSMS(this);
        };


        actions.appendChild(copyBtn);
        actions.appendChild(waBtn);
        actions.appendChild(smsBtn);

        bubble.appendChild(actions);
    }


    const avatarDiv = document.createElement('div');

    avatarDiv.className = 'avatar';
    avatarDiv.textContent = avatar;


    div.appendChild(avatarDiv);
    div.appendChild(bubble);

    $('chat').appendChild(div);

    $('chat').scrollTop = $('chat').scrollHeight;
}


/* =========================
   حالت در حال پاسخ
========================= */

function addTyping(){

    const div = document.createElement('div');

    div.className = 'msg';
    div.id = 'typing-msg';


    div.innerHTML = `
        <div class="avatar">🤖</div>

        <div class="bubble">
            <span class="typing"></span>
            <span class="typing"></span>
            <span class="typing"></span>
        </div>
    `;


    $('chat').appendChild(div);

    $('chat').scrollTop =
        $('chat').scrollHeight;
}


function removeTyping(){

    const el = $('typing-msg');

    if(el){
        el.remove();
    }
}


/* =========================
   ارسال پیام به AI
========================= */

async function sendMessage(){

    const text =
        $('input').value.trim();


    if(!text){
        return;
    }


    /*
     * پاک کردن ورودی
     */

    $('input').value = '';
    $('input').style.height = 'auto';


    /*
     * نمایش پیام کاربر
     */

    addMessage(
        'user',
        text
    );


    /*
     * ذخیره تاریخچه
     */

    messages.push({
        role: 'user',
        content: text
    });


    /*
     * غیرفعال کردن دکمه‌ها
     */

    $('sendBtn').disabled = true;

    document
        .querySelectorAll('.suggestion')
        .forEach(btn => {
            btn.disabled = true;
        });


    addTyping();


    try{

        /*
         * ساخت اطلاعات محصولات
         */

        const productContext =
            buildProductContext();


        console.log(
            "Sending AI request...",
            {
                messageCount: messages.length,
                products: products.length
            }
        );


        /*
         * ارسال درخواست به Vercel API
         */

        const response = await fetch(
            '/api/ai-chat',
            {
                method: 'POST',

                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },

                body: JSON.stringify({

                    messages: messages,

                    products: productContext,

                    customerName: customerName

                })
            }
        );


        /*
         * تلاش برای خواندن JSON
         */

        let data = null;

        try{

            data = await response.json();

        }catch(jsonError){

            throw new Error(
                'پاسخ نامعتبر از سرور دریافت شد'
            );
        }


        /*
         * بررسی خطای API
         */

        if(!response.ok){

            throw new Error(
                data?.error ||
                `خطای سرور (${response.status})`
            );
        }


        if(!data || !data.success){

            throw new Error(
                data?.error ||
                'پاسخی از هوش مصنوعی دریافت نشد'
            );
        }


        /*
         * متن پاسخ
         */

        const aiText =
            String(data.text || '').trim();


        if(!aiText){

            throw new Error(
                'هوش مصنوعی پاسخ خالی ارسال کرد'
            );
        }


        /*
         * حذف حالت تایپ
         */

        removeTyping();


        /*
         * پیدا کردن لینک عکس
         */

        const imgRegex =
            /(https?:\/\/[^\s<>"']+\.(?:png|jpe?g|webp|gif)(?:\?[^\s<>"']*)?)/i;


        const imageMatch =
            aiText.match(imgRegex);


        let imageUrl = null;

        let cleanText = aiText;


        if(imageMatch){

            imageUrl = imageMatch[1];

            cleanText =
                aiText
                    .replace(imageMatch[0], '')
                    .trim();
        }


        /*
         * نمایش پاسخ
         */

        addMessage(
            'bot',
            cleanText,
            imageUrl
        );


        /*
         * ذخیره پاسخ AI در تاریخچه
         */

        messages.push({
            role: 'assistant',
            content: aiText
        });


    }catch(error){

        console.error(
            'AI ERROR:',
            error
        );


        removeTyping();


        addMessage(
            'bot',
            '❌ خطا در اتصال به دستیار هوشمند:\n\n' +
            (error?.message ||
            'خطای نامشخص')
        );


    }finally{

        $('sendBtn').disabled = false;


        document
            .querySelectorAll('.suggestion')
            .forEach(btn => {
                btn.disabled = false;
            });
    }
}


/* =========================
   کپی پاسخ
========================= */

async function copyMsg(btn){

    const bubble =
        btn.closest('.bubble');


    if(!bubble){
        return;
    }


    const textElement =
        bubble.querySelector('div');


    const text =
        textElement?.innerText?.trim() || '';


    try{

        await navigator.clipboard.writeText(text);


        const original =
            btn.textContent;


        btn.textContent =
            '✅ کپی شد';


        setTimeout(() => {

            btn.textContent =
                original;

        }, 2000);


    }catch(error){

        console.error(error);

        alert(
            'کپی نشد. لطفاً متن را دستی انتخاب کنید.'
        );
    }
}


/* =========================
   ارسال واتساپ
========================= */

function sendWA(btn){

    const bubble =
        btn.closest('.bubble');


    if(!bubble){
        return;
    }


    const textElement =
        bubble.querySelector('div');


    const text =
        textElement?.innerText?.trim() || '';


    if(!text){
        return;
    }


    window.location.href =
        'whatsapp://send?text=' +
        encodeURIComponent(text);
}


/* =========================
   ارسال پیامک
========================= */

function sendSMS(btn){

    const bubble =
        btn.closest('.bubble');


    if(!bubble){
        return;
    }


    const textElement =
        bubble.querySelector('div');


    const text =
        textElement?.innerText?.trim() || '';


    if(!text){
        return;
    }


    window.location.href =
        'sms:?body=' +
        encodeURIComponent(text);
}


/* =========================
   دکمه ارسال
========================= */

$('sendBtn').addEventListener(
    'click',
    sendMessage
);


/* =========================
   Enter برای ارسال
========================= */

$('input').addEventListener(
    'keydown',
    function(e){

        if(
            e.key === 'Enter' &&
            !e.shiftKey
        ){

            e.preventDefault();

            sendMessage();
        }
    }
);


/* =========================
   تغییر ارتفاع Textarea
========================= */

$('input').addEventListener(
    'input',
    function(){

        this.style.height =
            'auto';

        this.style.height =
            Math.min(
                this.scrollHeight,
                120
            ) + 'px';
    }
);


/* =========================
   دکمه‌های آماده
========================= */

document
    .querySelectorAll('.suggestion')
    .forEach(btn => {

        btn.addEventListener(
            'click',
            function(){

                const question =
                    this.dataset.q || '';


                if(!question){
                    return;
                }


                $('input').value =
                    question;


                sendMessage();
            }
        );
    });


/* =========================
   شروع صفحه
========================= */

await loadProfile();

await loadProducts();

</script>

</body>
</html>
