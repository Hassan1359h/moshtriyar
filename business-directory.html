
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2563eb">
<title>معرفی کسب‌وکارها | مشتری‌یار</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f8fafc;color:#0f172a;font-family:Vazirmatn,Tahoma,sans-serif}
header{background:#fff;border-bottom:1px solid #e2e8f0;padding:16px}
.header-inner{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
a{text-decoration:none;color:#2563eb;font-weight:700}
h1{font-size:22px;margin:0}
main{max-width:1100px;margin:25px auto;padding:0 15px}
.intro{color:#64748b;font-size:14px}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin:20px 0}
input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:11px;font:inherit;background:white}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:15px}
.card{background:white;border:1px solid #e2e8f0;border-radius:16px;overflow:hidden;box-shadow:0 3px 12px #00000008}
.cover{height:135px;background:linear-gradient(135deg,#dbeafe,#f1f5f9);display:flex;align-items:center;justify-content:center;font-size:42px;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover}
.content{padding:14px}
.name{font-size:16px;font-weight:900;margin:0 0 5px;overflow-wrap:anywhere}
.meta{font-size:12px;color:#64748b;margin-bottom:10px}
.description{font-size:12px;color:#475569;min-height:37px;line-height:1.8;overflow-wrap:anywhere}
.rating{display:flex;align-items:center;gap:7px;margin:12px 0}
.stars{font-size:21px;color:#f59e0b;letter-spacing:1px;direction:ltr}
.score{font-size:12px;color:#64748b}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.vote{font:inherit;font-size:12px;font-weight:800;padding:9px 5px;border-radius:9px;border:1px solid #e2e8f0;background:#f8fafc;color:#64748b}
.vote:disabled{cursor:not-allowed;opacity:.8}
.website{display:inline-block;font-size:12px;margin-top:8px;overflow-wrap:anywhere}
#status{text-align:center;color:#64748b;margin:25px 0}
#more{display:none;margin:20px auto;background:#2563eb;color:white;border:0;border-radius:10px;padding:11px 25px;font:inherit;font-weight:800;cursor:pointer}
@media(max-width:600px){.filters{grid-template-columns:1fr 1fr}.filters input:first-child{grid-column:1/-1}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.cover{height:100px}.content{padding:10px}.name{font-size:13px}.actions{gap:4px}.vote{font-size:10px;padding:8px 2px}.stars{font-size:17px}}
  
/* طراحی جدید کارت‌های کسب‌وکار */

.cards{
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:18px;
}

.card{
    border-radius:20px;
    border:1px solid #e2e8f0;
    box-shadow:0 6px 24px rgba(15,23,42,.06);
}

.cover{
    height:auto;
    aspect-ratio:16/9;
    background:#f1f5f9;
}


.cover img{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center top;
    background:#f1f5f9;
}
  
.content{
    padding:16px;
}

.name{
    font-size:17px;
    margin-bottom:5px;
}

.meta{
    font-size:12px;
    margin-bottom:12px;
}

.description{
    font-size:13px;
    line-height:1.9;
    min-height:0;
    display:-webkit-box;
    -webkit-box-orient:vertical;
    -webkit-line-clamp:3;
    overflow:hidden;
    margin-bottom:12px;
}

.rating{
    display:flex;
    flex-wrap:wrap;
    justify-content:space-between;
    gap:8px;
    padding:12px 0;
    margin:12px 0;
    border-top:1px solid #f1f5f9;
    border-bottom:1px solid #f1f5f9;
}

.stars{
    font-size:23px;
    white-space:nowrap;
}

.score{
    font-size:12px;
}

.actions{
    gap:10px;
}

.vote{
    padding:11px 5px;
    border-radius:11px;
    font-size:12px;
}

.website{
    display:block;
    text-align:center;
    margin:12px 0 0;
    padding:9px;
    border-radius:10px;
    background:#eff6ff;
    color:#2563eb;
    font-size:12px;
}

/* موبایل: کارت تمام عرض صفحه */
@media(max-width:600px){
    main{
        padding:0 14px;
    }

    .cards{
        grid-template-columns:minmax(0,1fr);
        gap:16px;
    }

    .card{
        width:100%;
    }

    .cover{
        aspect-ratio:16/9;
        height:auto;
    }

    .content{
        padding:15px;
    }

    .name{
        font-size:17px;
    }

    .stars{
        font-size:22px;
    }

    .vote{
        font-size:12px;
        padding:11px 5px;
    }
}
 
/* فرم پیوستن به مشتریان کسب‌وکار */
.join-section {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid #e2e8f0;
}

.join-toggle {
    width: 100%;
    padding: 12px;
    border: 0;
    border-radius: 11px;
    background: #2563eb;
    color: white;
    font: inherit;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
}

.join-form {
    margin-top: 12px;
    padding: 12px;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
}

.join-form label {
    display: block;
    margin: 10px 0 5px;
    font-size: 12px;
    font-weight: 700;
}

.join-form input[type="text"],
.join-form input[type="tel"] {
    width: 100%;
    padding: 11px;
    border: 1px solid #cbd5e1;
    border-radius: 9px;
    font: inherit;
    background: white;
}

.join-consent {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin: 12px 0;
    font-size: 11px;
    line-height: 1.8;
}

.join-consent input {
    margin-top: 5px;
}

.join-submit {
    width: 100%;
    padding: 11px;
    border: 0;
    border-radius: 9px;
    background: #16a34a;
    color: white;
    font: inherit;
    font-weight: 800;
    cursor: pointer;
}

.join-submit:disabled {
    opacity: .6;
}

.join-message {
    font-size: 12px;
    line-height: 1.8;
    margin-top: 10px;
}
 
</style>
</head>
<body>

<header>
<div class="header-inner">
<h1>🏪 کسب‌وکارهای مشتری‌یار</h1>
<a href="index.html">صفحه اصلی ←</a>
</div>
</header>

<main>
<p class="intro">کسب‌وکارها و وب‌سایت‌های عضو مشتری‌یار را بشناسید و امتیاز مشتریان را ببینید.</p>

<div class="filters">
<input id="search" placeholder="🔍 جست‌وجوی نام کسب‌وکار">
<input id="category" placeholder="نوع فعالیت">
<input id="city" placeholder="شهر یا استان">
</div>

<div id="cards" class="cards"></div>
<div id="status">در حال دریافت کسب‌وکارها...</div>
<button id="more" type="button">نمایش موارد بیشتر</button>
</main>

<script type="module">
import { supabase } from './js/supabase.js';

const $ = id => document.getElementById(id);
const PAGE_SIZE = 20;

let offset = 0;
let loading = false;
let requestVersion = 0;

function escapeHTML(value) {
    return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'
    })[char]);
}

function safeURL(value) {
    try {
        const url = new URL(value);
        return ['https:', 'http:'].includes(url.protocol) ? url.href : '';
    } catch {
        return '';
    }
}

function stars(score) {
    const rounded = Math.max(0, Math.min(5, Math.round(score)));
    return '★'.repeat(rounded) + '☆'.repeat(5 - rounded);
}

function renderCard(b, rating) {
    const image = safeURL(b.image_url);
    const website = safeURL(b.website_url);
    const score = Number(rating?.rating || 0);
    const count = Number(rating?.total_votes || 0);

    const cover = image
        ? `<img src="${escapeHTML(image)}" alt="${escapeHTML(b.business_name)}" loading="lazy" onerror="this.style.display='none'">`
        : '🏪';

    const location = [b.province, b.city].filter(Boolean).join('، ');

    return `
    <article class="card" id="business-${escapeHTML(b.id)}" data-business-id="${escapeHTML(b.id)}">
        <div class="cover">${cover}</div>

        <div class="content">
            <h2 class="name">${escapeHTML(b.business_name)}</h2>

            <div class="meta">
                ${escapeHTML(b.category || 'سایر فعالیت‌ها')}
                ${location ? ' | ' + escapeHTML(location) : ''}
            </div>

            <div class="description">
                ${escapeHTML(b.description || 'معرفی کسب‌وکار عضو مشتری‌یار')}
            </div>

            ${website ? `<a class="website" href="${escapeHTML(website)}" target="_blank" rel="noopener noreferrer">🌐 مشاهده وب‌سایت</a>` : ''}

            <div class="rating">
                <span class="stars" aria-label="امتیاز ${score} از ۵">${stars(score)}</span>
                <span class="score">${score.toFixed(1)} از ۵ (${count} رأی)</span>
            </div>

            <div class="actions">
                <button type="button" class="vote"
                    data-business-id="${escapeHTML(b.id)}"
                    data-satisfied="true">
                    👍 راضی هستم
                </button>

                <button type="button" class="vote"
                    data-business-id="${escapeHTML(b.id)}"
                    data-satisfied="false">
                    👎 ناراضی هستم
                </button>
            </div>

            <div class="join-section">
                <button type="button"
                    class="join-toggle"
                    data-join-toggle
                    aria-expanded="false">
                    🤝 پیوستن به مشتریان این کسب‌وکار
                </button>

                <form class="join-form" data-register-form hidden>
                    <label>نام و نام خانوادگی</label>
                    <input type="text"
                        name="name"
                        maxlength="100"
                        placeholder="نام خود را وارد کنید"
                        required>

                    <label>شماره موبایل</label>
                    <input type="tel"
                        name="phone"
                        inputmode="tel"
                        maxlength="20"
                        placeholder="مثلاً 09123456789"
                        required>

                    <label class="join-consent">
                        <input type="checkbox" name="consent" required>
                        <span>
                            رضایت دارم نام و شماره موبایلم در فهرست مشتریان این کسب‌وکار ثبت شود.
                        </span>
                    </label>

                    <button type="submit" class="join-submit">
                        ثبت و پیوستن
                    </button>

                    <div class="join-message" role="status" aria-live="polite"></div>
                </form>
            </div>
        </div>
    </article>`;
}

async function loadBusinesses(reset = false) {
    if (loading && !reset) return;

    const version = ++requestVersion;
    loading = true;

    if (reset) {
        offset = 0;
        $('cards').innerHTML = '';
    }

    $('more').style.display = 'none';
    $('status').textContent = 'در حال دریافت کسب‌وکارها...';

    try {
        let query = supabase
            .from('business_directory')
            .select('id,business_name,category,province,city,website_url,image_url,description,created_at')
            .eq('is_published', true)
            .order('created_at', { ascending: false })
            .order('id', { ascending: false })
            .range(offset, offset + PAGE_SIZE - 1);

        const search = $('search').value.trim();
        const category = $('category').value.trim();
        const city = $('city').value.trim();

        if (search) query = query.ilike('business_name', '%' + search.replace(/[%_]/g, '') + '%');
        if (category) query = query.ilike('category', '%' + category.replace(/[%_]/g, '') + '%');
        if (city) {
            const value = '%' + city.replace(/[%_,()]/g, '') + '%';
            query = query.or(`city.ilike.${value},province.ilike.${value}`);
        }

        const { data: businesses, error } = await query;
        if (error) throw error;
        if (version !== requestVersion) return;

        const ids = (businesses || []).map(b => b.id);
        let ratingMap = {};

        if (ids.length) {
            const result = await supabase
                .from('business_ratings')
                .select('business_id,total_votes,rating')
                .in('business_id', ids);

            if (result.error) throw result.error;
            if (version !== requestVersion) return;

            ratingMap = Object.fromEntries(
                (result.data || []).map(r => [r.business_id, r])
            );
        }

        $('cards').insertAdjacentHTML(
    'beforeend',
    (businesses || []).map(b => renderCard(b, ratingMap[b.id])).join('')
);

// پیدا کردن و برجسته‌کردن کارت اختصاصی از طریق لینک
const targetBusinessId = new URLSearchParams(window.location.search).get('business');

if (targetBusinessId && (businesses || []).some(b => b.id === targetBusinessId)) {
    const targetCard = document.getElementById(`business-${targetBusinessId}`);

    if (targetCard) {
        targetCard.style.border = '2px solid #2563eb';
        targetCard.style.boxShadow = '0 0 0 4px #dbeafe';

        setTimeout(() => {
            targetCard.scrollIntoView({
                behavior: 'smooth',
                block: 'center'
            });
        }, 300);
    }
}

        offset += (businesses || []).length;

        $('status').textContent = offset
            ? `${offset} کسب‌وکار نمایش داده شد.`
            : 'هنوز کسب‌وکار منتشرشده‌ای با این مشخصات پیدا نشد.';

        $('more').style.display =
            businesses?.length === PAGE_SIZE ? 'block' : 'none';

    } catch (err) {
        console.error(err);
        if (version === requestVersion) {
            $('status').textContent = '❌ دریافت اطلاعات ناموفق بود: ' + err.message;
        }
    } finally {
        if (version === requestVersion) loading = false;
    }
}

let debounce;
['search', 'category', 'city'].forEach(id => {
    $(id).addEventListener('input', () => {
        clearTimeout(debounce);
        debounce = setTimeout(() => loadBusinesses(true), 350);
    });
});

$('more').addEventListener('click', () => loadBusinesses());
  
// باز و بسته کردن فرم پیوستن به مشتریان
$('cards').addEventListener('click', (event) => {
    const toggle = event.target.closest('[data-join-toggle]');
    if (!toggle) return;

    const card = toggle.closest('.card');
    const form = card.querySelector('[data-register-form]');

    form.hidden = !form.hidden;
    toggle.setAttribute('aria-expanded', String(!form.hidden));

    if (!form.hidden) {
        form.querySelector('[name="name"]').focus();
    }
});

// ارسال اطلاعات به API ثبت مشتری
$('cards').addEventListener('submit', async (event) => {
    const form = event.target.closest('[data-register-form]');
    if (!form) return;

    event.preventDefault();

    if (!form.reportValidity()) return;

    const card = form.closest('.card');
    const button = form.querySelector('.join-submit');
    const message = form.querySelector('.join-message');

    const formData = new FormData(form);

    button.disabled = true;
    button.textContent = 'در حال ثبت اطلاعات...';
    message.textContent = '';

    try {
        const response = await fetch('/api/website-chat', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                action: 'register_card_customer',
                businessCardId: card.dataset.businessId,
                name: String(formData.get('name') || '').trim(),
                phone: String(formData.get('phone') || '').trim(),
                consent: formData.get('consent') === 'on'
            })
        });

        const result = await response.json();

        if (!response.ok || !result.success) {
            throw new Error(result.message || 'ثبت اطلاعات انجام نشد.');
        }

        message.style.color = '#15803d';
        message.textContent = '✅ ' + result.message;
        form.reset();

    } catch (error) {
        message.style.color = '#dc2626';
        message.textContent = '❌ ' + error.message;

    } finally {
        button.disabled = false;
        button.textContent = 'ثبت و پیوستن';
    }
});

// مدیریت رأی‌گیری کسب‌وکارها
$('cards').addEventListener('click', async (event) => {
    const button = event.target.closest('button[data-business-id]');
    if (!button || button.disabled) return;

    const businessId = button.dataset.businessId;
    const satisfied = button.dataset.satisfied === 'true';

    const card = button.closest('.card');
    const buttons = card.querySelectorAll('.vote');

    // بررسی ورود کاربر
    const { data: { session }, error: sessionError } =
        await supabase.auth.getSession();

    if (sessionError || !session?.user) {
        alert('برای ثبت رأی ابتدا وارد حساب کاربری خود شوید.');
        window.location.href = 'login.html';
        return;
    }

    const voterId = session.user.id;

    buttons.forEach(btn => btn.disabled = true);

    try {
        // بررسی رأی قبلی کاربر
        const { data: previousVote, error: readError } = await supabase
            .from('business_votes')
            .select('id,satisfied')
            .eq('business_id', businessId)
            .eq('voter_id', voterId)
            .maybeSingle();

        if (readError) throw readError;

        if (previousVote) {
            // اگر کاربر قبلاً رأی داده، رأی او تغییر می‌کند.
            if (previousVote.satisfied === satisfied) {
                alert('شما قبلاً همین رأی را ثبت کرده‌اید.');
                return;
            }
const { data: updatedVotes, error: updateError } = await supabase
    .from('business_votes')
    .update({ satisfied })
    .eq('id', previousVote.id)
    .eq('voter_id', voterId)
    .select('id,satisfied');

if (updateError) throw updateError;

if (!updatedVotes || updatedVotes.length !== 1) {
    throw new Error('رأی قبلی پیدا شد، اما اجازه تغییر آن وجود نداشت یا هیچ ردیفی تغییر نکرد.');
}

if (updatedVotes[0].satisfied !== satisfied) {
    throw new Error('مقدار رأی پس از ذخیره با مقدار درخواستی مطابقت ندارد.');
}

        } else {
            // ثبت اولین رأی
            const { error: insertError } = await supabase
                .from('business_votes')
                .insert({
                    business_id: businessId,
                    voter_id: voterId,
                    satisfied
                });

            if (insertError) throw insertError;
        }

        alert('✅ رأی شما با موفقیت ثبت شد.');

        // دریافت امتیاز جدید از View
        const { data: updatedRating, error: ratingError } = await supabase
            .from('business_ratings')
            .select('rating,total_votes')
            .eq('business_id', businessId)
            .maybeSingle();

        if (ratingError) throw ratingError;

        if (updatedRating) {
            const score = Number(updatedRating.rating || 0);
            const count = Number(updatedRating.total_votes || 0);

            card.querySelector('.stars').textContent = stars(score);
            card.querySelector('.score').textContent =
                `${score.toFixed(1)} از ۵ (${count} رأی)`;
        }

    } catch (err) {
        console.error('Business voting error:', err);
        alert('ثبت رأی انجام نشد: ' + (err.message || 'خطای نامشخص'));
    } finally {
        buttons.forEach(btn => btn.disabled = false);
    }
});

loadBusinesses(true);
</script>
</body>
</html>
