<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2563eb">
<title>انتخاب کسب‌وکار | مشتری‌یار</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
<link rel="icon" href="icon-192.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:#f8fafc;color:#0f172a;line-height:1.7;padding:20px}
.container{max-width:900px;margin:0 auto}
.header{text-align:center;padding:30px 20px 20px}
.header .icon{font-size:56px;margin-bottom:12px}
.header h1{font-size:24px;font-weight:900;color:#1e293b;margin-bottom:8px}
.header p{color:#64748b;font-size:14px;max-width:500px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:24px}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
.type-card{background:#fff;border:2px solid #e2e8f0;border-radius:16px;padding:20px;cursor:pointer;transition:.15s;text-align:right;display:flex;align-items:center;gap:14px}
.type-card:hover{border-color:#2563eb;transform:translateY(-2px);box-shadow:0 8px 20px rgba(37,99,235,.12)}
.type-card.selected{border-color:#2563eb;background:#eff6ff;box-shadow:0 0 0 3px rgba(37,99,235,.15)}
.type-icon{font-size:32px;flex-shrink:0}
.type-info{flex:1}
.type-label{font-weight:800;font-size:15px;color:#1e293b;margin-bottom:2px}
.type-desc{font-size:12px;color:#64748b}
.save-bar{position:fixed;bottom:0;right:0;left:0;background:#fff;padding:16px 20px;box-shadow:0 -2px 15px rgba(0,0,0,.08);display:flex;gap:10px;justify-content:center}
.btn-save{max-width:400px;width:100%;padding:16px;background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;border:none;border-radius:14px;font-family:inherit;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 6px 16px rgba(37,99,235,.3);transition:.15s}
.btn-save:disabled{opacity:.5;cursor:not-allowed}
.btn-save:not(:disabled):hover{transform:translateY(-1px)}
.msg{text-align:center;margin-top:12px;font-size:13px;font-weight:700;min-height:20px}
.loading{text-align:center;padding:60px;color:#64748b}
body{padding-bottom:100px}
</style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="icon">🎯</div>
        <h1>کسب‌وکار شما چیست؟</h1>
        <p>با انتخاب نوع کسب‌وکار، مشتری‌یار خودش را با اصطلاحات و امکانات مناسب شما هماهنگ می‌کند.</p>
    </div>

    <div class="grid" id="typeGrid">
        <div class="loading">در حال بارگذاری...</div>
    </div>
</div>

<div class="save-bar">
    <button class="btn-save" id="saveBtn" disabled>💾 ذخیره و ادامه</button>
</div>

<script type="module">
import { supabase } from './js/supabase.js';
import { BUSINESS_TYPES } from './js/labels.js';

const $ = id => document.getElementById(id);
let me = null;
let selected = null;
let currentType = null;

async function init() {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) { window.location.href = 'login.html'; return; }
    me = session.user;

    const { data: profile } = await supabase
        .from('profiles')
        .select('business_type')
        .eq('id', me.id)
        .maybeSingle();

    currentType = profile?.business_type || null;

    renderTypes();
}

function renderTypes() {
    const grid = $('typeGrid');
    grid.innerHTML = '';

    BUSINESS_TYPES.forEach(t => {
        const div = document.createElement('div');
        div.className = 'type-card' + (currentType === t.value ? ' selected' : '');
        div.dataset.value = t.value;
        div.innerHTML =
            '<div class="type-icon">' + t.label.split(' ')[0] + '</div>' +
            '<div class="type-info">' +
                '<div class="type-label">' + t.label.split(' ').slice(1).join(' ') + '</div>' +
                '<div class="type-desc">' + t.desc + '</div>' +
            '</div>';

        div.onclick = () => {
            selected = t.value;
            document.querySelectorAll('.type-card').forEach(c => c.classList.remove('selected'));
            div.classList.add('selected');
            $('saveBtn').disabled = false;
        };

        grid.appendChild(div);
    });

    if (currentType) {
        selected = currentType;
        $('saveBtn').disabled = false;
    }
}

$('saveBtn').onclick = async () => {
    if (!selected) return;

    const btn = $('saveBtn');
    btn.disabled = true;
    btn.textContent = '⏳ در حال ذخیره...';

    const { error } = await supabase
        .from('profiles')
        .update({ business_type: selected })
        .eq('id', me.id);

    if (error) {
        alert('❌ ' + error.message);
        btn.disabled = false;
        btn.textContent = '💾 ذخیره و ادامه';
        return;
    }

    btn.textContent = '✅ ذخیره شد';

    setTimeout(() => {
        window.location.href = 'dashboard.html';
    }, 600);
};

init();
</script>

</body>
</html>
