
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>پرونده ۳۶۰ درجه | مشتری‌یار</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Tahoma, sans-serif;
      background: #f5f7fb;
      color: #172033;
      line-height: 1.9;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    h1 { font-size: 23px; margin: 0; }
    h2 { font-size: 17px; margin: 0 0 15px; }

    .muted { color: #64748b; font-size: 13px; }

    .card {
      background: white;
      border: 1px solid #e5eaf2;
      border-radius: 15px;
      padding: 19px;
      margin-bottom: 16px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 16px;
    }

    .item {
      border-bottom: 1px solid #edf0f5;
      padding: 11px 0;
      overflow-wrap: anywhere;
    }

    .item:last-child { border-bottom: none; }
    .title { font-weight: bold; }
    .empty { color: #64748b; font-size: 14px; }
    .error { color: #b91c1c; }

    .tag {
      display: inline-block;
      padding: 2px 9px;
      background: #eef2ff;
      color: #3730a3;
      border-radius: 20px;
      font-size: 12px;
      margin: 3px;
    }

    a {
      color: #2563eb;
      text-decoration: none;
    }

    .back {
      background: white;
      border: 1px solid #dbe2ed;
      padding: 6px 13px;
      border-radius: 9px;
    }

    .event {
      padding: 12px 16px;
      border-right: 3px solid #6366f1;
      margin: 12px 0;
      background: #f8faff;
      border-radius: 8px;
    }

    /* گفتگوی پیام‌های پرونده */
    .conversation {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid #e5eaf2;
    }

    .conversation-title {
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .message-item {
      background: #f8fafc;
      border: 1px solid #e5eaf2;
      border-radius: 10px;
      padding: 10px 13px;
      margin-bottom: 9px;
    }

    .message-item.manager-message {
      background: #eff6ff;
      border-color: #dbeafe;
    }

    .message-header {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 5px 12px;
      font-size: 11px;
      color: #64748b;
      margin-bottom: 6px;
    }

    .message-sender {
      font-weight: bold;
      color: #2563eb;
    }

    .message-text {
      font-size: 13px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .message-form { margin-top: 12px; }

    .message-input {
      width: 100%;
      min-height: 75px;
      padding: 10px;
      border: 1px solid #dbe2ed;
      border-radius: 9px;
      font-family: Tahoma, sans-serif;
      font-size: 13px;
      resize: vertical;
    }

    .send-message-btn {
      margin-top: 8px;
      padding: 9px 18px;
      background: #2563eb;
      color: white;
      border: 0;
      border-radius: 8px;
      font-family: Tahoma, sans-serif;
      cursor: pointer;
    }

    .send-message-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message-feedback {
      font-size: 12px;
      margin-top: 7px;
    }
  </style>
</head>

<body>
  <main class="container">
    <header>
      <div>
        <h1 id="pageTitle">پرونده ۳۶۰ درجه</h1>
        <div class="muted">نمای یکپارچه سوابق و ارتباطات</div>
      </div>
      <a class="back" href="customers.html">بازگشت به مشتریان</a>
      <button
  id="enableSoundBtn"
  type="button"
  style="background:#15803d;color:white;border:0;border-radius:9px;padding:9px 14px;font-family:Tahoma;cursor:pointer;"
>
  فعال‌سازی صدای اعلان
</button>
    </header>

    <div id="message" class="card muted">
      در حال دریافت اطلاعات...
    </div>

    <div id="content" hidden>
      <section class="card">
        <h2>پنل مشتری</h2>
        <p class="muted">
          برای مشتری دعوت‌نامه دسترسی به پنل اختصاصی ارسال کنید.
        </p>

        <button
          id="inviteCustomerBtn"
          type="button"
          style="background:#2563eb;color:white;border:0;border-radius:9px;padding:11px 20px;font-family:Tahoma;cursor:pointer;"
        >
          دعوت به پنل مشتری
        </button>

        <p id="inviteMessage" class="muted" hidden></p>
      </section>

      <section class="card">
        <h2 id="profileTitle">مشخصات مشتری</h2>
        <div id="profile"></div>
      </section>

      <div class="grid">
        <section class="card">
          <h2 id="financialTitle">سوابق مالی</h2>
          <div id="invoices"></div>
        </section>

        <section class="card">
          <h2 id="casesTitle">خدمات و سوابق</h2>
          <div id="cases"></div>
        </section>

        <section class="card">
          <h2>شکایات و نتیجه رسیدگی</h2>
          <div id="complaints">
            <p class="empty">در حال دریافت شکایات...</p>
          </div>
        </section>

        <section class="card">
          <h2>پیگیری‌ها</h2>
          <div id="followups"></div>
        </section>

        <section class="card">
          <h2>رضایت‌سنجی</h2>
          <div id="feedback"></div>
        </section>
      </div>

      <section class="card">
        <h2>تاریخچه یکپارچه</h2>
        <div id="timeline"></div>
      </section>
    </div>
  </main>

  <script type="module">
    import { supabase } from './js/supabase.js';
    import { checkPlanGuard } from './js/check-plan.js';
    import { getLabels, BUSINESS_FIELDS } from './js/labels.js';
    import { loadBusinessType } from './js/helpers.js';

    const $ = id => document.getElementById(id);
    // صدای اعلان پیام جدید مشتری
let notificationAudioContext = null;
let messagePollTimer = null;
const seenCustomerMessageIds = new Set();

$('enableSoundBtn').addEventListener('click', async () => {
  try {
    const AudioContextClass =
      window.AudioContext || window.webkitAudioContext;

    if (!AudioContextClass) {
      throw new Error('مرورگر از پخش صدای اعلان پشتیبانی نمی‌کند.');
    }

    if (!notificationAudioContext) {
      notificationAudioContext = new AudioContextClass();
    }

    if (notificationAudioContext.state === 'suspended') {
      await notificationAudioContext.resume();
    }

    $('enableSoundBtn').textContent = 'صدای اعلان فعال است';
    $('enableSoundBtn').disabled = true;
    $('enableSoundBtn').style.background = '#64748b';

  } catch (error) {
    alert(error.message || 'فعال‌سازی صدا انجام نشد.');
  }
});

function playNewMessageSound() {
  if (
    !notificationAudioContext ||
    notificationAudioContext.state !== 'running'
  ) return;

  const oscillator = notificationAudioContext.createOscillator();
  const gain = notificationAudioContext.createGain();

  oscillator.type = 'sine';
  oscillator.frequency.setValueAtTime(
    880,
    notificationAudioContext.currentTime
  );

  gain.gain.setValueAtTime(
    0.0001,
    notificationAudioContext.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    0.15,
    notificationAudioContext.currentTime + 0.03
  );

  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    notificationAudioContext.currentTime + 0.25
  );

  oscillator.connect(gain);
  gain.connect(notificationAudioContext.destination);

  oscillator.start();
  oscillator.stop(notificationAudioContext.currentTime + 0.26);
}

function startCustomerMessageNotifications(caseIds, initialMessages) {
  if (messagePollTimer) {
    clearInterval(messagePollTimer);
  }

  initialMessages.forEach(message => {
    if (message.sender_role === 'customer') {
      seenCustomerMessageIds.add(message.id);
    }
  });

  if (!caseIds.length) return;

  messagePollTimer = setInterval(async () => {
    try {
      const { data, error } = await supabase
        .from('customer_case_messages')
        .select('id, sender_role, message, created_at')
        .in('case_id', caseIds)
        .eq('sender_role', 'customer')
        .order('created_at', { ascending: false })
        .limit(50);

      if (error) throw error;

      let hasNewMessage = false;

      (data || []).forEach(message => {
        if (!seenCustomerMessageIds.has(message.id)) {
          seenCustomerMessageIds.add(message.id);
          hasNewMessage = true;
        }
      });

      if (hasNewMessage) {
        playNewMessageSound();
      }

    } catch (error) {
      console.error('Message notification error:', error);
    }
  }, 10000);
}

    const params = new URLSearchParams(location.search);
    const customerId = params.get('id');

    const validUUID = value =>
      /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(value || '');

    const dateText = value =>
      value ? new Date(value).toLocaleString('fa-IR') : 'ثبت نشده';

    const safeText = value =>
      value === null || value === undefined || value === ''
        ? 'ثبت نشده'
        : String(value);

    function element(tag, text, className = '') {
      const node = document.createElement(tag);
      node.textContent = safeText(text);
      if (className) node.className = className;
      return node;
    }

    function empty(container, text = 'موردی ثبت نشده است.') {
      container.replaceChildren(element('p', text, 'empty'));
    }

    function addLine(parent, label, value) {
      const row = document.createElement('div');
      row.className = 'item';

      const strong = element('strong', label + ': ');
      const span = element('span', value);

      row.append(strong, span);
      parent.append(row);
    }

    function showError(text) {
      $('message').textContent = text;
      $('message').className = 'card error';
      $('message').hidden = false;
      $('content').hidden = true;
    }

    function renderItems(target, records, render) {
      const container = $(target);
      container.replaceChildren();

      if (!records.length) {
        empty(container);
        return;
      }

      records.forEach(record => {
        const item = document.createElement('div');
        item.className = 'item';
        render(item, record);
        container.append(item);
      });
    }

    const caseNames = {
      service: 'خدمت',
      visit: 'مراجعه',
      order: 'سفارش',
      warranty: 'گارانتی',
      complaint: 'شکایت',
      other: 'سایر'
    };

    const statusNames = {
      open: 'باز',
      in_progress: 'در حال انجام',
      waiting: 'در انتظار',
      resolved: 'رسیدگی‌شده',
      closed: 'بسته‌شده',
      cancelled: 'لغوشده',
      pending: 'در انتظار',
      done: 'انجام‌شده'
    };

    // نمایش پیام‌ها و امکان پاسخ مدیر
    function renderConversation(parent, record, messages) {
      const section = document.createElement('div');
      section.className = 'conversation';

      section.append(
        element('div', 'گفتگو با مشتری', 'conversation-title')
      );

      const messagesBox = document.createElement('div');
      section.append(messagesBox);

      function displayMessages(list) {
        messagesBox.replaceChildren();

        if (!list.length) {
          messagesBox.append(
            element('p', 'هنوز پیامی ثبت نشده است.', 'empty')
          );
          return;
        }

        list.forEach(message => {
          const bubble = document.createElement('div');

          bubble.className =
            'message-item' +
            (message.sender_role === 'manager'
              ? ' manager-message'
              : '');

          const header = document.createElement('div');
          header.className = 'message-header';

          header.append(
            element(
              'span',
              message.sender_role === 'manager'
                ? 'شما (مدیر)'
                : 'مشتری',
              'message-sender'
            ),
            element('span', dateText(message.created_at))
          );

          bubble.append(
            header,
            element('div', message.message, 'message-text')
          );

          messagesBox.append(bubble);
        });
      }

      displayMessages(messages);

      const form = document.createElement('form');
      form.className = 'message-form';

      const textarea = document.createElement('textarea');
      textarea.className = 'message-input';
      textarea.maxLength = 5000;
      textarea.required = true;
      textarea.placeholder = 'پاسخ خود را برای مشتری بنویسید...';

      const button = document.createElement('button');
      button.type = 'submit';
      button.className = 'send-message-btn';
      button.textContent = 'ارسال پاسخ';

      const feedback = element('div', '', 'message-feedback');

      form.append(textarea, button, feedback);
      section.append(form);
      parent.append(section);

      form.addEventListener('submit', async event => {
        event.preventDefault();

        const messageText = textarea.value.trim();

        if (!messageText) return;

        button.disabled = true;
        button.textContent = 'در حال ارسال...';
        feedback.textContent = '';

        try {
          const { error } = await supabase.rpc(
            'send_customer_case_message',
            {
              p_case_id: record.id,
              p_message: messageText
            }
          );

          if (error) throw error;

          const { data, error: loadError } = await supabase
            .from('customer_case_messages')
            .select('id, case_id, sender_role, message, created_at')
            .eq('case_id', record.id)
            .order('created_at', { ascending: true });

          if (loadError) throw loadError;

          displayMessages(data || []);
          textarea.value = '';

          feedback.textContent = 'پاسخ با موفقیت ارسال شد.';
          feedback.style.color = '#15803d';

        } catch (error) {
          console.error('Send message error:', error);

          feedback.textContent =
            error.message || 'ارسال پیام انجام نشد.';

          feedback.style.color = '#dc2626';

        } finally {
          button.disabled = false;
          button.textContent = 'ارسال پاسخ';
        }
      });
    }

    async function init() {
      try {
        if (!validUUID(customerId)) {
          showError('شناسه مشتری در آدرس صفحه معتبر نیست.');
          return;
        }

        const {
          data: { session },
          error: sessionError
        } = await supabase.auth.getSession();

        if (sessionError) throw sessionError;

        if (!session) {
          location.href = 'login.html';
          return;
        }

        if (!(await checkPlanGuard())) return;

        const userId = session.user.id;

        const businessType =
          await loadBusinessType(supabase, userId);

        const labels = getLabels(businessType);
        const specializedFields =
          BUSINESS_FIELDS[businessType] || [];

        $('pageTitle').textContent =
          `پرونده ۳۶۰ درجه ${labels.customer}`;

        $('profileTitle').textContent =
          `مشخصات ${labels.customer}`;

        $('financialTitle').textContent =
          `سوابق مالی و ${labels.invoices}`;

        $('casesTitle').textContent =
          `سوابق ${labels.service} و ${labels.appointments}`;

        // دریافت مشتری فقط از اطلاعات متعلق به مدیر واردشده
        const { data: customer, error: customerError } =
          await supabase
            .from('customers')
            .select('*')
            .eq('id', customerId)
            .eq('user_id', userId)
            .maybeSingle();

        if (customerError) throw customerError;

        if (!customer) {
          showError(
            'این مشتری پیدا نشد یا اجازه مشاهده آن را ندارید.'
          );
          return;
        }

        // دعوت مشتری به پنل اختصاصی
        const inviteButton = $('inviteCustomerBtn');
        const inviteMessage = $('inviteMessage');

        inviteButton.onclick = async () => {
          inviteButton.disabled = true;
          inviteMessage.hidden = false;
          inviteMessage.className = 'muted';
          inviteMessage.textContent =
            'در حال ارسال دعوت‌نامه...';

          try {
            const {
              data: { session },
              error: sessionError
            } = await supabase.auth.getSession();

            if (sessionError) throw sessionError;

            if (!session?.access_token) {
              throw new Error('نشست مدیر معتبر نیست.');
            }

            const response = await fetch(
              '/api/send-email?action=invite_customer',
              {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  Authorization: `Bearer ${session.access_token}`
                },
                body: JSON.stringify({ customerId })
              }
            );

            const result =
              await response.json().catch(() => ({}));

            if (!response.ok || !result.ok) {
              throw new Error(
                result.error ||
                `خطای سرور (${response.status}): ${JSON.stringify(result)}`
              );
            }

            inviteMessage.textContent =
              `دعوت‌نامه برای ${result.email} ارسال شد.`;

          } catch (error) {
            inviteMessage.className = 'error';
            inviteMessage.textContent =
              error.message || 'خطا در ارسال دعوت‌نامه.';

          } finally {
            inviteButton.disabled = false;
          }
        };

        // مشخصات مشتری
        $('profile').replaceChildren();

        addLine($('profile'), 'نام', customer.name);
        addLine($('profile'), 'تلفن', customer.phone);
        addLine($('profile'), 'ایمیل', customer.email);
        addLine($('profile'), 'وضعیت', customer.status);
        addLine($('profile'), 'یادداشت', customer.notes);
        addLine(
          $('profile'),
          'تاریخ ثبت',
          dateText(customer.created_at)
        );

        // دریافت سوابق با محدودیت مالکیت
        const [
          casesResult,
          invoicesResult,
          timelineResult
        ] = await Promise.all([
          supabase
            .from('customer_cases')
            .select('*')
            .eq('user_id', userId)
            .eq('customer_id', customerId)
            .order('created_at', { ascending: false }),

          supabase
            .from('invoices')
            .select('*')
            .eq('user_id', userId)
            .eq('customer_id', customerId)
            .order('created_at', { ascending: false }),

          supabase
            .from('customer_timeline')
            .select('*')
            .eq('user_id', userId)
            .eq('customer_id', customerId)
            .order('event_at', { ascending: false })
        ]);

        if (casesResult.error) throw casesResult.error;
        if (invoicesResult.error) throw invoicesResult.error;
        if (timelineResult.error) throw timelineResult.error;

        const cases = casesResult.data || [];
        const invoices = invoicesResult.data || [];
        const timeline = timelineResult.data || [];

        // دریافت پیام‌های پرونده‌ها
        let messages = [];

        if (cases.length) {
          const { data: messageData, error: messagesError } =
            await supabase
              .from('customer_case_messages')
              .select(
                'id, case_id, sender_role, message, created_at'
              )
              .in('case_id', cases.map(c => c.id))
              .order('created_at', { ascending: true });

          if (messagesError) {
            console.error(
              'Messages loading error:',
              messagesError
            );
          } else {
            messages = messageData || [];
          }
        }

        const messagesByCase = {};

        messages.forEach(message => {
          if (!messagesByCase[message.case_id]) {
            messagesByCase[message.case_id] = [];
          }

          messagesByCase[message.case_id].push(message);
        });
        startCustomerMessageNotifications(
  cases.map(record => record.id),
  messages
);
        
        // سوابق مالی
        renderItems('invoices', invoices, (item, invoice) => {
          item.append(
            element(
              'div',
              invoice.customer_name || customer.name,
              'title'
            )
          );

          addLine(
            item,
            'شماره فاکتور',
            invoice.invoice_number ??
              invoice.number ??
              invoice.id
          );

          if ('total_amount' in invoice) {
            addLine(item, 'مبلغ کل', invoice.total_amount);
          }

          if ('total' in invoice) {
            addLine(item, 'مبلغ', invoice.total);
          }

          if ('status' in invoice) {
            addLine(item, 'وضعیت', invoice.status);
          }

          addLine(
            item,
            'تاریخ',
            dateText(invoice.created_at)
          );
        });

        // خدمات و سوابق به‌جز شکایات
        const normalCases = cases.filter(
          record => record.case_type !== 'complaint'
        );

        renderItems('cases', normalCases, (item, record) => {
          item.append(element('div', record.title, 'title'));

          item.append(
            element(
              'span',
              caseNames[record.case_type] ||
                record.case_type,
              'tag'
            )
          );

          addLine(
            item,
            'وضعیت',
            statusNames[record.status] || record.status
          );

          if (record.description) {
            addLine(item, 'توضیحات', record.description);
          }

          const details = record.details || {};

          specializedFields.forEach(field => {
            if (
              Object.prototype.hasOwnProperty.call(
                details,
                field.key
              )
            ) {
              addLine(
                item,
                field.label,
                details[field.key]
              );
            }
          });

          if (record.warranty_expires_at) {
            addLine(
              item,
              'پایان گارانتی',
              dateText(record.warranty_expires_at)
            );
          }

          addLine(
            item,
            'تاریخ ثبت',
            dateText(record.created_at)
          );

          renderConversation(
            item,
            record,
            messagesByCase[record.id] || []
          );
        });

        // شکایات و نتیجه رسیدگی
        const complaints = cases.filter(
          record => record.case_type === 'complaint'
        );

        renderItems('complaints', complaints, (item, record) => {
          item.append(element('div', record.title, 'title'));

          const statusLine = element(
            'div',
            '',
            'case-meta'
          );

          statusLine.append(
            element(
              'span',
              'وضعیت رسیدگی: ' +
                (statusNames[record.status] || record.status)
            )
          );

          item.append(statusLine);

          if (record.description) {
            addLine(
              item,
              'شرح شکایت',
              record.description
            );
          }

          const details =
            record.details &&
            typeof record.details === 'object'
              ? record.details
              : {};

          addLine(
            item,
            'نتیجه رسیدگی',
            details.resolution || 'هنوز ثبت نشده'
          );

          if (record.resolved_at) {
            addLine(
              item,
              'تاریخ رسیدگی',
              dateText(record.resolved_at)
            );
          }

          addLine(
            item,
            'تاریخ ثبت شکایت',
            dateText(record.created_at)
          );

          renderConversation(
            item,
            record,
            messagesByCase[record.id] || []
          );

          const separator = document.createElement('hr');
          item.append(separator);

          item.append(
            element('div', 'ثبت نتیجه رسیدگی', 'title')
          );

          const statusSelect =
            document.createElement('select');

          statusSelect.style.cssText =
            'width:100%;padding:10px;margin:8px 0;border:1px solid #ddd;border-radius:8px;font-family:inherit;';

          Object.entries(statusNames).forEach(
            ([value, label]) => {
              const option =
                document.createElement('option');

              option.value = value;
              option.textContent = label;
              option.selected = value === record.status;

              statusSelect.append(option);
            }
          );

          const resolutionInput =
            document.createElement('textarea');

          resolutionInput.value = details.resolution || '';
          resolutionInput.placeholder =
            'نتیجه بررسی و اقدام انجام‌شده را بنویسید...';
          resolutionInput.rows = 4;

          resolutionInput.style.cssText =
            'width:100%;padding:10px;margin:8px 0;border:1px solid #ddd;border-radius:8px;font-family:inherit;resize:vertical;';

          const saveButton =
            document.createElement('button');

          saveButton.type = 'button';
          saveButton.textContent = 'ذخیره نتیجه رسیدگی';

          saveButton.style.cssText =
            'padding:10px 18px;background:#2563eb;color:white;border:0;border-radius:8px;font-family:inherit;cursor:pointer;';

          const saveMessage = document.createElement('div');

          saveMessage.style.cssText =
            'font-size:13px;margin-top:10px;';

          saveButton.addEventListener('click', async () => {
            const resolution =
              resolutionInput.value.trim();

            const newStatus = statusSelect.value;

            if (!resolution) {
              saveMessage.textContent =
                'لطفاً نتیجه رسیدگی را وارد کنید.';

              saveMessage.style.color = '#dc2626';
              return;
            }

            saveButton.disabled = true;
            saveButton.textContent = 'در حال ذخیره...';
            saveMessage.textContent = '';

            try {
              const { data, error } = await supabase
                .from('customer_cases')
                .update({
                  status: newStatus,
                  details: {
                    ...details,
                    resolution
                  },
                  resolved_at:
                    ['resolved', 'closed'].includes(newStatus)
                      ? new Date().toISOString()
                      : null,
                  updated_at: new Date().toISOString()
                })
                .eq('id', record.id)
                .eq('user_id', userId)
                .eq('customer_id', customerId)
                .select('id')
                .maybeSingle();

              if (error) throw error;

              if (!data) {
                throw new Error(
                  'پرونده برای ذخیره پیدا نشد.'
                );
              }

              saveMessage.textContent =
                'نتیجه رسیدگی با موفقیت ذخیره شد.';

              saveMessage.style.color = '#15803d';

              // بارگذاری دوباره اطلاعات پرونده
              await init();

            } catch (error) {
              console.error(
                'Complaint update error:',
                error
              );

              saveMessage.textContent =
                error.message ||
                'ذخیره نتیجه با خطا مواجه شد.';

              saveMessage.style.color = '#dc2626';

              saveButton.disabled = false;
              saveButton.textContent =
                'ذخیره نتیجه رسیدگی';
            }
          });

          item.append(
            statusSelect,
            resolutionInput,
            saveButton,
            saveMessage
          );
        });

        // پیگیری‌ها و رضایت‌سنجی
        const caseIds = cases.map(record => record.id);

        let followups = [];
        let feedback = [];

        if (caseIds.length) {
          const [
            followupsResult,
            feedbackResult
          ] = await Promise.all([
            supabase
              .from('customer_followups')
              .select('*')
              .eq('user_id', userId)
              .in('case_id', caseIds)
              .order('created_at', { ascending: false }),

            supabase
              .from('customer_feedback')
              .select('*')
              .eq('user_id', userId)
              .in('case_id', caseIds)
              .order('created_at', { ascending: false })
          ]);

          if (followupsResult.error) {
            throw followupsResult.error;
          }

          if (feedbackResult.error) {
            throw feedbackResult.error;
          }

          followups = followupsResult.data || [];
          feedback = feedbackResult.data || [];
        }

        renderItems('followups', followups, (item, record) => {
          item.append(element('div', record.title, 'title'));

          addLine(
            item,
            'وضعیت',
            statusNames[record.status] || record.status
          );

          addLine(item, 'مسئول', record.assigned_to);
          addLine(item, 'موعد', dateText(record.due_at));

          if (record.outcome) {
            addLine(item, 'نتیجه', record.outcome);
          }
        });

        renderItems('feedback', feedback, (item, record) => {
          addLine(
            item,
            'امتیاز',
            record.rating == null
              ? 'ثبت نشده'
              : `${record.rating} از ۵`
          );

          addLine(
            item,
            'رضایت',
            record.is_satisfied === null
              ? 'ثبت نشده'
              : record.is_satisfied
                ? 'راضی'
                : 'ناراضی'
          );

          addLine(item, 'نظر', record.comment);

          addLine(
            item,
            'تاریخ',
            dateText(record.created_at)
          );
        });

        // تاریخچه یکپارچه
        renderItems('timeline', timeline, (item, event) => {
          item.className = 'event';

          item.append(
            element('div', event.event_title, 'title')
          );

          if (event.event_description) {
            item.append(
              element('div', event.event_description)
            );
          }

          item.append(
            element(
              'div',
              dateText(event.event_at),
              'muted'
            )
          );
        });

        $('message').hidden = true;
        $('content').hidden = false;

      } catch (error) {
        console.error('Customer 360 error:', error);

        showError(
          'بارگذاری پرونده با خطا مواجه شد: ' +
          (error.message || 'خطای نامشخص')
        );
      }
    }

    init();
  </script>
</body>
</html>
