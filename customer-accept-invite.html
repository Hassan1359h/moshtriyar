
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پذیرش دعوت‌نامه | مشتری‌یار</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex;
      align-items: center; justify-content: center; padding: 20px;
      font-family: Vazirmatn, Tahoma, sans-serif;
      background: #f1f5f9; color: #1e293b;
    }
    .box {
      width: 100%; max-width: 420px; padding: 30px;
      background: white; border-radius: 18px;
      box-shadow: 0 12px 35px #00000010;
    }
    h1 { font-size: 21px; margin-top: 0; }
    p { font-size: 14px; line-height: 2; }
    input, button {
      width: 100%; padding: 13px; border-radius: 10px;
      font: inherit; margin-top: 12px;
    }
    input { border: 1px solid #cbd5e1; direction: ltr; }
    button {
      border: 0; background: #2563eb; color: white;
      font-weight: bold; cursor: pointer;
    }
    button:disabled { opacity: .55; cursor: not-allowed; }
    #message { margin-top: 16px; }
    .error { color: #b91c1c; }
    .success { color: #15803d; }
  </style>
</head>
<body>
  <main class="box">
    <h1>فعال‌سازی پنل مشتری</h1>
    <p id="message">در حال بررسی اعتبار دعوت‌نامه...</p>

    <form id="inviteForm" hidden>
      <label for="password">رمز عبور دلخواه (حداقل ۸ کاراکتر)</label>
      <input
        id="password"
        type="password"
        minlength="8"
        autocomplete="new-password"
        required
      >
      <button id="submitBtn" type="submit">تعیین رمز عبور</button>
    </form>
  </main>

  <script type="module">
    import { supabase } from './js/supabase.js';

    const form = document.getElementById('inviteForm');
    const message = document.getElementById('message');
    const passwordInput = document.getElementById('password');
    const submitBtn = document.getElementById('submitBtn');

    let inviteSessionReady = false;

    function showMessage(text, type = '') {
      message.textContent = text;
      message.className = type;
    }

    async function initialize() {
      try {
        const params = new URLSearchParams(window.location.search);
        const hash = new URLSearchParams(window.location.hash.slice(1));

        // فقط لینک دعوت‌نامه یا بازیابی معتبر پردازش می‌شود.
        const tokenHash = params.get('token_hash');
        const linkType = params.get('type') || hash.get('type');

        if (linkType !== 'invite') {
          showMessage('این صفحه فقط مخصوص پذیرش دعوت‌نامه مشتری است.', 'error');
          return;
        }

        if (tokenHash) {
          const { error } = await supabase.auth.verifyOtp({
            token_hash: tokenHash,
            type: 'invite'
          });

          if (error) throw error;
        } else {
          // لینک‌های قدیمی Supabase ممکن است نشست را در آدرس بازگردانند.
          const { data, error } = await supabase.auth.getSession();
          if (error || !data.session || !hash.get('access_token')) {
            throw new Error('نشست دعوت‌نامه معتبر دریافت نشد.');
          }
        }

        const { data: userData, error: userError } =
          await supabase.auth.getUser();

        if (userError || !userData.user?.email_confirmed_at) {
          throw new Error('تأیید هویت دعوت‌شونده کامل نشده است.');
        }

        inviteSessionReady = true;
        form.hidden = false;
        showMessage('دعوت‌نامه تأیید شد. لطفاً رمز عبور خود را تعیین کنید.');
      } catch (error) {
        form.hidden = true;
        showMessage(
          'لینک دعوت‌نامه نامعتبر یا منقضی شده است. لطفاً از کسب‌وکار درخواست دعوت‌نامه جدید کنید.',
          'error'
        );
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!inviteSessionReady) return;

      const password = passwordInput.value;
      if (password.length < 8) {
        showMessage('رمز عبور باید حداقل ۸ کاراکتر باشد.', 'error');
        return;
      }

      submitBtn.disabled = true;
      showMessage('در حال ثبت رمز عبور...');

      const { error } = await supabase.auth.updateUser({ password });

      if (error) {
        showMessage('ثبت رمز انجام نشد: ' + error.message, 'error');
        submitBtn.disabled = false;
        return;
      }

      form.hidden = true;
      passwordInput.value = '';
      showMessage(
        'رمز عبور ثبت شد. راه‌اندازی دسترسی به پرونده مشتری هنوز تکمیل نشده است.',
        'success'
      );
    });

    initialize();
  </script>
</body>
</html>
