
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8fafc">
  <title>پنل مشتری | مشتری‌یار</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f4f6fa;
      color: #172033;
      font-family: Vazirmatn, sans-serif;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #e8edf4;
      padding: 16px 20px;
    }

    .header-inner {
      max-width: 950px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .brand {
      font-size: 20px;
      font-weight: 800;
      color: #2563eb;
    }

    .business-name {
      font-size: 16px;
      font-weight: 800;
      color: #2563eb;
      margin-top: 5px;
      line-height: 1.7;
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    .logout {
      border: 1px solid #fecaca;
      color: #dc2626;
      background: #fff;
      border-radius: 9px;
      padding: 9px 16px;
      font-size: 13px;
    }

    main {
      max-width: 950px;
      margin: 28px auto;
      padding: 0 16px 40px;
    }

    .welcome { margin-bottom: 22px; }

    .welcome h1 {
      font-size: 23px;
      margin: 0 0 7px;
    }

    .welcome p {
      color: #64748b;
      font-size: 14px;
      margin: 0;
    }

    .section-title {
      font-size: 17px;
      font-weight: 700;
      margin: 25px 0 13px;
    }

    .card {
      background: #fff;
      border: 1px solid #e8edf4;
      border-radius: 14px;
      padding: 19px;
      margin-bottom: 14px;
      box-shadow: 0 3px 12px rgba(15, 23, 42, .03);
    }

    .profile-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 17px;
    }

    .field-label {
      color: #94a3b8;
      font-size: 12px;
      margin-bottom: 5px;
    }

    .field-value {
      font-size: 14px;
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    .case-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .case-description {
      color: #64748b;
      font-size: 13px;
      line-height: 1.9;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .case-response {
      margin-top: 14px;
      padding: 12px;
      background: #f0fdf4;
      border: 1px solid #dcfce7;
      border-radius: 10px;
      color: #166534;
      font-size: 13px;
      line-height: 1.9;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .case-response-title {
      font-weight: 700;
      margin-bottom: 5px;
    }

    .case-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      align-items: center;
      margin-top: 14px;
      color: #64748b;
      font-size: 12px;
    }

    .status {
      display: inline-block;
      border-radius: 20px;
      padding: 4px 11px;
      background: #eff6ff;
      color: #2563eb;
      font-size: 12px;
    }

    .empty, .loading, .error {
      text-align: center;
      padding: 35px 15px;
      color: #64748b;
      background: #fff;
      border: 1px solid #e8edf4;
      border-radius: 14px;
      font-size: 14px;
    }

    .error { color: #dc2626; }

    footer {
      text-align: center;
      color: #94a3b8;
      font-size: 12px;
      padding: 20px;
    }

    .form-group { margin-bottom: 16px; }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 7px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #dbe2ea;
      border-radius: 9px;
      background: #fff;
      color: #172033;
      font-family: inherit;
      font-size: 14px;
    }

    .form-group textarea {
      resize: vertical;
      line-height: 1.9;
    }

    .submit-request {
      border: 0;
      border-radius: 9px;
      padding: 11px 22px;
      background: #2563eb;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
    }

    .submit-request:disabled,
    .send-message-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #requestMessage {
      margin-top: 12px;
      font-size: 13px;
    }

    /* بخش گفتگوی پرونده */
    .conversation {
      margin-top: 18px;
      padding-top: 15px;
      border-top: 1px solid #e8edf4;
    }

    .conversation-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .message-item {
      background: #f8fafc;
      border: 1px solid #e8edf4;
      border-radius: 10px;
      padding: 11px 13px;
      margin-bottom: 9px;
    }

    .message-item.customer-message {
      background: #eff6ff;
      border-color: #dbeafe;
    }

    .message-header {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 5px 12px;
      margin-bottom: 6px;
      font-size: 11px;
      color: #64748b;
    }

    .message-sender {
      font-weight: 700;
      color: #2563eb;
    }

    .message-text {
      font-size: 13px;
      line-height: 1.9;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .no-messages {
      color: #94a3b8;
      font-size: 12px;
      margin-bottom: 13px;
    }

    .message-form {
      margin-top: 13px;
    }

    .message-input {
      width: 100%;
      min-height: 75px;
      resize: vertical;
      padding: 10px 12px;
      border: 1px solid #dbe2ea;
      border-radius: 9px;
      font-family: inherit;
      font-size: 13px;
      line-height: 1.9;
    }

    .send-message-btn {
      margin-top: 8px;
      border: 0;
      border-radius: 9px;
      padding: 9px 18px;
      background: #2563eb;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
    }

    .message-feedback {
      margin-top: 8px;
      font-size: 12px;
    }

    @media (max-width: 500px) {
      .welcome h1 { font-size: 20px; }
      .card { padding: 15px; }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <div>
      <div class="brand">مشتری‌یار</div>
      <div class="business-name" id="businessName"></div>
    </div>
    <button class="logout" id="logoutBtn">خروج از پنل</button>
  </div>
</header>

<main>
  <section class="welcome">
    <h1>پنل مشتری</h1>
    <p>
      به پنل اختصاصی خود خوش آمدید.
      اطلاعات و سوابق شما در این قسمت نمایش داده می‌شود.
    </p>
  </section>

  <h2 class="section-title">اطلاعات شما</h2>
  <div id="profiles">
    <div class="loading">در حال دریافت اطلاعات...</div>
  </div>

  <h2 class="section-title">سوابق و پرونده‌ها</h2>
  <div id="cases">
    <div class="loading">در حال دریافت سوابق...</div>
  </div>

  <h2 class="section-title">ثبت درخواست جدید</h2>

  <div class="card">
    <form id="requestForm">
      <div class="form-group">
        <label for="requestType">نوع درخواست</label>
        <select id="requestType" required>
          <option value="service">درخواست پشتیبانی</option>
          <option value="complaint">ثبت شکایت</option>
          <option value="feedback">ارسال پیشنهاد یا بازخورد</option>
        </select>
      </div>

      <div class="form-group">
        <label for="requestTitle">عنوان</label>
        <input
          id="requestTitle"
          type="text"
          minlength="3"
          maxlength="150"
          placeholder="موضوع درخواست را بنویسید"
          required
        >
      </div>

      <div class="form-group">
        <label for="requestDescription">شرح درخواست</label>
        <textarea
          id="requestDescription"
          minlength="5"
          maxlength="5000"
          rows="5"
          placeholder="توضیحات خود را بنویسید..."
          required
        ></textarea>
      </div>

      <button type="submit" class="submit-request" id="submitRequestBtn">
        ثبت درخواست
      </button>

      <div id="requestMessage" role="status" aria-live="polite"></div>
    </form>
  </div>
</main>

<footer>مشتری‌یار | پنل اختصاصی مشتریان</footer>

<script type="module">
  import { supabase } from './js/supabase.js';

  const profilesEl = document.getElementById('profiles');
  const casesEl = document.getElementById('cases');
  const logoutBtn = document.getElementById('logoutBtn');
  const businessNameEl = document.getElementById('businessName');

  const loginPage = './customer-login.html';

  const requestForm = document.getElementById('requestForm');
  const requestType = document.getElementById('requestType');
  const requestTitle = document.getElementById('requestTitle');
  const requestDescription = document.getElementById('requestDescription');
  const submitRequestBtn = document.getElementById('submitRequestBtn');
  const requestMessage = document.getElementById('requestMessage');

  const statusNames = {
    open: 'باز',
    in_progress: 'در حال انجام',
    waiting: 'در انتظار',
    resolved: 'رسیدگی‌شده',
    closed: 'بسته‌شده',
    cancelled: 'لغوشده',
    pending: 'در انتظار',
    done: 'انجام‌شده'
  };

  const caseNames = {
    service: 'درخواست پشتیبانی',
    complaint: 'شکایت',
    feedback: 'بازخورد'
  };

  function formatDate(value) {
    if (!value) return 'ثبت نشده';

    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return 'ثبت نشده';

    return new Intl.DateTimeFormat('fa-IR', {
      year: 'numeric',
      month: 'long',
      day: 'numeric'
    }).format(date);
  }

  function formatDateTime(value) {
    if (!value) return '';

    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return '';

    return new Intl.DateTimeFormat('fa-IR', {
      year: 'numeric',
      month: 'long',
      day: 'numeric',
      hour: '2-digit',
      minute: '2-digit'
    }).format(date);
  }

  function addField(container, label, value) {
    const wrapper = document.createElement('div');

    const labelEl = document.createElement('div');
    labelEl.className = 'field-label';
    labelEl.textContent = label;

    const valueEl = document.createElement('div');
    valueEl.className = 'field-value';
    valueEl.textContent = value || 'ثبت نشده';

    wrapper.append(labelEl, valueEl);
    container.appendChild(wrapper);
  }

  function showProfiles(customers) {
    profilesEl.replaceChildren();

    if (!customers.length) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'هنوز پرونده‌ای برای حساب شما متصل نشده است.';
      profilesEl.appendChild(empty);
      return;
    }

    customers.forEach(customer => {
      const card = document.createElement('div');
      card.className = 'card';

      const grid = document.createElement('div');
      grid.className = 'profile-grid';

      addField(grid, 'نام و نام خانوادگی', customer.name);
      addField(grid, 'ایمیل', customer.email);
      addField(grid, 'شماره تماس', customer.phone);

      card.appendChild(grid);
      profilesEl.appendChild(card);
    });
  }

  // نمایش پیام‌های هر پرونده
  function showMessages(container, caseItem, messages) {
    const conversation = document.createElement('div');
    conversation.className = 'conversation';

    const heading = document.createElement('div');
    heading.className = 'conversation-title';
    heading.textContent = 'گفتگو درباره این پرونده';

    conversation.appendChild(heading);

    if (!messages.length) {
      const empty = document.createElement('div');
      empty.className = 'no-messages';
      empty.textContent = 'هنوز پیامی در این گفتگو ثبت نشده است.';
      conversation.appendChild(empty);
    }

    messages.forEach(message => {
      const item = document.createElement('div');
      item.className = 'message-item';

      if (message.sender_role === 'customer') {
        item.classList.add('customer-message');
      }

      const header = document.createElement('div');
      header.className = 'message-header';

      const sender = document.createElement('span');
      sender.className = 'message-sender';
      sender.textContent =
        message.sender_role === 'manager' ? 'مدیر کسب‌وکار' : 'شما';

      const date = document.createElement('span');
      date.textContent = formatDateTime(message.created_at);

      const text = document.createElement('div');
      text.className = 'message-text';
      text.textContent = message.message;

      header.append(sender, date);
      item.append(header, text);
      conversation.appendChild(item);
    });

    // فرم ارسال پیام مشتری
    const form = document.createElement('form');
    form.className = 'message-form';

    const textarea = document.createElement('textarea');
    textarea.className = 'message-input';
    textarea.maxLength = 5000;
    textarea.placeholder = 'پیام خود را برای مدیر بنویسید...';
    textarea.required = true;

    const button = document.createElement('button');
    button.type = 'submit';
    button.className = 'send-message-btn';
    button.textContent = 'ارسال پیام';

    const feedback = document.createElement('div');
    feedback.className = 'message-feedback';
    feedback.setAttribute('role', 'status');

    form.append(textarea, button, feedback);

    form.addEventListener('submit', async event => {
      event.preventDefault();

      const messageText = textarea.value.trim();

      if (!messageText) {
        feedback.textContent = 'متن پیام را وارد کنید.';
        feedback.style.color = '#dc2626';
        return;
      }

      button.disabled = true;
      button.textContent = 'در حال ارسال...';
      feedback.textContent = '';

      try {
        const { error } = await supabase.rpc(
          'send_customer_case_message',
          {
            p_case_id: caseItem.id,
            p_message: messageText
          }
        );

        if (error) throw error;

        await loadPortal();

      } catch (error) {
        console.error('Send message error:', error);

        feedback.textContent =
          error.message || 'ارسال پیام با خطا مواجه شد.';

        feedback.style.color = '#dc2626';

        button.disabled = false;
        button.textContent = 'ارسال پیام';
      }
    });

    conversation.appendChild(form);
    container.appendChild(conversation);
  }

  // نمایش پرونده‌ها
  function showCases(items, messagesByCase) {
    casesEl.replaceChildren();

    if (!items.length) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent =
        'هنوز سابقه یا پرونده‌ای برای نمایش ثبت نشده است.';
      casesEl.appendChild(empty);
      return;
    }

    items.forEach(item => {
      const card = document.createElement('div');
      card.className = 'card';

      const title = document.createElement('div');
      title.className = 'case-title';
      title.textContent = item.title || 'بدون عنوان';

      const description = document.createElement('div');
      description.className = 'case-description';
      description.textContent =
        item.description || 'توضیحی ثبت نشده است.';

      const meta = document.createElement('div');
      meta.className = 'case-meta';

      const type = document.createElement('span');
      type.textContent =
        'نوع: ' +
        (caseNames[item.case_type] || item.case_type || 'ثبت نشده');

      const status = document.createElement('span');
      status.className = 'status';
      status.textContent =
        statusNames[item.status] || item.status || 'در حال بررسی';

      const date = document.createElement('span');
      date.textContent = 'تاریخ ثبت: ' + formatDate(item.created_at);

      meta.append(type, status, date);
      card.append(title, description, meta);

      // نتیجه رسیدگی مدیر
      const resolution = item.details?.resolution;

      if (
        item.case_type === 'complaint' &&
        typeof resolution === 'string' &&
        resolution.trim()
      ) {
        const response = document.createElement('div');
        response.className = 'case-response';

        const responseTitle = document.createElement('div');
        responseTitle.className = 'case-response-title';
        responseTitle.textContent = 'نتیجه رسیدگی مدیر';

        const responseText = document.createElement('div');
        responseText.textContent = resolution;

        response.append(responseTitle, responseText);
        card.appendChild(response);
      }

      showMessages(
        card,
        item,
        messagesByCase[item.id] || []
      );

      casesEl.appendChild(card);
    });
  }

  // دریافت اطلاعات پنل مشتری
  async function loadPortal() {
    try {
      const { data: sessionData, error: sessionError } =
        await supabase.auth.getSession();

      if (sessionError) throw sessionError;

      if (!sessionData.session) {
        location.replace(loginPage);
        return;
      }

      const { data: access, error: accessError } =
        await supabase.rpc('has_customer_portal_access');

      if (accessError) throw accessError;

      if (access !== true) {
        await supabase.auth.signOut();
        location.replace(loginPage);
        return;
      }

      // نام کسب‌وکار
      const { data: businessName, error: businessNameError } =
        await supabase.rpc('get_my_customer_business_name');

      if (!businessNameError && businessName) {
        businessNameEl.textContent = businessName;
      }

      // شناسه مشتریان مجاز
      const { data: customerIds, error: idsError } =
        await supabase.rpc('get_my_customer_portal_ids');

      if (idsError) throw idsError;

      if (!Array.isArray(customerIds) || customerIds.length === 0) {
        showProfiles([]);
        showCases([], {});
        return;
      }

      // اطلاعات پروفایل
      const { data: customers, error: customersError } =
        await supabase
          .from('customers')
          .select('id, name, email, phone')
          .in('id', customerIds);

      if (customersError) throw customersError;

      showProfiles(customers || []);

      // پرونده‌ها
      const { data: cases, error: casesError } =
        await supabase
          .from('customer_cases')
          .select(
            'id, customer_id, case_type, title, description, status, details, created_at'
          )
          .in('customer_id', customerIds)
          .order('created_at', { ascending: false })
          .limit(50);

      if (casesError) throw casesError;

      const caseItems = cases || [];
      let messagesByCase = {};

      // دریافت پیام‌های پرونده‌ها
      if (caseItems.length > 0) {
        const caseIds = caseItems.map(item => item.id);

        const { data: messages, error: messagesError } =
          await supabase
            .from('customer_case_messages')
            .select('id, case_id, sender_role, message, created_at')
            .in('case_id', caseIds)
            .order('created_at', { ascending: true });

        if (messagesError) throw messagesError;

        (messages || []).forEach(message => {
          if (!messagesByCase[message.case_id]) {
            messagesByCase[message.case_id] = [];
          }

          messagesByCase[message.case_id].push(message);
        });
      }

      showCases(caseItems, messagesByCase);

    } catch (error) {
      console.error('Customer portal error:', error);

      profilesEl.replaceChildren();

      const profileError = document.createElement('div');
      profileError.className = 'error';
      profileError.textContent =
        'دریافت اطلاعات با خطا مواجه شد. لطفاً صفحه را دوباره بارگذاری کنید.';
      profilesEl.appendChild(profileError);

      casesEl.replaceChildren();
    }
  }

  // ثبت درخواست جدید
  requestForm.addEventListener('submit', async event => {
    event.preventDefault();

    submitRequestBtn.disabled = true;
    submitRequestBtn.textContent = 'در حال ثبت...';

    requestMessage.textContent = '';
    requestMessage.style.color = '#64748b';

    try {
      const { error } = await supabase.rpc('submit_customer_request', {
        p_title: requestTitle.value.trim(),
        p_description: requestDescription.value.trim(),
        p_case_type: requestType.value
      });

      if (error) throw error;

      requestMessage.textContent =
        'درخواست شما با موفقیت ثبت شد.';
      requestMessage.style.color = '#15803d';

      requestForm.reset();
      await loadPortal();

    } catch (error) {
      console.error('Submit customer request error:', error);

      requestMessage.textContent =
        error.message || 'ثبت درخواست با خطا مواجه شد. دوباره تلاش کنید.';

      requestMessage.style.color = '#dc2626';

    } finally {
      submitRequestBtn.disabled = false;
      submitRequestBtn.textContent = 'ثبت درخواست';
    }
  });

  // خروج از پنل
  logoutBtn.addEventListener('click', async () => {
    logoutBtn.disabled = true;
    logoutBtn.textContent = 'در حال خروج...';

    const { error } = await supabase.auth.signOut();

    if (error) {
      console.error(error);

      logoutBtn.disabled = false;
      logoutBtn.textContent = 'خروج از پنل';

      alert('خروج با خطا مواجه شد. دوباره تلاش کنید.');
      return;
    }

    location.replace(loginPage);
  });

  loadPortal();
</script>

</body>
</html>
