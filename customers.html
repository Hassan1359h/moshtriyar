<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مشتریان | مشتری‌یار</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
<link rel="icon" href="icon-192.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:#f1f5f9;color:#0f172a;line-height:1.7;padding-bottom:80px}
.header{background:#1e293b;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.header h1{font-size:16px;font-weight:800}
.header a{color:#fff;text-decoration:none;background:#334155;padding:8px 14px;border-radius:10px;font-size:13px;font-weight:700;margin-right:6px}
.container{max-width:900px;margin:0 auto;padding:20px}
.top-bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.search{flex:1;min-width:200px;padding:12px;border:2px solid #e2e8f0;border-radius:12px;font-family:inherit;font-size:14px;background:#fff}
.btn-add{background:#2563eb;color:#fff;border:none;padding:12px 20px;border-radius:12px;font-family:inherit;font-weight:800;font-size:14px;cursor:pointer;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:#fff;border-radius:12px;padding:14px;text-align:center}
.stat b{font-size:22px;display:block;font-weight:900;color:#2563eb}
.stat span{font-size:11px;color:#64748b;font-weight:700}
.customer{background:#fff;border-radius:14px;padding:16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;transition:transform .1s;border-right:4px solid #e2e8f0}
.customer:hover{transform:translateY(-2px)}
.customer.warn{border-right-color:#f59e0b}
.customer.danger{border-right-color:#dc2626}
.customer.good{border-right-color:#16a34a}
.c-info{flex:1}
.c-name{font-weight:800;font-size:15px;margin-bottom:2px}
.c-phone{font-size:12px;color:#64748b;direction:ltr;text-align:right}
.c-meta{font-size:11px;color:#94a3b8;margin-top:4px}
.empty{text-align:center;padding:60px 20px;color:#94a3b8;background:#fff;border-radius:14px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:20px;z-index:200}
.modal.open{display:flex}
.modal-box{background:#fff;border-radius:18px;max-width:420px;width:100%;padding:24px;max-height:90vh;overflow-y:auto}
.modal-box h2{font-size:18px;font-weight:800;margin-bottom:16px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:700;color:#475569;margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;padding:11px;border:2px solid #e2e8f0;border-radius:10px;font-family:inherit;font-size:14px;background:#f8fafc}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:#3b82f6;background:#fff}
.field textarea{min-height:70px;resize:vertical}
.modal-btns{display:flex;gap:10px;margin-top:16px}
.btn-save{flex:1;padding:12px;background:#2563eb;color:#fff;border:none;border-radius:10px;font-family:inherit;font-weight:800;font-size:14px;cursor:pointer}
.btn-cancel{flex:1;padding:12px;background:#e2e8f0;color:#0f172a;border:none;border-radius:10px;font-family:inherit;font-weight:800;font-size:14px;cursor:pointer}
.btn-danger{width:100%;padding:12px;background:#fee2e2;color:#dc2626;border:none;border-radius:10px;font-family:inherit;font-weight:800;font-size:14px;cursor:pointer;margin-top:10px}
.loading{text-align:center;padding:50px;color:#64748b}
.hidden{display:none!important}
@media(max-width:600px){.stats{grid-template-columns:1fr}}
</style>
</head>
<body>

<header class="header">
    <h1>👥 مشتریان</h1>
    <div>
        <a href="dashboard.html">داشبورد</a>
        <a href="at-risk.html" style="background:#dc2626;color:#fff;text-decoration:none;padding:8px 14px;border-radius:10px;font-weight:700;font-size:13px;">⚠️ در خطر</a>
    </div>
</header>

<div class="container">
    <div class="top-bar">
        <input type="text" class="search" id="search" placeholder="🔍 جستجوی نام یا شماره...">
        <button class="btn-add" id="addBtn">+ افزودن مشتری</button>
    </div>

    <div class="stats">
        <div class="stat"><b id="totalCount">0</b><span>کل مشتریان</span></div>
        <div class="stat"><b id="activeCount">0</b><span>فعال</span></div>
        <div class="stat"><b id="dangerCount">0</b><span>در خطر</span></div>
    </div>

    <div id="list" class="loading">در حال بارگذاری...</div>
</div>

<!-- Modal -->
<div class="modal" id="modal">
    <div class="modal-box">
        <h2 id="modalTitle">افزودن مشتری</h2>
        <form id="customerForm">
            <input type="hidden" id="customerId">
            <div class="field">
                <label>نام و نام خانوادگی *</label>
                <input type="text" id="name" required placeholder="مثلاً: علی احمدی">
            </div>
            <div class="field">
                <label>شماره موبایل</label>
                <input type="tel" id="phone" placeholder="09123456789" style="direction:ltr;text-align:right;">
            </div>
            <div class="field">
                <label>ایمیل</label>
                <input type="email" id="email" placeholder="example@email.com" style="direction:ltr;text-align:right;">
            </div>
            <div class="field">
                <label>وضعیت</label>
                <select id="status">
                    <option value="lead">مشتری بالقوه</option>
                    <option value="negotiating">در حال مذاکره</option>
                    <option value="customer">مشتری</option>
                    <option value="lost">از دست رفته</option>
                </select>
            </div>
            <div class="field">
                <label>توضیحات</label>
                <textarea id="notes" placeholder="یادداشت درباره این مشتری..."></textarea>
            </div>
            <div class="modal-btns">
                <button type="button" class="btn-cancel" id="cancelBtn">انصراف</button>
                <button type="submit" class="btn-save" id="saveBtn">ذخیره</button>
            </div>
            <button type="button" class="btn-ai" id="aiBtn" style="display:none;width:100%;padding:12px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff;border:none;border-radius:10px;font-family:inherit;font-weight:800;font-size:14px;cursor:pointer;margin-top:10px;">✨ پیام بساز</button>
            <button type="button" class="btn-danger hidden" id="deleteBtn">🗑️ حذف مشتری</button>
        </form>
    </div>
</div>

<script type="module">
import { supabase } from './js/supabase.js';

const $ = id => document.getElementById(id);
let customers = [];
let me = null;

async function init() {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) { window.location.href = 'login.html'; return; }
    me = session.user;
    await loadCustomers();
}

async function loadCustomers() {
    const { data, error } = await supabase
        .from('customers')
        .select('*')
        .order('created_at', { ascending: false });

    if (error) {
        $('list').innerHTML = '<div class="empty">⚠️ خطا: ' + error.message + '</div>';
        return;
    }

    customers = data || [];
    render();
    updateStats();
}

function updateStats() {
    $('totalCount').textContent = customers.length;
    $('activeCount').textContent = customers.filter(c => c.status === 'customer' || c.status === 'negotiating').length;
    $('dangerCount').textContent = customers.filter(c => getRiskLevel(c) === 'danger').length;
}

function getRiskLevel(c) {
    if (!c.last_contact_at) return 'warn';
    const days = Math.floor((Date.now() - new Date(c.last_contact_at)) / 86400000);
    if (days > 30) return 'danger';
    if (days > 14) return 'warn';
    return 'good';
}

function daysAgo(dateStr) {
    if (!dateStr) return 'بدون تماس';
    const days = Math.floor((Date.now() - new Date(dateStr)) / 86400000);
    if (days === 0) return 'امروز';
    if (days === 1) return 'دیروز';
    return days + ' روز پیش';
}

function render() {
    const q = $('search').value.trim().toLowerCase();
    const list = $('list');

    if (!customers.length) {
        list.innerHTML = '<div class="empty">📭 هنوز مشتری‌ای اضافه نکردید<br><small style="color:#cbd5e1">روی «افزودن مشتری» بزنید</small></div>';
        return;
    }

    const filtered = q
        ? customers.filter(c =>
            c.name.toLowerCase().includes(q) ||
            (c.phone && c.phone.includes(q)))
        : customers;

    if (!filtered.length) {
        list.innerHTML = '<div class="empty">🔍 نتیجه‌ای پیدا نشد</div>';
        return;
    }

    list.innerHTML = '';
    filtered.forEach(c => {
        const risk = getRiskLevel(c);
        const div = document.createElement('div');
        div.className = 'customer ' + risk;
        div.innerHTML = `
            <div class="c-info">
                <div class="c-name">${c.name}</div>
                ${c.phone ? `<div class="c-phone">📱 ${c.phone}</div>` : ''}
                <div class="c-meta">آخرین تماس: ${daysAgo(c.last_contact_at)} • ${statusLabel(c.status)}</div>
            </div>
            <div style="font-size:20px;">${statusIcon(c.status)}</div>
        `;
        div.onclick = () => openEdit(c);
        list.appendChild(div);
    });
}

function statusLabel(s) {
    return { lead: 'بالقوه', negotiating: 'در مذاکره', customer: 'مشتری', lost: 'از دست رفته' }[s] || s;
}

function statusIcon(s) {
    return { lead: '🔵', negotiating: '🟡', customer: '🟢', lost: '🔴' }[s] || '⚪';
}

function openAdd() {
    $('modalTitle').textContent = 'افزودن مشتری';
    $('customerForm').reset();
    $('customerId').value = '';
    $('deleteBtn').classList.add('hidden');
    $('aiBtn').style.display = 'none';
    $('modal').classList.add('open');
}

function openEdit(c) {
    $('modalTitle').textContent = 'ویرایش مشتری';
    $('customerId').value = c.id;
    $('name').value = c.name || '';
    $('phone').value = c.phone || '';
    $('email').value = c.email || '';
    $('status').value = c.status || 'lead';
    $('notes').value = c.notes || '';
    $('deleteBtn').classList.remove('hidden');
    $('aiBtn').style.display = 'block';
    $('modal').classList.add('open');
}

$('addBtn').onclick = openAdd;
$('cancelBtn').onclick = () => $('modal').classList.remove('open');
$('search').oninput = render;

$('customerForm').onsubmit = async (e) => {
    e.preventDefault();
    const btn = $('saveBtn');
    btn.disabled = true;
    btn.textContent = 'در حال ذخیره...';

    const id = $('customerId').value;
    const payload = {
        user_id: me.id,
        name: $('name').value.trim(),
        phone: $('phone').value.trim() || null,
        email: $('email').value.trim() || null,
        status: $('status').value,
        notes: $('notes').value.trim() || null
    };

    try {
        if (id) {
            const { error } = await supabase.from('customers').update(payload).eq('id', id);
            if (error) throw error;
        } else {
            const { error } = await supabase.from('customers').insert(payload);
            if (error) throw error;
        }
        $('modal').classList.remove('open');
        await loadCustomers();
    } catch (err) {
        alert('❌ ' + err.message);
    } finally {
        btn.disabled = false;
        btn.textContent = 'ذخیره';
    }
};

$('deleteBtn').onclick = async () => {
    const id = $('customerId').value;
    if (!id) return;
    if (!confirm('از حذف این مشتری مطمئنید؟')) return;

    const { error } = await supabase.from('customers').delete().eq('id', id);
    if (error) { alert('❌ ' + error.message); return; }
    $('modal').classList.remove('open');
    await loadCustomers();
};
$('aiBtn').onclick = () => {
    const name = $('name').value.trim();
    const phone = $('phone').value.trim();
    if (!name) return;
    window.location.href = 'ai.html?customer=' + encodeURIComponent(name) + '&phone=' + encodeURIComponent(phone || '');
};
init();
</script>
</body>
                                                                                </html>
