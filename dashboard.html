<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="/manifest.webmanifest"><title>داشبورد | مشتری‌یار</title><style>*{box-sizing:border-box}body{font-family:Tahoma;background:#f8fafc;margin:0}.w{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:10px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:20px;margin:16px 0}.btn{border:0;border-radius:10px;padding:11px 16px;background:#0f172a;color:#fff;cursor:pointer;font-weight:bold}.red{background:#b91c1c}.green{background:#166534}.row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #eee;padding:12px 0}.paybox{background:#fffbeb;border:1px solid #fde68a;border-radius:14px;padding:18px}.field{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px;margin:7px 0 12px}@media(max-width:800px){.grid{grid-template-columns:1fr}.top{flex-direction:column}}</style></head><body><div class="w"><header class="top"><div><h1>🚀 داشبورد</h1><div id="user"></div></div><div><button class="btn" id="install" style="display:none">📲 نصب</button> <button class="btn red" id="logout">خروج</button></div></header><div class="grid"><div class="card"><h3>اشتراک فعلی</h3><div id="sub">...</div></div><div class="card"><h3>حرفه‌ای</h3><b>۱۹۹٬۰۰۰ تومان</b><p>۳۰ روز</p><button class="btn buy" data-plan="pro">خرید</button></div><div class="card"><h3>کسب‌وکار</h3><b>۴۹۹٬۰۰۰ تومان</b><p>۳۰ روز</p><button class="btn buy" data-plan="business">خرید</button></div></div><div id="payment" class="card" style="display:none"></div><div class="card"><h2>پرداخت‌های من</h2><div id="payments">...</div></div><div id="admin" style="display:none"></div><a href="/">صفحه اصلی</a></div><script type="module" src="/dashboard.js"></script></body></html>
