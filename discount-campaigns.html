<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کمپین تخفیف | مشتری‌یار</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
<style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Vazirmatn,sans-serif;background:#f8fafc;color:#0f172a;line-height:1.7;padding-bottom:80px}
    .header{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.05);padding:14px 20px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
    .header a{text-decoration:none;font-weight:800;color:#2563eb;font-size:14px;}
    .container{max-width:600px;margin:20px auto;padding:0 16px;}
    .card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,.04);margin-bottom:16px}
    .form-group{margin-bottom:16px}
    label{display:block;font-weight:700;margin-bottom:8px;font-size:14px}
    input, select, textarea {width:100%;padding:12px;border:1px solid #e2e8f0;border-radius:10px;font-family:inherit;font-size:14px;}
    input:focus, select:focus {outline:none;border-color:#d946ef;box-shadow:0 0 0 3px rgba(217,70,239,.1)}
    .btn-main{display:block;width:100%;padding:14px;background:linear-gradient(135deg,#d946ef,#8b5cf6);color:#fff;text-align:center;border-radius:12px;font-weight:800;font-size:15px;border:none;font-family:inherit;cursor:pointer;box-shadow:0 6px 16px rgba(217,70,239,.25);margin-top:10px;}
    .status{margin-top:12px;text-align:center;font-weight:700;font-size:14px;}
    
    /* استایل لیست کدهای ساخته شده */
    .coupon-item{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid #f1f5f9;background:#f8fafc;border-radius:10px;margin-bottom:8px}
    .coupon-code{font-family:monospace;font-size:16px;font-weight:900;color:#d946ef;letter-spacing:1px;}
    .badge{font-size:11px;padding:4px 8px;border-radius:6px;background:#fce7f3;color:#be185d;font-weight:700;}
</style>
</head>
<body>

<div class="header">
    <a href="dashboard.html">← بازگشت به داشبورد</a>
</div>

<div class="container">
    <div class="card">
        <h2 style="margin-bottom:16px;">🎁 ساخت کمپین تخفیف</h2>
        
        <div class="form-group">
            <label>عنوان کمپین (برای خودتان):</label>
            <input type="text" id="campaignTitle" placeholder="مثلاً: تخفیف مشتریان وفادار">
        </div>

        <div class="form-group">
            <label>کد تخفیف (انگلیسی):</label>
            <input type="text" id="couponCode" placeholder="مثلاً: VIP20" style="text-transform:uppercase; direction:ltr; text-align:left;">
        </div>

        <div class="form-group">
            <label>درصد تخفیف (%):</label>
            <input type="number" id="discountPercent" min="1" max="100" placeholder="مثلاً: 20">
        </div>

        <div class="form-group">
            <label>تاریخ انقضا (مثلاً: 1405/08/15):</label>
            <input type="text" id="expiryDate" placeholder="1405/08/15">
        </div>

        <button class="btn-main" id="saveBtn" onclick="saveCampaign()">💾 ذخیره و ساخت کد</button>
        <div class="status" id="statusMsg"></div>
    </div>

    <div class="card">
        <h2 style="margin-bottom:16px;">📋 کدهای تخفیف فعال</h2>
        <div id="couponList">
            <p style="color:#94a3b8;font-size:13px;">در حال دریافت لیست...</p>
        </div>
    </div>
</div>

<script type="module">
import { supabase } from './js/supabase.js'; 
const $ = id => document.getElementById(id);

async function init() {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) { window.location.href = 'login.html'; return; }
    loadCoupons(session.user.id);
}

async function loadCoupons(userId) {
    const { data, error } = await supabase
        .from('discount_campaigns')
        .select('*')
        .eq('user_id', userId)
        .order('created_at', { ascending: false });

    const listDiv = $('couponList');
    if (error) {
        listDiv.innerHTML = '<p style="color:#dc2626;">خطا در دریافت اطلاعات. (جدول discount_campaigns را در سوپابیس بسازید)</p>';
        return;
    }

    if (!data || !data.length) {
        listDiv.innerHTML = '<p style="color:#94a3b8;font-size:13px;">هنوز هیچ کد تخفیفی نساخته‌اید.</p>';
        return;
    }

    listDiv.innerHTML = '';
    data.forEach(c => {
        const div = document.createElement('div');
        div.className = 'coupon-item';
        div.innerHTML = `
            <div>
                <div class="coupon-code">${c.code}</div>
                <div style="font-size:11px;color:#64748b;margin-top:4px;">${c.title} - انقضا: ${c.expiry_date}</div>
            </div>
            <div style="text-align:left;">
                <span class="badge">${c.discount_percent}٪</span>
            </div>
        `;
        listDiv.appendChild(div);
    });
}

window.saveCampaign = async function() {
    const title = $('campaignTitle').value.trim();
    const code = $('couponCode').value.trim().toUpperCase();
    const percent = $('discountPercent').value;
    const expiry = $('expiryDate').value.trim();
    const status = $('statusMsg');
    const btn = $('saveBtn');

    if (!title || !code || !percent) {
        status.innerHTML = '<span style="color:#dc2626;">لطفاً عنوان، کد و درصد تخفیف را وارد کنید.</span>';
        return;
    }

    btn.disabled = true;
    btn.textContent = 'در حال ذخیره...';
    
    const { data: { session } } = await supabase.auth.getSession();

    const { error } = await supabase
        .from('discount_campaigns')
        .insert({
            user_id: session.user.id,
            title: title,
            code: code,
            discount_percent: parseInt(percent),
            expiry_date: expiry
        });

    if (error) {
        status.innerHTML = `<span style="color:#dc2626;">❌ خطا: ${error.message} (آیا جدول در دیتابیس ساخته شده؟)</span>`;
    } else {
        status.innerHTML = '<span style="color:#16a34a;">✅ کد تخفیف با موفقیت ساخته شد!</span>';
        $('campaignTitle').value = '';
        $('couponCode').value = '';
        $('discountPercent').value = '';
        $('expiryDate').value = '';
        loadCoupons(session.user.id);
    }
    
    btn.disabled = false;
    btn.textContent = '💾 ذخیره و ساخت کد';
}

init();
</script>
</body>
</html>
