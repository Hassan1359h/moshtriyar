<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کمپین تخفیف | مشتری‌یار</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
<style>
    :root { --primary: #d946ef; --bg: #f8fafc; --card: #ffffff; --text-main: #1e293b; --text-muted: #64748b; --success: #10b981; --danger: #ef4444; }
    *{box-sizing:border-box;margin:0;padding:0;font-family:'Vazirmatn', sans-serif;}
    body{background:var(--bg);color:var(--text-main);line-height:1.7;padding-bottom:80px;}
    .header{background:var(--card);box-shadow:0 4px 20px rgba(0,0,0,.03);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
    .header a{text-decoration:none;color:var(--text-muted);font-weight:700;font-size:14px;}
    .container{max-width:800px;margin:20px auto;padding:0 16px;}
    .form-card {background: var(--card);border-radius: 20px;padding: 24px;box-shadow: 0 4px 15px rgba(0,0,0,.03);margin-bottom: 24px;border-top: 4px solid var(--primary);}
    .form-card h2{font-size:18px;font-weight:900;margin-bottom:20px;}
    .form-group{margin-bottom:16px;}
    label{display:block;font-weight:800;margin-bottom:8px;font-size:13px;}
    input {width:100%;padding:14px;border:1px solid #e2e8f0;border-radius:12px;font-family:inherit;font-size:14px;background:#f8fafc;}
    input:focus{outline:none;border-color:var(--primary);background:var(--card);}
    .btn-save {width:100%;padding:16px;background:linear-gradient(135deg, var(--primary), #8b5cf6);color:#fff;border:none;border-radius:12px;font-family:inherit;font-weight:800;font-size:15px;cursor:pointer;box-shadow: 0 6px 16px rgba(217,70,239,.25);}
    .section-title{font-size:18px;font-weight:900;margin:32px 0 16px;display:flex;align-items:center;gap:8px;}
    .coupon-card {background: var(--card);border-radius: 16px;padding: 20px;box-shadow: 0 4px 15px rgba(0,0,0,.03);margin-bottom: 16px;border-right: 5px solid var(--primary);position: relative;transition:0.3s;}
    .coupon-card.inactive {border-right-color: var(--text-muted);opacity: 0.7;}
    .coupon-header {display: flex;justify-content: space-between;align-items: flex-start;margin-bottom: 12px;}
    .coupon-code {font-size: 20px;font-weight: 900;color: var(--primary);letter-spacing: 1px;direction: ltr;}
    .coupon-title {font-size: 13px;color: var(--text-muted);margin-bottom: 4px;}
    .coupon-discount {font-size: 16px;font-weight: 900;color: var(--danger);}
    .coupon-stats {display: flex;justify-content: space-between;background: #f8fafc;padding: 10px;border-radius: 10px;font-size: 12px;font-weight: 700;margin-bottom: 16px;}
    .share-btns {display: grid;grid-template-columns: repeat(2, 1fr);gap: 8px;margin-bottom: 16px;}
    .share-btn {padding: 12px;border: none;border-radius: 10px;font-family: inherit;font-size: 12px;font-weight: 800;cursor: pointer;display: flex;align-items: center; justify-content: center; gap: 6px;color: white; transition: 0.2s;}
    .share-btn:hover {opacity: 0.9; transform: translateY(-1px);}
    .btn-ai {background: linear-gradient(135deg, #8b5cf6, #d946ef); grid-column: span 2; font-size: 14px; box-shadow: 0 4px 10px rgba(217,70,239,0.3); padding: 14px;}
    .btn-wa {background: #25D366;}
    .btn-telegram {background: #0088cc;}
    .btn-eitaa {background: #f59e0b;}
    .btn-rubika {background: #7c3aed;}
    .btn-bulk {background: #4f46e5; grid-column: span 2; padding: 14px; font-size: 14px;}
    .btn-copy {background: #64748b; grid-column: span 2;}
    .toggle-status {position: absolute;top: 20px;left: 20px;width: 40px;height: 22px;background: #e2e8f0;border-radius: 20px;cursor: pointer;transition: 0.3s;}
    .toggle-status::after {content: '';position: absolute;top: 2px;left: 2px;width: 18px;height: 18px;background: #fff;border-radius: 50%;transition: 0.3s;}
    .toggle-status.active {background: var(--success);}
    .toggle-status.active::after {left: 20px;}
    .loading-spinner {display: inline-block;width: 16px;height: 16px;border: 2px solid rgba(255,255,255,0.3);border-radius: 50%;border-top-color: #fff;animation: spin 1s ease-in-out infinite;margin-left: 8px;}
    @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="header">
    <a href="dashboard.html">← بازگشت به داشبورد</a>
    <div style="font-weight:800; font-size:15px;">کمپین تخفیف</div>
    <div style="width:20px;"></div>
</div>

<div class="container">
    <div class="form-card">
        <h2>🎁 ساخت کمپین جدید</h2>
        <div class="form-group"><label>عنوان (برای خودتان):</label><input type="text" id="campaignTitle" placeholder="مثلاً: تخفیف مشتریان وفادار"></div>
        <div class="form-group"><label>کد تخفیف (انگلیسی):</label><input type="text" id="couponCode" placeholder="مثلاً: VIP20" style="text-transform:uppercase; direction:ltr; text-align:left;"></div>
        <div class="form-group"><label>درصد تخفیف (%):</label><input type="number" id="discountPercent" min="1" max="100" placeholder="مثلاً: 20"></div>
        <div class="form-group"><label>تاریخ انقضا:</label><input type="text" id="expiryDate" placeholder="1405/08/15"></div>
        <div class="form-group"><label>حداکثر تعداد استفاده (اختیاری):</label><input type="number" id="maxUsage" placeholder="مثلاً: 100" value="100"></div>
        <button class="btn-save" onclick="saveCampaign()">💾 ساخت کد تخفیف</button>
        <div id="statusMsg" style="text-align:center;margin-top:12px;font-weight:700;font-size:14px;"></div>
    </div>

    <div class="section-title">📋 کدهای فعال شما</div>
    <div id="couponList"><p style="color:var(--text-muted);font-size:13px;">در حال دریافت...</p></div>
</div>

<script type="module">
import { supabase } from './js/supabase.js'; 
const $ = id => document.getElementById(id);
let currentUserId = null;
let couponsData = []; 

async function init() {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) { window.location.href = 'login.html'; return; }
    currentUserId = session.user.id;
    loadCoupons();
}

async function loadCoupons() {
    const { data, error } = await supabase.from('discount_campaigns').select('*').eq('user_id', currentUserId).order('created_at', { ascending: false });
    const listDiv = $('couponList');
    if (error || !data || data.length === 0) {
        listDiv.innerHTML = '<p style="color:var(--text-muted);">هنوز کدی نساخته‌اید.</p>'; return;
    }
    couponsData = data; 
    listDiv.innerHTML = '';
    
    data.forEach(c => {
        const isActive = c.is_active !== false; 
        const used = c.usage_count || 0;
        const max = c.max_usage || 100;
        
        listDiv.innerHTML += `
            <div class="coupon-card ${isActive ? '' : 'inactive'}">
                <div class="toggle-status ${isActive ? 'active' : ''}" onclick="toggleStatus('${c.id}', ${isActive})"></div>
                <div class="coupon-header">
                    <div>
                        <div class="coupon-title">${c.title}</div>
                        <div class="coupon-code">${c.code}</div>
                    </div>
                    <div class="coupon-discount">${c.discount_percent}٪</div>
                </div>
                <div class="coupon-stats">
                    <span>استفاده شده: ${used} از ${max}</span>
                    <span>انقضا: ${c.expiry_date}</span>
                </div>
                <div class="share-btns">
                    <button class="share-btn btn-ai" id="aiBtn-${c.id}" onclick="generateAIText('${c.id}', '${c.code}', '${c.discount_percent}', '${c.expiry_date}')">
                        ✨ تولید متن با هوش مصنوعی و ارسال
                    </button>
                    <button class="share-btn btn-wa" onclick="shareCoupon('${c.code}', 'whatsapp')">واتساپ</button>
                    <button class="share-btn btn-telegram" onclick="shareCoupon('${c.code}', 'telegram')">تلگرام</button>
                    <button class="share-btn btn-eitaa" onclick="shareCoupon('${c.code}', 'eitaa')">ایتا</button>
                    <button class="share-btn btn-rubika" onclick="shareCoupon('${c.code}', 'rubika')">روبیکا</button>
                    <button class="share-btn btn-bulk" onclick="sendToBulkSms('${c.code}', '${c.discount_percent}', '${c.expiry_date}')">✉️ ارسال به پنل پیامک انبوه</button>
                    <button class="share-btn btn-copy" onclick="shareCoupon('${c.code}', 'copy')">📋 کپی متن</button>
                </div>
            </div>
        `;
    });
}

// 🧠 موتور هوشمند تولید متن (با استفاده از حافظه مرورگر)
window.generateAIText = function(id, code, percent, expiry) {
    const btn = $(`aiBtn-${id}`);
    btn.innerHTML = 'در حال نوشتن متن... <span class="loading-spinner"></span>';
    btn.disabled = true;

    setTimeout(() => {
        const templates = [
            `🔥 فرصت استثنایی!\nفقط تا ${expiry} فرصت دارید با کد تخفیف ${code}، ${percent}٪ تخفیف ویژه بگیرید. منتظرتان هستیم! 🛒`,
            `🎁 یک هدیه ویژه برای شما!\nبا کد ${code} در خرید خود ${percent}٪ تخفیف بگیرید. این فرصت را از دست ندهید! ⏳`,
            `✨ خرید هوشمندانه، تخفیف باورنکردنی!\nهمین حالا از کد ${code} استفاده کنید و ${percent}٪ ارزان‌تر خرید کنید. 😍`,
            `📢 مشتریان عزیز!\nبه مناسبت ویژه، تا ${expiry} با کد ${code} معادل ${percent}٪ تخفیف دریافت کنید. 🎉`,
            `🚀 پرواز تخفیف‌ها شروع شد!\nبا کد اختصاصی ${code}، ${percent}٪ از خریدتان کم می‌شود. عجله کنید! 🏃‍♂️💨`,
            `💎 پیشنهاد ویژه VIP!\nشما لایق بهترین‌ها هستید. با کد ${code} تا ${expiry}، ${percent}٪ تخفیف بگیرید. 🌟`
        ];

        const randomText = templates[Math.floor(Math.random() * templates.length)];
        
        // ذخیره در حافظه گوشی
        localStorage.setItem('campaign_sms_text', randomText);
        
        // انتقال به صفحه پیامک
        window.location.href = 'sms-bulk.html';
    }, 800);
}

window.saveCampaign = async function() {
    const title = $('campaignTitle').value.trim();
    const code = $('couponCode').value.trim().toUpperCase();
    const percent = $('discountPercent').value;
    const expiry = $('expiryDate').value.trim();
    const maxUse = $('maxUsage').value || 100;
    const status = $('statusMsg');
    if (!title || !code || !percent) { status.innerHTML = '<span style="color:#dc2626;">لطفاً فیلدها را پر کنید.</span>'; return; }
    const { error } = await supabase.from('discount_campaigns').insert({ user_id: currentUserId, title: title, code: code, discount_percent: parseInt(percent), expiry_date: expiry, max_usage: parseInt(maxUse), usage_count: 0, is_active: true });
    if (error) { status.innerHTML = `<span style="color:#dc2626;">❌ خطا: ${error.message}</span>`; } 
    else {
        status.innerHTML = '<span style="color:#16a34a;">✅ کد ساخته شد!</span>';
        $('campaignTitle').value = ''; $('couponCode').value = ''; $('discountPercent').value = ''; $('expiryDate').value = '';
        loadCoupons();
    }
}

window.toggleStatus = async function(id, currentStatus) {
    await supabase.from('discount_campaigns').update({ is_active: !currentStatus }).eq('id', id);
    loadCoupons();
}

window.sendToBulkSms = function(code, percent, expiry) {
    const text = `🎁 مشتری عزیز، با کد تخفیف ${code} می‌توانید ${percent}٪ تخفیف بگیرید. اعتبار تا: ${expiry}`;
    localStorage.setItem('campaign_sms_text', text);
    window.location.href = 'sms-bulk.html';
}

window.shareCoupon = function(code, platform) {
    const coupon = couponsData.find(c => c.code === code);
    if(!coupon) return;
    const text = `🎁 مشتری عزیز، با کد تخفیف ${code} می‌توانید ${coupon.discount_percent}٪ تخفیف بگیرید.\n⏳ اعتبار تا: ${coupon.expiry_date}`;
    if (platform === 'whatsapp') window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
    else if (platform === 'telegram') window.open(`https://t.me/share/url?url=${encodeURIComponent(window.location.origin)}&text=${encodeURIComponent(text)}`, '_blank');
    else if (platform === 'eitaa') window.open(`https://eitaa.com/share/url?url=${encodeURIComponent(window.location.origin)}&text=${encodeURIComponent(text)}`, '_blank');
    else if (platform === 'rubika') window.open(`https://rubika.ir/share/url?url=${encodeURIComponent(window.location.origin)}&text=${encodeURIComponent(text)}`, '_blank');
    else if (platform === 'copy') navigator.clipboard.writeText(text).then(() => alert('✅ متن کپی شد.'));
}
init();
</script>
</body>
</html>
