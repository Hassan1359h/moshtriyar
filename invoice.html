<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#2563eb">
<title>🧾 فاکتور هوشمند | مشتری‌یار</title>

<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Vazirmatn,Tahoma,Arial,sans-serif;
    background:#f1f5f9;
    color:#0f172a;
}
.container{
    max-width:900px;
    margin:auto;
    padding:15px;
}
.header{
    background:linear-gradient(135deg,#2563eb,#4f46e5);
    color:#fff;
    padding:20px;
    border-radius:18px;
    margin-bottom:15px;
}
.header h1{
    margin:0 0 7px;
    font-size:22px;
}
.header p{
    margin:0;
    font-size:13px;
    opacity:.9;
}
.card{
    background:#fff;
    border-radius:16px;
    padding:16px;
    margin-bottom:15px;
    box-shadow:0 3px 15px rgba(0,0,0,.06);
}
.title{
    font-size:16px;
    font-weight:800;
    margin-bottom:14px;
}
.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}
@media(max-width:600px){
    .grid{grid-template-columns:1fr}
}
label{
    display:block;
    font-size:12px;
    font-weight:700;
    margin-bottom:6px;
}
input,select{
    width:100%;
    border:1px solid #cbd5e1;
    border-radius:10px;
    padding:11px;
    font-family:inherit;
    font-size:13px;
    background:#fff;
}
input:focus,select:focus{
    outline:none;
    border-color:#2563eb;
}
.items{
    display:flex;
    flex-direction:column;
    gap:10px;
}
.item{
    border:1px solid #e2e8f0;
    border-radius:14px;
    padding:12px;
    background:#f8fafc;
}
.item-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:9px;
}
.item-number{
    font-weight:800;
    font-size:13px;
}
.remove{
    border:0;
    background:#fee2e2;
    color:#b91c1c;
    width:32px;
    height:32px;
    border-radius:9px;
    cursor:pointer;
    font-size:18px;
}
.item-grid{
    display:grid;
    grid-template-columns:2fr 1fr 1.5fr;
    gap:8px;
}
@media(max-width:600px){
    .item-grid{
        grid-template-columns:1fr 1fr;
    }
    .item-grid select{
        grid-column:1/-1;
    }
}
.btn{
    border:0;
    border-radius:11px;
    padding:12px 15px;
    font-family:inherit;
    font-size:13px;
    font-weight:800;
    cursor:pointer;
}
.btn-blue{
    background:#2563eb;
    color:#fff;
}
.btn-green{
    background:#16a34a;
    color:#fff;
}
.btn-gray{
    background:#e2e8f0;
    color:#0f172a;
}
.btn-red{
    background:#dc2626;
    color:#fff;
}
.buttons{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:9px;
}
@media(max-width:600px){
    .buttons{grid-template-columns:1fr}
}
.add-btn{
    width:100%;
    margin-top:12px;
}
.summary{
    border-top:1px solid #e2e8f0;
    margin-top:15px;
    padding-top:15px;
}
.sum-row{
    display:flex;
    justify-content:space-between;
    padding:7px 0;
    font-size:13px;
}
.total{
    font-size:18px;
    font-weight:900;
    color:#2563eb;
    border-top:2px solid #e2e8f0;
    margin-top:7px;
    padding-top:12px;
}
.message{
    padding:12px;
    border-radius:10px;
    font-size:12px;
    margin-bottom:12px;
    display:none;
}
.success{
    display:block;
    background:#dcfce7;
    color:#166534;
}
.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}
.info{
    display:block;
    background:#dbeafe;
    color:#1e40af;
}
.loading{
    text-align:center;
    color:#64748b;
    padding:20px;
}
</style>
</head>

<body>

<main class="container">

<div class="header">
    <h1>🧾 فاکتور هوشمند</h1>
    <p>ساخت سریع فاکتور با مشتریان و محصولات مشتری‌یار</p>
</div>

<div id="message" class="message"></div>

<section class="card">

<div class="title">📋 اطلاعات فاکتور</div>

<div class="grid">

<div>
<label>شماره فاکتور</label>
<input id="invoiceNumber" readonly>
</div>

<div>
<label>تاریخ شمسی</label>
<input id="invoiceDate" readonly>
</div>

<div>
<label>👥 مشتری</label>
<select id="customerSelect">
<option value="">در حال بارگذاری مشتریان...</option>
</select>
</div>

<div>
<label>نام مشتری</label>
<input id="customer" placeholder="یا نام را دستی وارد کنید">
</div>

</div>

</section>

<section class="card">

<div class="title">📦 محصولات</div>

<div id="items" class="items">
    <div class="loading">در حال آماده‌سازی...</div>
</div>

<button id="addItem" class="btn btn-blue add-btn">
➕ افزودن محصول
</button>

</section>

<section class="card">

<div class="title">💰 تخفیف</div>

<div class="grid">

<div>
<label>درصد تخفیف</label>
<input id="discountPercent" type="number" min="0" max="100" value="0">
</div>

<div>
<label>تخفیف ثابت (تومان)</label>
<input id="discountFixed" type="number" min="0" value="0">
</div>

</div>

<div class="summary">

<div class="sum-row">
<span>جمع کالاها</span>
<strong id="subtotal">۰ تومان</strong>
</div>

<div class="sum-row">
<span>تخفیف</span>
<strong id="discount">۰ تومان</strong>
</div>

<div class="sum-row total">
<span>مبلغ نهایی</span>
<strong id="total">۰ تومان</strong>
</div>

</div>

</section>

<section class="card">

<div class="title">⚡ عملیات فاکتور</div>

<div class="buttons">

<button id="saveBtn" class="btn btn-green">
💾 ذخیره در حساب
</button>

<button id="copyBtn" class="btn btn-blue">
📋 کپی فاکتور
</button>

<button id="shareBtn" class="btn btn-gray">
📤 اشتراک‌گذاری
</button>

<button id="clearBtn" class="btn btn-red">
🗑️ فاکتور جدید
</button>

</div>

</section>

</main>
<section class="card">

    <div class="title">📚 آرشیو فاکتورها</div>

    <div style="margin-bottom:12px;">
        <input
            id="invoiceSearch"
            type="text"
            placeholder="🔎 جستجو با شماره فاکتور یا نام مشتری..."
        >
    </div>

    <div id="invoiceArchive">
        <div class="loading">
            در حال دریافت فاکتورها...
        </div>
    </div>

</section>
<script type="module">

import { supabase } from './js/supabase.js';

let itemCount = 0;
let products = [];
let customers = [];
let me = null;
let editingInvoiceId = null;   
async function loadInvoiceArchive(){

    const archive = $("invoiceArchive");

    if(!me){
        archive.innerHTML =
            '<div class="loading">کاربر وارد حساب نشده است.</div>';
        return;
    }

    const {
        data,
        error
    } = await supabase
        .from("invoices")
        .select("*")
        .eq("user_id",me.id)
        .order("created_at",{ascending:false});

    if(error){

        console.error(error);

        archive.innerHTML =
            '<div class="message error" style="display:block;">خطا در دریافت فاکتورها.</div>';

        return;

    }

    window.invoiceArchiveData = data || [];
renderInvoiceArchive(window.invoiceArchiveData);

}


function renderInvoiceArchive(list){

    const archive = $("invoiceArchive");

    if(!list.length){

        archive.innerHTML =
            '<div class="loading">هنوز فاکتوری ذخیره نشده است.</div>';

        return;

    }

    archive.innerHTML = "";

    list.forEach(invoice => {

        const div = document.createElement("div");

        div.style.cssText =
            "border:1px solid #e2e8f0;" +
            "border-radius:14px;" +
            "padding:12px;" +
            "margin-bottom:10px;" +
            "background:#f8fafc;";

        div.innerHTML =

            '<div style="font-weight:900;margin-bottom:7px;">' +
            "🧾 " +
            escapeHtml(invoice.invoice_number) +
            "</div>" +

            '<div style="font-size:12px;color:#64748b;margin-bottom:5px;">' +
            "📅 " +
            escapeHtml(invoice.invoice_date) +
            "</div>" +

            '<div style="font-size:13px;margin-bottom:5px;">' +
            "👥 مشتری: " +
            escapeHtml(invoice.customer_name || "بدون نام") +
            "</div>" +

            '<div style="font-size:13px;font-weight:800;color:#2563eb;margin-bottom:10px;">' +
            "💰 " +
            money(invoice.total) +
            "</div>" +

            '<button class="btn btn-blue archive-copy" type="button">' +
"📋 کپی فاکتور" +
"</button>" +

'<button class="btn btn-green archive-edit" type="button" style="margin-right:6px;">' +
"✏️ ویرایش" +
"</button>" +

'<button class="btn btn-red archive-delete" type="button" style="margin-right:6px;">' +
"🗑️ حذف" +
"</button>";

        div.querySelector(".archive-copy").onclick =
            async () => {

                const text =
                    buildSavedInvoiceText(invoice);

                try{

                    await navigator.clipboard.writeText(text);

                    message(
                        "فاکتور کپی شد.",
                        "success"
                    );

                }catch(e){

                    message(
                        "کپی انجام نشد.",
                        "error"
                    );

                }

            };
div.querySelector(".archive-edit").onclick = () => {

    editingInvoiceId = invoice.id;

    $("invoiceNumber").value =
        invoice.invoice_number || "";

    $("invoiceDate").value =
        invoice.invoice_date || "";

    $("customerSelect").value =
        invoice.customer_id || "";

    $("customer").value =
        invoice.customer_name || "";

    $("discountPercent").value = 0;
    $("discountFixed").value =
        Number(invoice.discount) || 0;

    $("items").innerHTML = "";
    itemCount = 0;

    const items =
        Array.isArray(invoice.items)
            ? invoice.items
            : [];

    items.forEach(savedItem => {

        addItem();

        const item =
            $("items").lastElementChild;

        const productSelect =
            item.querySelector(".productSelect");

        const quantity =
            item.querySelector(".quantity");

        const price =
            item.querySelector(".price");

        productSelect.value =
            savedItem.product_id || "";

        quantity.value =
            savedItem.quantity || 1;

        price.value =
            savedItem.unit_price || 0;

    });

    if(items.length === 0){
        addItem();
    }

    calculate();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

    message(
        "فاکتور برای ویرایش آماده شد.",
        "success"
    );

};
        

        div.querySelector(".archive-delete").onclick =
            async () => {

                if(
                    !confirm(
                        "این فاکتور حذف شود؟"
                    )
                ) return;

                const {
                    error
                } = await supabase
                    .from("invoices")
                    .delete()
                    .eq("id",invoice.id)
                    .eq("user_id",me.id);

                if(error){

                    console.error(error);

                    message(
                        "حذف فاکتور انجام نشد.",
                        "error"
                    );

                    return;

                }

                message(
                    "فاکتور حذف شد.",
                    "success"
                );

                loadInvoiceArchive();

            };

        archive.appendChild(div);

    });

}
    


function buildSavedInvoiceText(invoice){

    let text =
        "🧾 فاکتور هوشمند مشتری‌یار\n" +
        "━━━━━━━━━━━━━━\n";

    text +=
        "شماره فاکتور: " +
        (invoice.invoice_number || "") +
        "\n";

    text +=
        "تاریخ: " +
        (invoice.invoice_date || "") +
        "\n";

    if(invoice.customer_name){

        text +=
            "مشتری: " +
            invoice.customer_name +
            "\n";

    }

    text += "\n📦 محصولات:\n";

    const items =
        Array.isArray(invoice.items)
            ? invoice.items
            : [];

    items.forEach((item,index) => {

        text +=
            (index + 1) +
            ". " +
            (item.product_name || "محصول") +
            " | تعداد: " +
            (item.quantity || 0) +
            " | قیمت: " +
            money(item.unit_price) +
            " | جمع: " +
            money(item.row_total) +
            "\n";

    });

    text +=
        "\n━━━━━━━━━━━━━━\n" +
        "جمع کالاها: " +
        money(invoice.subtotal) +
        "\n" +
        "تخفیف: " +
        money(invoice.discount) +
        "\n" +
        "مبلغ نهایی: " +
        money(invoice.total) +
        "\n\n" +
        "مشتری‌یار";

    return text;

    }
const $ = id => document.getElementById(id);

const money = n =>
    new Intl.NumberFormat("fa-IR")
    .format(Math.round(Number(n) || 0))
    + " تومان";


function todayShamsi(){

    try{

        return new Intl.DateTimeFormat(
            "fa-IR-u-ca-persian",
            {
                year:"numeric",
                month:"2-digit",
                day:"2-digit"
            }
        ).format(new Date());

    }catch(e){

        return new Date().toLocaleDateString("fa-IR");

    }

}


function invoiceNumber(){

    const d = new Date();

    return "INV-" +
        d.getFullYear() +
        String(d.getMonth()+1).padStart(2,"0") +
        String(d.getDate()).padStart(2,"0") +
        "-" +
        String(d.getHours()).padStart(2,"0") +
        String(d.getMinutes()).padStart(2,"0") +
        String(d.getSeconds()).padStart(2,"0");

}


function message(text,type){

    const box = $("message");

    box.textContent = text;
    box.className = "message " + type;

    setTimeout(() => {
        box.className = "message";
    },3500);

}


async function init(){

    const {
        data:{
            session
        }
    } = await supabase.auth.getSession();

    if(!session){

        window.location.href = "login.html";
        return;

    }

    me = session.user;

    await Promise.all([
        loadCustomers(),
        loadProducts()
    ]);
await loadInvoiceArchive();
    
    $("invoiceNumber").value = invoiceNumber();
    $("invoiceDate").value = todayShamsi();

    $("items").innerHTML = "";

    addItem();

    calculate();

}


async function loadCustomers(){

    const {
        data,
        error
    } = await supabase
        .from("customers")
        .select("id,name,phone")
        .eq("user_id",me.id)
        .order("created_at",{ascending:false});

    if(error){

        $("customerSelect").innerHTML =
            '<option value="">خطا در دریافت مشتریان</option>';

        console.error(error);

        return;

    }

    customers = data || [];

    renderCustomers();

}


function renderCustomers(){

    const select = $("customerSelect");

    select.innerHTML =
        '<option value="">انتخاب مشتری...</option>';

    customers.forEach(c => {

        const option = document.createElement("option");

        option.value = c.id;

        option.textContent =
            c.name +
            (c.phone ? " - " + c.phone : "");

        select.appendChild(option);

    });

}


$("customerSelect").onchange = () => {

    const id = $("customerSelect").value;

    if(!id) return;

    const customer = customers.find(c => c.id === id);

    if(customer){

        $("customer").value = customer.name || "";

    }

};


async function loadProducts(){

    const {
        data,
        error
    } = await supabase
        .from("products")
        .select("id,name,price")
        .eq("user_id",me.id)
        .order("created_at",{ascending:false});

    if(error){

        products = [];

        console.error(error);

        return;

    }

    products = data || [];

}


function productOptions(){

    let html =
        '<option value="">انتخاب محصول...</option>';

    products.forEach(p => {

        html +=
            '<option value="' +
            escapeHtml(p.id) +
            '">' +
            escapeHtml(p.name) +
            " - " +
            money(p.price) +
            "</option>";

    });

    return html;

}


function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function addItem(){

    if(itemCount >= 25){

        message(
            "حداکثر ۲۵ ردیف مجاز است.",
            "error"
        );

        return;

    }

    itemCount++;

    const id = itemCount;

    const div = document.createElement("div");

    div.className = "item";
    div.dataset.id = id;

    div.innerHTML =

        '<div class="item-head">' +

        '<span class="item-number">' +
        "ردیف " +
        new Intl.NumberFormat("fa-IR").format(id) +
        "</span>" +

        '<button class="remove" type="button">×</button>' +

        "</div>" +

        '<div class="item-grid">' +

        '<select class="productSelect">' +
        productOptions() +
        "</select>" +

        '<input class="quantity" type="number" min="1" value="1" placeholder="تعداد">' +

        '<input class="price" type="number" min="0" value="0" placeholder="قیمت واحد">' +

        "</div>" +

        '<div style="margin-top:9px;font-size:12px;font-weight:800;color:#475569">' +

        "مبلغ ردیف: " +

        '<span class="rowTotal">۰ تومان</span>' +

        "</div>";

    $("items").appendChild(div);


    const productSelect =
        div.querySelector(".productSelect");

    const quantity =
        div.querySelector(".quantity");

    const price =
        div.querySelector(".price");


    productSelect.onchange = () => {

        const product =
            products.find(
                p => p.id === productSelect.value
            );

        if(product){

            price.value =
                Number(product.price) || 0;

        }

        calculate();

    };


    quantity.oninput = calculate;
    price.oninput = calculate;


    div.querySelector(".remove").onclick = () => {

        div.remove();

        calculate();

    };

}


function calculate(){

    let subtotal = 0;

    document
        .querySelectorAll(".item")
        .forEach(item => {

            const q =
                Number(
                    item.querySelector(".quantity").value
                ) || 0;

            const p =
                Number(
                    item.querySelector(".price").value
                ) || 0;

            const t = q * p;

            subtotal += t;

            item.querySelector(".rowTotal")
                .textContent = money(t);

        });


    const percent =
        Math.min(
            100,
            Math.max(
                0,
                Number(
                    $("discountPercent").value
                ) || 0
            )
        );


    const fixed =
        Math.max(
            0,
            Number(
                $("discountFixed").value
            ) || 0
        );


    const discount =
        Math.min(
            subtotal,
            subtotal * percent / 100 + fixed
        );


    const total =
        Math.max(
            0,
            subtotal - discount
        );


    $("subtotal").textContent =
        money(subtotal);

    $("discount").textContent =
        money(discount);

    $("total").textContent =
        money(total);


    return {
        subtotal,
        discount,
        total
    };

}


function invoiceText(){

    const customer =
        $("customer").value.trim();

    const calc = calculate();

    let text =
        "🧾 فاکتور هوشمند مشتری‌یار\n" +
        "━━━━━━━━━━━━━━\n";


    text +=
        "شماره فاکتور: " +
        $("invoiceNumber").value +
        "\n";


    text +=
        "تاریخ: " +
        $("invoiceDate").value +
        "\n";


    if(customer){

        text +=
            "مشتری: " +
            customer +
            "\n";

    }


    text +=
        "\n📦 محصولات:\n";


    let i = 0;


    document
        .querySelectorAll(".item")
        .forEach(item => {

            const name =
                item.querySelector(".productSelect")
                .selectedOptions[0]?.textContent
                ?.split(" - ")[0]
                ?.trim() || "";


            const q =
                Number(
                    item.querySelector(".quantity").value
                ) || 0;


            const p =
                Number(
                    item.querySelector(".price").value
                ) || 0;


            if(name || p){

                i++;

                text +=
                    i +
                    ". " +
                    (name || "محصول") +
                    " | تعداد: " +
                    q +
                    " | قیمت: " +
                    money(p) +
                    " | جمع: " +
                    money(q*p) +
                    "\n";

            }

        });


    text +=
        "\n━━━━━━━━━━━━━━\n" +
        "جمع کالاها: " +
        money(calc.subtotal) +
        "\n" +
        "تخفیف: " +
        money(calc.discount) +
        "\n" +
        "مبلغ نهایی: " +
        money(calc.total) +
        "\n\n" +
        "مشتری‌یار";


    return text;

}


$("addItem").onclick = addItem;

$("discountPercent").oninput = calculate;

$("discountFixed").oninput = calculate;


$("copyBtn").onclick = async () => {

    try{

        await navigator.clipboard.writeText(
            invoiceText()
        );

        message(
            "فاکتور کپی شد.",
            "success"
        );

    }catch(e){

        message(
            "کپی در این مرورگر انجام نشد.",
            "error"
        );

    }

};


$("shareBtn").onclick = async () => {

    const text = invoiceText();

    if(navigator.share){

        try{

            await navigator.share({
                title:"فاکتور مشتری‌یار",
                text
            });

        }catch(e){}

    }else{

        try{

            await navigator.clipboard.writeText(text);

            message(
                "متن فاکتور کپی شد.",
                "info"
            );

        }catch(e){

            message(
                "اشتراک‌گذاری پشتیبانی نمی‌شود.",
                "error"
            );

        }

    }

};

$("saveBtn").onclick = async () => {

    if(!me){

        message(
            "کاربر وارد حساب نشده است.",
            "error"
        );

        return;

    }

    const calc = calculate();

    const customerId =
        $("customerSelect").value || null;

    const customerName =
        $("customer").value.trim() || null;

    const invoiceData = [];

    document
        .querySelectorAll(".item")
        .forEach(item => {

            const productSelect =
                item.querySelector(".productSelect");

            const quantity =
                Number(
                    item.querySelector(".quantity").value
                ) || 0;

            const price =
                Number(
                    item.querySelector(".price").value
                ) || 0;

            const productId =
                productSelect.value || null;

            const productName =
                productSelect
                .selectedOptions[0]
                ?.textContent
                ?.split(" - ")[0]
                ?.trim() || "محصول";

            if(quantity > 0 && (productId || price > 0)){

                invoiceData.push({
                    product_id: productId,
                    product_name: productName,
                    quantity: quantity,
                    unit_price: price,
                    row_total: quantity * price
                });

            }

        });

    if(invoiceData.length === 0){

        message(
            "حداقل یک محصول برای ذخیره فاکتور وارد کنید.",
            "error"
        );

        return;

    }

    $("saveBtn").disabled = true;
    $("saveBtn").textContent = "⏳ در حال ذخیره...";

    try{

       let data;
let error;

if(editingInvoiceId){

    const result =
        await supabase
            .from("invoices")
            .update({
                invoice_number:
                    $("invoiceNumber").value,
                invoice_date:
                    $("invoiceDate").value,
                customer_id:
                    customerId,
                customer_name:
                    customerName,
                items:
                    invoiceData,
                subtotal:
                    calc.subtotal,
                discount:
                    calc.discount,
                total:
                    calc.total,
                updated_at:
                    new Date().toISOString()
            })
            .eq("id",editingInvoiceId)
            .eq("user_id",me.id)
            .select()
            .single();

    data = result.data;
    error = result.error;

}else{

    const result =
        await supabase
            .from("invoices")
            .insert({
                user_id: me.id,
                invoice_number:
                    $("invoiceNumber").value,
                invoice_date:
                    $("invoiceDate").value,
                customer_id:
                    customerId,
                customer_name:
                    customerName,
                items:
                    invoiceData,
                subtotal:
                    calc.subtotal,
                discount:
                    calc.discount,
                total:
                    calc.total
            })
            .select()
            .single();

    data = result.data;
    error = result.error;

    } 

        if(error){

            console.error(error);

            message(
                "ذخیره فاکتور انجام نشد.",
                "error"
            );

            return;

        }

       message(
    editingInvoiceId
        ? "فاکتور با موفقیت بروزرسانی شد."
        : "فاکتور با موفقیت در حساب شما ذخیره شد.",
    "success"
);

editingInvoiceId = null;

await loadInvoiceArchive();

console.log(
    "Saved invoice:",
    data
); 

    }catch(error){

        console.error(error);

        message(
            "خطا در ذخیره فاکتور.",
            "error"
        );

    }finally{

        $("saveBtn").disabled = false;
        $("saveBtn").textContent =
            "💾 ذخیره در حساب";

    }

};


$("clearBtn").onclick = () => {

    if(
        !confirm(
            "فاکتور فعلی پاک شود؟"
        )
    ) return;


    $("customerSelect").value = "";
    $("customer").value = "";

    $("discountPercent").value = 0;
    $("discountFixed").value = 0;

    $("items").innerHTML = "";

    itemCount = 0;

    $("invoiceNumber").value =
        invoiceNumber();

    $("invoiceDate").value =
        todayShamsi();

    addItem();

    calculate();

    message(
        "فاکتور جدید آماده شد.",
        "success"
    );

};

init();


$("invoiceSearch").addEventListener("input", () => {

    const query =
        $("invoiceSearch").value
            .trim()
            .toLowerCase();

    const list =
        window.invoiceArchiveData || [];

    const filtered =
        list.filter(invoice => {

            const number =
                String(invoice.invoice_number || "")
                    .toLowerCase();

            const customer =
                String(invoice.customer_name || "")
                    .toLowerCase();

            return (
                number.includes(query) ||
                customer.includes(query)
            );

        });

    renderInvoiceArchive(filtered);

});
