<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#2563eb">
<title>🧾 فاکتور هوشمند</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f1f5f9;color:#0f172a}
.container{max-width:900px;margin:auto;padding:15px}
.header{background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;padding:20px;border-radius:18px;margin-bottom:15px}
.header h1{margin:0 0 7px;font-size:22px}
.header p{margin:0;font-size:13px;opacity:.9}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:15px;box-shadow:0 3px 15px rgba(0,0,0,.06)}
.title{font-size:16px;font-weight:800;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}
input{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:11px;font-family:inherit;font-size:13px}
.items{display:flex;flex-direction:column;gap:10px}
.item{border:1px solid #e2e8f0;border-radius:14px;padding:12px;background:#f8fafc}
.item-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.item-number{font-weight:800;font-size:13px}
.remove{border:0;background:#fee2e2;color:#b91c1c;width:32px;height:32px;border-radius:9px;cursor:pointer}
.item-grid{display:grid;grid-template-columns:2fr 1fr 1.5fr;gap:8px}
@media(max-width:600px){
.item-grid{grid-template-columns:1fr 1fr}
.item-grid input:first-child{grid-column:1/-1}
}
.btn{border:0;border-radius:11px;padding:12px 15px;font-family:inherit;font-size:13px;font-weight:800;cursor:pointer}
.btn-blue{background:#2563eb;color:#fff}
.btn-green{background:#16a34a;color:#fff}
.btn-gray{background:#e2e8f0;color:#0f172a}
.btn-red{background:#dc2626;color:#fff}
.buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
@media(max-width:600px){.buttons{grid-template-columns:1fr}}
.add-btn{width:100%;margin-top:12px}
.summary{border-top:1px solid #e2e8f0;margin-top:15px;padding-top:15px}
.sum-row{display:flex;justify-content:space-between;padding:7px 0;font-size:13px}
.total{font-size:18px;font-weight:900;color:#2563eb;border-top:2px solid #e2e8f0;margin-top:7px;padding-top:12px}
.message{padding:12px;border-radius:10px;font-size:12px;margin-bottom:12px;display:none}
.success{display:block;background:#dcfce7;color:#166534}
.error{display:block;background:#fee2e2;color:#991b1b}
.info{display:block;background:#dbeafe;color:#1e40af}
</style>
</head>

<body>

<main class="container">

<div class="header">
<h1>🧾 فاکتور هوشمند</h1>
<p>ساخت سریع فاکتور برای مشتری و محصولات</p>
</div>

<div id="message" class="message"></div>

<section class="card">

<div class="title">📋 اطلاعات فاکتور</div>

<div class="grid">

<div>
<label>شماره فاکتور</label>
<input id="invoiceNumber" readonly>
</div>

<div>
<label>تاریخ شمسی</label>
<input id="invoiceDate" readonly>
</div>

<div>
<label>نام مشتری</label>
<input id="customer" placeholder="نام مشتری">
</div>

</div>

</section>

<section class="card">

<div class="title">📦 محصولات</div>

<div id="items" class="items"></div>

<button id="addItem" class="btn btn-blue add-btn">
➕ افزودن محصول
</button>

</section>

<section class="card">

<div class="title">💰 تخفیف</div>

<div class="grid">

<div>
<label>درصد تخفیف</label>
<input id="discountPercent" type="number" min="0" max="100" value="0">
</div>

<div>
<label>تخفیف ثابت (تومان)</label>
<input id="discountFixed" type="number" min="0" value="0">
</div>

</div>

<div class="summary">

<div class="sum-row">
<span>جمع کالاها</span>
<strong id="subtotal">۰ تومان</strong>
</div>

<div class="sum-row">
<span>تخفیف</span>
<strong id="discount">۰ تومان</strong>
</div>

<div class="sum-row total">
<span>مبلغ نهایی</span>
<strong id="total">۰ تومان</strong>
</div>

</div>

</section>

<section class="card">

<div class="title">⚡ عملیات فاکتور</div>

<div class="buttons">

<button id="saveBtn" class="btn btn-green">
💾 ذخیره در گوشی
</button>

<button id="copyBtn" class="btn btn-blue">
📋 کپی فاکتور
</button>

<button id="shareBtn" class="btn btn-gray">
📤 اشتراک‌گذاری
</button>

<button id="clearBtn" class="btn btn-red">
🗑️ فاکتور جدید
</button>

</div>

</section>

</main>

<script>

let itemCount=0;

const $=id=>document.getElementById(id);

const money=n=>
new Intl.NumberFormat("fa-IR")
.format(Math.round(Number(n)||0))
+" تومان";


function todayShamsi(){

try{

return new Intl.DateTimeFormat(
"fa-IR-u-ca-persian",
{
year:"numeric",
month:"2-digit",
day:"2-digit"
}
).format(new Date());

}catch(e){

return new Date().toLocaleDateString("fa-IR");

}

}


function invoiceNumber(){

const d=new Date();

return "INV-"+
d.getFullYear()+
String(d.getMonth()+1).padStart(2,"0")+
String(d.getDate()).padStart(2,"0")+
"-"+
String(d.getHours()).padStart(2,"0")+
String(d.getMinutes()).padStart(2,"0")+
String(d.getSeconds()).padStart(2,"0");

}


function message(text,type){

const box=$("message");

box.textContent=text;

box.className="message "+type;

setTimeout(()=>box.className="message",3500);

}


function addItem(){

if(itemCount>=25){

message(
"حداکثر ۲۵ ردیف مجاز است.",
"error"
);

return;

}

itemCount++;

const id=itemCount;

const div=document.createElement("div");

div.className="item";

div.dataset.id=id;

div.innerHTML=

'<div class="item-head">'+

'<span class="item-number">'+
"ردیف "+
new Intl.NumberFormat("fa-IR").format(id)+
"</span>"+

'<button class="remove" type="button">×</button>'+

'</div>'+

'<div class="item-grid">'+

'<input class="product" placeholder="نام محصول">'+

'<input class="quantity" type="number" min="1" value="1" placeholder="تعداد">'+

'<input class="price" type="number" min="0" value="0" placeholder="قیمت واحد">'+

'</div>'+

'<div style="margin-top:9px;font-size:12px;font-weight:800;color:#475569">'+

"مبلغ ردیف: "+

'<span class="rowTotal">۰ تومان</span>'+

"</div>";

$("items").appendChild(div);

div.querySelector(".remove").onclick=()=>{

div.remove();

calculate();

};

div.querySelector(".quantity").oninput=calculate;

div.querySelector(".price").oninput=calculate;

}


function calculate(){

let subtotal=0;

document.querySelectorAll(".item").forEach(item=>{

const q=
Number(
item.querySelector(".quantity").value
)||0;

const p=
Number(
item.querySelector(".price").value
)||0;

const t=q*p;

subtotal+=t;

item.querySelector(".rowTotal")
.textContent=money(t);

});


const percent=
Math.min(
100,
Math.max(
0,
Number($("discountPercent").value)||0
)
);

const fixed=
Math.max(
0,
Number($("discountFixed").value)||0
);


const discount=
Math.min(
subtotal,
subtotal*percent/100+fixed
);

const total=
Math.max(
0,
subtotal-discount
);


$("subtotal").textContent=
money(subtotal);

$("discount").textContent=
money(discount);

$("total").textContent=
money(total);


return{
subtotal,
discount,
total
};

}


function invoiceText(){

const c=
$("customer").value.trim();

const calc=calculate();

let text=
"🧾 فاکتور هوشمند مشتری‌یار\n"+
"━━━━━━━━━━━━━━\n";

text+=
"شماره فاکتور: "+
$("invoiceNumber").value+
"\n";

text+=
"تاریخ: "+
$("invoiceDate").value+
"\n";

if(c){

text+=
"مشتری: "+
c+
"\n";

}

text+=
"\n📦 محصولات:\n";

let i=0;

document
.querySelectorAll(".item")
.forEach(item=>{

const name=
item.querySelector(".product")
.value.trim();

const q=
Number(
item.querySelector(".quantity").value
)||0;

const p=
Number(
item.querySelector(".price").value
)||0;


if(name||p){

i++;

text+=
i+
". "+
(name||"محصول")+
" | تعداد: "+
q+
" | قیمت: "+
money(p)+
" | جمع: "+
money(q*p)+
"\n";

}

});


text+=
"\n━━━━━━━━━━━━━━\n"+
"جمع کالاها: "+
money(calc.subtotal)+
"\n"+
"تخفیف: "+
money(calc.discount)+
"\n"+
"مبلغ نهایی: "+
money(calc.total)+
"\n\n"+
"مشتری‌یار";


return text;

}


$("addItem").onclick=addItem;

$("discountPercent").oninput=calculate;

$("discountFixed").oninput=calculate;


$("copyBtn").onclick=async()=>{

try{

await navigator.clipboard.writeText(
invoiceText()
);

message(
"فاکتور کپی شد.",
"success"
);

}catch(e){

message(
"کپی در این مرورگر انجام نشد.",
"error"
);

}

};


$("shareBtn").onclick=async()=>{

const text=invoiceText();

if(navigator.share){

try{

await navigator.share({

title:"فاکتور مشتری‌یار",

text

});

}catch(e){}

}else{

try{

await navigator.clipboard.writeText(text);

message(
"متن فاکتور کپی شد.",
"info"
);

}catch(e){

message(
"اشتراک‌گذاری پشتیبانی نمی‌شود.",
"error"
);

}

}

};


$("saveBtn").onclick=()=>{

const key=
"moshtriyar_invoices";

let list=[];

try{

list=
JSON.parse(
localStorage.getItem(key)||"[]"
);

if(!Array.isArray(list))
list=[];

}catch(e){

list=[];

}


list.unshift({

invoice_number:
$("invoiceNumber").value,

invoice_date:
$("invoiceDate").value,

customer:
$("customer").value,

text:
invoiceText(),

created_at:
new Date().toISOString()

});


localStorage.setItem(
key,
JSON.stringify(
list.slice(0,100)
)
);


message(
"فاکتور در گوشی ذخیره شد.",
"success"
);

};


$("clearBtn").onclick=()=>{

if(
!confirm(
"فاکتور فعلی پاک شود؟"
)
)return;


$("customer").value="";

$("discountPercent").value=0;

$("discountFixed").value=0;

$("items").innerHTML="";

itemCount=0;

$("invoiceNumber").value=
invoiceNumber();

$("invoiceDate").value=
todayShamsi();

addItem();

message(
"فاکتور جدید آماده شد.",
"success"
);

};


$("invoiceNumber").value=
invoiceNumber();

$("invoiceDate").value=
todayShamsi();

addItem();

calculate();

</script>

</body>
  </html>
