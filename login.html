<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورود | مشتری‌یار</title><style>body{font-family:Tahoma;background:#f1f5f9}.box{max-width:460px;margin:7vh auto;background:#fff;padding:28px;border-radius:20px}input{width:100%;padding:13px;margin:7px 0 14px;border:1px solid #cbd5e1;border-radius:10px;box-sizing:border-box}.btn{width:100%;padding:13px;border:0;border-radius:10px;background:#0f172a;color:#fff;font-weight:bold}.switch{margin-top:15px;text-align:center;color:#2563eb;cursor:pointer}.msg{margin:12px 0}</style></head><body><main class="box"><h1>🚀 مشتری‌یار</h1><p id="mode">ورود به حساب</p><div id="msg"></div><label>ایمیل</label><input id="email" type="email"><label>رمز عبور</label><input id="password" type="password" minlength="6"><div id="nw" style="display:none"><label>نام</label><input id="name"></div><button class="btn" id="submit">ورود</button><div class="switch" id="switch">حساب ندارید؟ ثبت‌نام کنید</div><p><a href="/">بازگشت</a></p></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const c=await fetch('/api/config').then(r=>r.json()),s=createClient(c.url,c.key),$=x=>document.getElementById(x),q=new URLSearchParams(location.search);let signup=false;$('switch').onclick=()=>{signup=!signup;$('nw').style.display=signup?'block':'none';$('submit').textContent=signup?'ثبت‌نام':'ورود';$('mode').textContent=signup?'ساخت حساب':'ورود به حساب'};$('submit').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value,name=$('name').value.trim();if(!email||password.length<6)return $('msg').textContent='ایمیل و رمز عبور حداقل ۶ کاراکتر لازم است.';const r=signup?await s.auth.signUp({email,password,options:{data:{full_name:name}}}):await s.auth.signInWithPassword({email,password});if(r.error)return $('msg').textContent=r.error.message;if(signup&&!r.data.session)return $('msg').textContent='ثبت‌نام شد؛ ایمیل را در صورت نیاز تأیید کنید.';location.href='/dashboard.html'+(q.get('plan')?'?plan='+q.get('plan'):'')}</script></body></html>
