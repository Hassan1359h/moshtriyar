<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2563eb">
    <title>ورود / ثبت‌نام | مشتری‌یار</title>
    <link rel="canonical" href="https://moshtriyar.ir/login.html">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link rel="icon" href="icon-192.png">
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onloadTurnstileCallback" async defer></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Vazirmatn, Tahoma, sans-serif;
            background: linear-gradient(135deg, #eff6ff 0%, #f5f3ff 100%);
            color: #0f172a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            line-height: 1.7;
        }

        .box {
            background: #fff;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(59, 130, 246, 0.15);
            width: 100%;
            max-width: 420px;
            padding: 40px 32px;
            position: relative;
        }

        .logo-wrap {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .logo-wrap svg { width: 64px; height: 64px; }

        h1 {
            font-size: 24px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 6px;
            color: #1e293b;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .tabs {
            display: flex;
            background: #f1f5f9;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 24px;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            color: #64748b;
            transition: all 0.2s;
            border: none;
            background: transparent;
            font-family: inherit;
        }

        .tab.active {
            background: #fff;
            color: #2563eb;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .field { margin-bottom: 16px; }

        .field label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 6px;
        }

        .field input,
        .field select {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            font-family: inherit;
            background: #f8fafc;
            transition: border-color 0.2s;
        }

        .field input {
            direction: ltr;
            text-align: right;
        }

        .field select {
            direction: rtl;
            text-align: right;
            color: #334155;
        }

        .field input:focus,
        .field select:focus {
            outline: none;
            border-color: #3b82f6;
            background: #fff;
        }

        .agreement-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .check-row {
            display: flex;
            align-items: flex-start;
            gap: 9px;
            font-size: 12px;
            color: #475569;
            line-height: 1.9;
            cursor: pointer;
        }

        .check-row input {
            margin-top: 6px;
            flex-shrink: 0;
            width: 16px;
            height: 16px;
            accent-color: #2563eb;
        }

        .btn-main {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            font-family: inherit;
            margin-top: 8px;
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3);
            transition: transform 0.2s;
        }

        .btn-main:hover { transform: translateY(-1px); }

        .btn-main:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            margin-top: 16px;
            min-height: 20px;
            color: #64748b;
        }

        .message.success { color: #16a34a; }
        .message.error { color: #dc2626; }
        .message.info { color: #2563eb; }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #64748b;
            text-decoration: none;
            font-size: 13px;
        }

        .back-link:hover { color: #2563eb; }

        .plan-badge {
            display: none;
            background: #dbeafe;
            color: #1e40af;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 13px;
            text-align: center;
            margin-bottom: 16px;
            font-weight: 600;
        }

        .plan-badge.show { display: block; }

        .captcha-container {
            display: flex;
            justify-content: center;
            margin-bottom: 16px;
        }

        @media (max-width: 480px) {
            .box { padding: 30px 22px; }
            h1 { font-size: 20px; }
        }
    </style>
</head>

<body>
    <div class="box">
        <div class="logo-wrap">
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#3b82f6"/>
                        <stop offset="100%" stop-color="#8b5cf6"/>
                    </linearGradient>
                </defs>
                <rect width="100" height="100" rx="22" fill="url(#lg)"/>
                <circle cx="50" cy="42" r="11" fill="#fff"/>
                <path d="M 32 78 Q 32 58 50 58 Q 68 58 68 78 Z" fill="#fff"/>
                <path d="M 50 15 L 53 24 L 62 24 L 55 30 L 58 39 L 50 33 L 42 39 L 45 30 L 38 24 L 47 24 Z" fill="#fbbf24"/>
                <circle cx="50" cy="68" r="6" fill="#2563eb"/>
                <path d="M 46 68 L 49 71 L 54 66" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>

        <h1>مشتری‌یار</h1>
        <p class="subtitle">به دستیار هوشمند مدیریت مشتریان خوش آمدید</p>

        <div class="plan-badge" id="planBadge"></div>

        <div class="tabs">
            <button class="tab active" id="tabLogin" type="button">ورود</button>
            <button class="tab" id="tabSignup" type="button">ثبت‌نام</button>
        </div>

        <form id="authForm">
            <div class="field" id="nameField" style="display:none;">
                <label for="fullName">نام و نام خانوادگی</label>
                <input type="text" id="fullName" placeholder="مثلاً: حسن نادریان">

                <label for="storeName" style="margin-top:14px;">نام فروشگاه یا کسب‌وکار</label>
                <input type="text" id="storeName" placeholder="مثلاً: فروشگاه بهار" maxlength="100">

                <label for="phone" style="margin-top:14px;">شماره تماس همراه</label>
                <input
                    type="tel"
                    id="phone"
                    placeholder="09123456789"
                    inputmode="numeric"
                    maxlength="11"
                    autocomplete="tel"
                >

                <label for="businessType" style="margin-top:14px;">نوع کسب‌وکار</label>
                <select id="businessType">
                    <option value="">انتخاب نوع کسب‌وکار</option>
                </select>

                <div class="agreement-box" style="margin-top:16px;">
                    <label class="check-row">
                        <input type="checkbox" id="termsAccepted">
                        <span>قوانین و مقررات عمومی استفاده از سامانه مشتری‌یار را مطالعه کرده‌ام و می‌پذیرم.</span>
                    </label>
                </div>

                <div class="agreement-box">
                    <label class="check-row">
                        <input type="checkbox" id="smsTermsAccepted">
                        <span>تعهدنامه استفاده از پنل پیامکی و مسئولیت محتوای پیامک‌های ارسالی را مطالعه کرده‌ام و می‌پذیرم.</span>
                    </label>
                </div>
            </div>

            <div class="field">
                <label for="email">ایمیل</label>
                <input type="email" id="email" required placeholder="example@email.com">
            </div>

            <div class="field">
                <label for="password">رمز عبور</label>
                <input type="password" id="password" required placeholder="حداقل ۶ کاراکتر" minlength="6">
            </div>

            <div class="captcha-container">
                <div id="turnstile-widget"></div>
            </div>

            <button type="submit" class="btn-main" id="submitBtn">ورود</button>
            <p class="message" id="message"></p>

            <p style="text-align:left; margin-top:-8px; margin-bottom:16px;">
                <a href="#" id="forgotLink" style="color:#2563eb; font-size:13px; font-weight:600;">فراموشی رمز؟</a>
            </p>
        </form>

        <a href="index.html" class="back-link">← بازگشت به صفحه اصلی</a>
    </div>

    <script type="module">
        import { supabase } from './js/supabase.js';
        import { BUSINESS_TYPES } from './js/labels.js';

        const tabLogin = document.getElementById('tabLogin');
        const tabSignup = document.getElementById('tabSignup');
        const nameField = document.getElementById('nameField');
        const fullNameInput = document.getElementById('fullName');
        const storeNameInput = document.getElementById('storeName');
        const phoneInput = document.getElementById('phone');
        const businessTypeInput = document.getElementById('businessType');
        const termsAcceptedInput = document.getElementById('termsAccepted');
        const smsTermsAcceptedInput = document.getElementById('smsTermsAccepted');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const submitBtn = document.getElementById('submitBtn');
        const message = document.getElementById('message');
        const authForm = document.getElementById('authForm');
        const planBadge = document.getElementById('planBadge');

        // ساخت فهرست انواع کسب‌وکار از فایل labels.js
        BUSINESS_TYPES.forEach((business) => {
            const option = document.createElement('option');
            option.value = business.value;
            option.textContent = business.label;
            businessTypeInput.appendChild(option);
        });

        const urlParams = new URLSearchParams(window.location.search);

        const allowedPlans = {
            pro: 'پلن حرفه‌ای',
            business: 'پلن کسب‌وکار',
            vip_yearly: 'اشتراک ویژه یک‌ساله'
        };

        const selectedPlan = urlParams.get('plan');
        const validSelectedPlan = Object.prototype.hasOwnProperty.call(
            allowedPlans,
            selectedPlan
        ) ? selectedPlan : null;

        if (validSelectedPlan) {
            planBadge.textContent =
                '🎯 پلن انتخابی شما: ' + allowedPlans[validSelectedPlan];
            planBadge.classList.add('show');
        }

        function getAfterLoginUrl() {
            return validSelectedPlan
                ? 'index.html?plan=' + encodeURIComponent(validSelectedPlan)
                : 'dashboard.html';
        }

        let mode = 'login';

        function setMode(newMode) {
            mode = newMode;
            const isSignup = mode === 'signup';

            tabLogin.classList.toggle('active', !isSignup);
            tabSignup.classList.toggle('active', isSignup);

            nameField.style.display = isSignup ? 'block' : 'none';

            fullNameInput.required = isSignup;
            phoneInput.required = isSignup;
            businessTypeInput.required = isSignup;
            termsAcceptedInput.required = isSignup;
            smsTermsAcceptedInput.required = isSignup;

            submitBtn.textContent = isSignup ? 'ثبت‌نام' : 'ورود';
            document.title = isSignup ? 'ثبت‌نام | مشتری‌یار' : 'ورود | مشتری‌یار';

            message.textContent = '';
            message.className = 'message';
        }

        tabLogin.addEventListener('click', () => setMode('login'));
        tabSignup.addEventListener('click', () => setMode('signup'));

        // حالت اولیه؛ فیلدهای ثبت‌نام در صفحه ورود اجباری نیستند.
        setMode('login');

        Promise.race([
            supabase.auth.getSession(),
            new Promise((_, reject) =>
                setTimeout(() => reject(new Error('Session timeout')), 5000)
            )
        ]).then(({ data }) => {
            if (data?.session) {
                window.location.href = getAfterLoginUrl();
            }
        }).catch((error) => {
            console.warn('Session check skipped:', error);
        });

        function showMessage(text, type = 'info') {
            message.textContent = text;
            message.className = 'message ' + type;
        }

        // تبدیل اعداد فارسی و عربی به انگلیسی
        function normalizePhone(value) {
            return value
                .replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
                .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
                .replace(/[\s-]/g, '');
        }

        // اعتبارسنجی شماره موبایل ایران
        function validatePhone(phone) {
            if (!/^09[0-9]{9}$/.test(phone)) {
                return false;
            }

            // رد شماره‌هایی که تمام ارقامشان یکسان است
            if (/^([0-9])\1{10}$/.test(phone)) {
                return false;
            }

            // رد شماره‌هایی مانند 09111111111 و 09222222222
            if (/^09([0-9])\1{8}$/.test(phone)) {
                return false;
            }

            return true;
        }

        // بارگذاری کپچا با روش callback خودکار نسخه فعلی
        let loginCaptchaWidgetId = null;

        window.onloadTurnstileCallback = function () {
            if (!window.turnstile || loginCaptchaWidgetId !== null) return;

            const container = document.getElementById('turnstile-widget');
            if (!container) return;

            loginCaptchaWidgetId = window.turnstile.render(container, {
                sitekey: '0x4AAAAAAFFcLOx_YxUy2aw8',

                callback: function (token) {
                    console.log('Captcha verified');
                    submitBtn.disabled = false;
                },

                'expired-callback': function () {
                    submitBtn.disabled = true;
                }
            });
        };

        // اگر اسکریپت قبل از اجرای ماژول بارگذاری شده باشد
        if (window.turnstile) {
            window.onloadTurnstileCallback();
        }

        document.getElementById('forgotLink').addEventListener('click', async (e) => {
            e.preventDefault();

            const email = prompt('ایمیل خود را وارد کنید تا لینک بازیابی ارسال شود:');
            if (!email) return;

            const captchaToken = getCaptchaToken();

            if (!captchaToken) {
                alert('❌ لطفاً ابتدا کپچا را تایید کنید.');
                return;
            }

            const { error } = await supabase.auth.resetPasswordForEmail(email, {
                redirectTo: window.location.origin +
                    window.location.pathname.replace('login.html', 'reset-password.html'),
                captchaToken: captchaToken
            });

            if (error) {
                alert('❌ خطا: ' + error.message);

                if (window.turnstile && loginCaptchaWidgetId !== null) {
                    window.turnstile.reset(loginCaptchaWidgetId);
                }
            } else {
                alert('✅ لینک بازیابی به ایمیل شما ارسال شد.');
            }
        });

        function getCaptchaToken() {
            return document.querySelector('[name="cf-turnstile-response"]')?.value || '';
        }

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const fullName = fullNameInput.value.trim();
            const storeName = storeNameInput.value.trim();
            const phone = normalizePhone(phoneInput.value.trim());
            const businessType = businessTypeInput.value;

            submitBtn.disabled = true;
            showMessage('در حال پردازش...', 'info');

            try {
                const captchaToken = getCaptchaToken();

                if (!captchaToken) {
                    throw new Error('لطفاً کپچا را تایید کنید.');
                }

                if (mode === 'login') {
                    const supabaseStart = performance.now();

                    const { error } = await supabase.auth.signInWithPassword({
                        email,
                        password,
                        options: { captchaToken: captchaToken }
                    });

                    const supabaseTime = (
                        (performance.now() - supabaseStart) / 1000
                    ).toFixed(2);

                    if (new URLSearchParams(window.location.search).get('debug') === '1') {
                        alert('زمان پاسخ درخواست ورود Supabase: ' + supabaseTime + ' ثانیه');
                    }

                    if (error) throw error;

                    showMessage('ورود موفق! در حال انتقال...', 'success');

                    setTimeout(() => {
                        window.location.href = getAfterLoginUrl();
                    }, 800);

                } else {
                    if (!fullName) {
                        throw new Error('لطفاً نام و نام خانوادگی را وارد کنید.');
                    }

                    if (!phone) {
                        throw new Error('لطفاً شماره تماس همراه را وارد کنید.');
                    }

                    if (!validatePhone(phone)) {
                        throw new Error(
                            'شماره تماس باید ۱۱ رقم و با 09 شروع شود. شماره‌های تکراری یا غیرمعتبر پذیرفته نیستند.'
                        );
                    }

                    if (!businessType) {
                        throw new Error('لطفاً نوع کسب‌وکار را انتخاب کنید.');
                    }

                    if (!termsAcceptedInput.checked) {
                        throw new Error('برای ثبت‌نام باید قوانین عمومی را بپذیرید.');
                    }

                    if (!smsTermsAcceptedInput.checked) {
                        throw new Error('برای ثبت‌نام باید تعهدنامه پنل پیامکی را بپذیرید.');
                    }

                    const { error } = await supabase.auth.signUp({
                        email,
                        password,
                        options: {
                            data: {
                                full_name: fullName,
                                store_name: storeName,
                                phone: phone,
                                business_type: businessType,
                                terms_accepted: true,
                                terms_version: '2026-11-07-v1',
                                sms_terms_accepted: true
                            },
                            captchaToken: captchaToken
                        }
                    });

                    if (error) {
                        if (
                            error.message === 'Email not confirmed' ||
                            error.code === 'email_not_confirmed'
                        ) {
                            throw new Error(
                                'ایمیل شما هنوز تأیید نشده است. لطفاً ایمیل خود را بررسی کنید و روی لینک تأیید حساب کاربری کلیک کنید. پوشه Spam را نیز بررسی کنید.'
                            );
                        }

                        throw error;
                    }

                    // ارسال ایمیل خوش‌آمدگویی
                    try {
                        await fetch('/api/send-email', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                to: email,
                                type: 'welcome',
                                data: { name: fullName }
                            })
                        });

                        console.log('Welcome email sent');
                    } catch (emailErr) {
                        console.warn('Welcome email failed:', emailErr);
                    }

                    // اطلاع‌رسانی ثبت‌نام به مدیر
                    try {
                        await fetch('/api/send-email', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                to: 'hahass12na@gmail.com',
                                type: 'admin_new_user',
                                data: {
                                    name: fullName,
                                    email: email,
                                    time: new Date().toLocaleString('fa-IR')
                                }
                            })
                        });

                        console.log('Admin notified about new user');
                    } catch (adminErr) {
                        console.warn('Admin notification failed:', adminErr);
                    }

                    showMessage('✅ ثبت‌نام موفق! حالا ایمیل خود را بررسی و سپس وارد شوید.', 'success');

                    setTimeout(() => setMode('login'), 2500);
                }

            } catch (err) {
                let errorMsg = err.message || 'خطای نامشخص';

                if (
    errorMsg.includes('Email not confirmed') ||
    errorMsg.includes('email_not_confirmed')
) {
    errorMsg =
        'ایمیل شما هنوز تأیید نشده است. لطفاً صندوق ورودی ایمیل خود را بررسی کنید و روی لینک تأیید حساب کاربری کلیک کنید. پوشه Spam را نیز بررسی کنید.';

} else if (errorMsg.includes('Invalid login credentials')) {
    errorMsg = 'ایمیل یا رمز عبور اشتباه است.';

} else if (errorMsg.includes('User already registered')) {
    errorMsg = 'این ایمیل قبلاً ثبت‌نام کرده است.';

} else if (errorMsg.includes('Password should be at least')) {
    errorMsg = 'رمز عبور باید حداقل ۶ کاراکتر باشد.';

} else if (errorMsg.includes('Unable to validate email')) {
    errorMsg = 'ایمیل وارد شده معتبر نیست.';

} else if (errorMsg.toLowerCase().includes('captcha')) {
    errorMsg = 'کپچا تایید نشد. لطفاً دوباره تلاش کنید.';
}

                showMessage('❌ ' + errorMsg, 'error');

                if (window.turnstile && loginCaptchaWidgetId !== null) {
                    setTimeout(() => {
                        try {
                            window.turnstile.reset(loginCaptchaWidgetId);
                        } catch (resetError) {
                            console.warn('Turnstile reset failed:', resetError);
                        }
                    }, 3000);
                }

            } finally {
                submitBtn.disabled = !getCaptchaToken();

                const checkCaptcha = setInterval(() => {
                    if (getCaptchaToken()) {
                        submitBtn.disabled = false;
                        clearInterval(checkCaptcha);
                    }
                }, 500);

                setTimeout(() => {
                    clearInterval(checkCaptcha);
                    submitBtn.disabled = !getCaptchaToken();
                }, 10000);
            }
        });
    </script>
</body>
</html>
