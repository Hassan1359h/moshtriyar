<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل اپراتور | مشتری‌یار</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:#0f172a;color:#fff;min-height:100vh;padding:20px}
.container{max-width:600px;margin:auto}
.header{background:#1e293b;padding:20px;border-radius:16px;text-align:center;margin-bottom:20px}
.header h1{font-size:20px;margin-bottom:8px}
.header .status{font-size:13px;opacity:.8}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-left:6px;animation:pulse 1.5s infinite}
.dot.online{background:#10b981}
.dot.offline{background:#ef4444;animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.call-card{background:linear-gradient(135deg,#10b981,#059669);border-radius:20px;padding:30px;text-align:center;margin-bottom:20px;animation:ring 1s infinite}
@keyframes ring{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
.call-card h2{font-size:22px;margin-bottom:10px}
.call-card .visitor{font-size:14px;opacity:.9;margin-bottom:20px}
.call-card .actions{display:flex;gap:10px;justify-content:center;margin-top:20px}
.btn{padding:14px 28px;border:none;border-radius:50px;font-family:inherit;font-weight:800;font-size:15px;cursor:pointer;display:flex;align-items:center;gap:8px}
.btn-accept{background:#fff;color:#059669}
.btn-reject{background:#ef4444;color:#fff}
.btn-end{background:#ef4444;color:#fff;width:60px;height:60px;border-radius:50%;font-size:24px;justify-content:center;padding:0}
.active-call{background:linear-gradient(135deg,#059669,#047857);border-radius:20px;padding:30px;text-align:center;margin-bottom:20px}
.active-call h2{font-size:20px;margin-bottom:10px}
.timer{font-size:36px;font-weight:900;margin:15px 0;font-family:monospace}
.empty{text-align:center;padding:60px 20px;color:#94a3b8}
.empty .icon{font-size:64px;margin-bottom:20px;opacity:.3}
.log{background:#1e293b;border-radius:12px;padding:15px;margin-top:20px}
.log h3{font-size:13px;color:#94a3b8;margin-bottom:10px}
.log-item{padding:8px 0;border-bottom:1px solid #334155;font-size:12px}
.log-item:last-child{border-bottom:none}
#remoteAudio{display:none}
</style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>📞 پنل اپراتور مشتری‌یار</h1>
        <div class="status">
            <span class="dot" id="statusDot"></span>
            <span id="statusText">در حال اتصال...</span>
        </div>
    </div>

    <div id="app">
        <div class="empty">
            <div class="icon">🎧</div>
            <div>منتظر تماس ورودی هستم</div>
            <div style="font-size:12px;margin-top:10px;opacity:.7;">
                این صفحه رو باز نگه دار تا تماس‌ها رو دریافت کنی
            </div>
        </div>
    </div>

    <div class="log" id="logBox" style="display:none;">
        <h3>📋 لاگ تماس‌ها</h3>
        <div id="logList"></div>
    </div>
</div>

<audio id="remoteAudio" autoplay></audio>

<script type="module">
import { supabase } from './js/supabase.js';

let currentUser = null;
let currentCall = null;
let pc = null;
let channel = null;
let callStartTime = null;
let timerInterval = null;
let pendingIceCandidates = [];
let hasRemoteDescription = false;

const ringtone = new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmwhBSuBzvLZiTYIG2m98OScTgwOUarm7blmGgU7k9n1unEiBC13yO/eizEIHWq+8+OWT');
ringtone.loop = true;

async function init() {
    const { data } = await supabase.auth.getSession();
    if (!data?.session) {
        location.href = '/login.html';
        return;
    }

    currentUser = data.session.user;
    console.log('Operator:', currentUser.email);

    channel = supabase.channel(`calls-${currentUser.id}`, {
        config: { broadcast: { self: false } }
    });

    channel
        .on('broadcast', { event: 'call-request' }, handleIncomingCall)
        .on('broadcast', { event: 'webrtc-ice-visitor' }, handleRemoteIce)
        .on('broadcast', { event: 'call-ended' }, handleCallEnded)
        .subscribe((status) => {
            if (status === 'SUBSCRIBED') {
                setStatus(true);
                console.log('متصل به کانال تماس');
            }
        });
}

function setStatus(online) {
    const dot = document.getElementById('statusDot');
    const text = document.getElementById('statusText');
    if (online) {
        dot.className = 'dot online';
        text.textContent = 'آنلاین — آماده دریافت تماس';
    } else {
        dot.className = 'dot offline';
        text.textContent = 'آفلاین';
    }
}

function handleIncomingCall({ payload }) {
    if (currentCall) {
        channel.send({
            type: 'broadcast',
            event: 'call-rejected',
            payload: { sessionId: payload.sessionId, reason: 'busy' }
        });
        return;
    }

    console.log('تماس ورودی:', payload);
    currentCall = payload;

    ringtone.play().catch(e => console.log('Ringtone blocked:', e));

    document.getElementById('app').innerHTML = `
        <div class="call-card">
            <div style="font-size:60px;">📞</div>
            <h2>تماس ورودی</h2>
            <div class="visitor">
                ${escapeHtml(payload.visitorName || 'کاربر سایت')}
                <br>
                <small style="opacity:.7;">${escapeHtml(payload.siteUrl || '')}</small>
            </div>
            <div class="actions">
                <button class="btn btn-reject" onclick="rejectCall()">❌ رد</button>
                <button class="btn btn-accept" onclick="acceptCall()">✅ پاسخ</button>
            </div>
        </div>
    `;

    addLog(`📞 تماس از ${payload.visitorName || 'کاربر ناشناس'}`);
}

window.acceptCall = async function() {
    if (!currentCall) return;

    ringtone.pause();
    ringtone.currentTime = 0;

    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

        pc = new RTCPeerConnection({
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        });

        stream.getTracks().forEach(track => pc.addTrack(track, stream));

        pc.ontrack = (event) => {
            const audio = document.getElementById('remoteAudio');
            audio.srcObject = event.streams[0];
            console.log('صدای کاربر دریافت شد');
        };

        pc.onicecandidate = (event) => {
            if (event.candidate) {
                channel.send({
                    type: 'broadcast',
                    event: 'webrtc-ice-operator',
                    payload: {
                        sessionId: currentCall.sessionId,
                        candidate: event.candidate
                    }
                });
            }
        };

        await pc.setRemoteDescription(new RTCSessionDescription(currentCall.offer));

        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);

        channel.send({
            type: 'broadcast',
            event: 'webrtc-answer',
            payload: {
                sessionId: currentCall.sessionId,
                answer: pc.localDescription
            }
        });

        for (const candidate of pendingIceCandidates) {
            await pc.addIceCandidate(new RTCIceCandidate(candidate));
        }
        pendingIceCandidates = [];
        hasRemoteDescription = true;

        callStartTime = Date.now();
        showActiveCall();

        try {
            await supabase.from('calls').update({
                status: 'active',
                accepted_at: new Date().toISOString()
            }).eq('session_id', currentCall.sessionId);
        } catch (err) {}

        addLog(`✅ تماس از ${currentCall.visitorName || 'کاربر'} پاسخ داده شد`);

    } catch (err) {
        console.error('Accept error:', err);
        alert('خطا در برقراری تماس: ' + err.message);
        rejectCall();
    }
};

window.rejectCall = function() {
    if (!currentCall) return;

    ringtone.pause();
    ringtone.currentTime = 0;

    channel.send({
        type: 'broadcast',
        event: 'call-rejected',
        payload: { sessionId: currentCall.sessionId }
    });

    addLog(`❌ تماس از ${currentCall.visitorName || 'کاربر'} رد شد`);
    resetCall();
};

function showActiveCall() {
    document.getElementById('app').innerHTML = `
        <div class="active-call">
            <div style="font-size:50px;">🎙️</div>
            <h2>تماس در جریان</h2>
            <div class="visitor">${escapeHtml(currentCall.visitorName || 'کاربر سایت')}</div>
            <div class="timer" id="callTimer">00:00</div>
            <button class="btn btn-end" onclick="endCall()" style="margin:auto;">📵</button>
        </div>
    `;

    timerInterval = setInterval(() => {
        const elapsed = Math.floor((Date.now() - callStartTime) / 1000);
        const mins = String(Math.floor(elapsed / 60)).padStart(2, '0');
        const secs = String(elapsed % 60).padStart(2, '0');
        const timerEl = document.getElementById('callTimer');
        if (timerEl) timerEl.textContent = `${mins}:${secs}`;
    }, 1000);
}

window.endCall = function() {
    channel.send({
        type: 'broadcast',
        event: 'call-ended',
        payload: { sessionId: currentCall?.sessionId }
    });

    if (currentCall && callStartTime) {
        const duration = Math.floor((Date.now() - callStartTime) / 1000);
        supabase.from('calls').update({
            status: 'ended',
            ended_at: new Date().toISOString(),
            duration_seconds: duration
        }).eq('session_id', currentCall.sessionId).then(() => {});
    }

    addLog('📵 تماس قطع شد');
    resetCall();
};

function resetCall() {
    if (timerInterval) clearInterval(timerInterval);
    if (pc) { pc.close(); pc = null; }

    currentCall = null;
    callStartTime = null;
    pendingIceCandidates = [];
    hasRemoteDescription = false;

    document.getElementById('app').innerHTML = `
        <div class="empty">
            <div class="icon">🎧</div>
            <div>منتظر تماس ورودی هستم</div>
        </div>
    `;
}

function handleRemoteIce({ payload }) {
    if (!pc || !currentCall || payload.sessionId !== currentCall.sessionId) return;

    if (hasRemoteDescription) {
        pc.addIceCandidate(new RTCIceCandidate(payload.candidate)).catch(e => {});
    } else {
        pendingIceCandidates.push(payload.candidate);
    }
}

function handleCallEnded({ payload }) {
    if (currentCall && payload.sessionId === currentCall.sessionId) {
        addLog('📵 کاربر تماس رو قطع کرد');
        resetCall();
    }
}

function addLog(text) {
    const logBox = document.getElementById('logBox');
    const logList = document.getElementById('logList');
    logBox.style.display = 'block';

    const time = new Date().toLocaleTimeString('fa-IR');
    const div = document.createElement('div');
    div.className = 'log-item';
    div.innerHTML = `<span style="color:#94a3b8;">${time}</span> — ${text}`;
    logList.prepend(div);

    while (logList.children.length > 10) {
        logList.removeChild(logList.lastChild);
    }
}

function escapeHtml(str) {
    return String(str || '').replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[m]);
}

init();

window.addEventListener('beforeunload', () => {
    if (currentCall) {
        channel.send({
            type: 'broadcast',
            event: 'call-ended',
            payload: { sessionId: currentCall.sessionId }
        });
    }
});
</script>

</body>
</html>
