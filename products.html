<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محصولات | مشتری‌یار</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
<style>
body{font-family:Vazirmatn,sans-serif;background:#f1f5f9;margin:0;padding:20px;padding-bottom:90px;direction:rtl}
.header{background:#fff;border-radius:14px;padding:14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.header h1{margin:0;font-size:17px}
.btn-add{background:#2563eb;color:#fff;border:none;padding:10px 16px;border-radius:10px;font-weight:800;cursor:pointer;font-family:inherit}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
.card{background:#fff;border-radius:14px;padding:14px;cursor:pointer}
.card img{width:100%;height:160px;object-fit:cover;border-radius:10px;margin-bottom:8px}
.card .no-img{width:100%;height:120px;background:#f1f5f9;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:40px;margin-bottom:8px}
.card h3{margin:0 0 6px;font-size:15px}
.card .price{color:#2563eb;font-weight:900}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;padding:20px;overflow-y:auto}
.modal.show{display:block}
.modal-box{background:#fff;border-radius:16px;padding:20px;max-width:400px;margin:auto}
.modal-box h2{margin:0 0 16px;font-size:17px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:#475569}
.field input,.field textarea{width:100%;padding:10px;border:2px solid #e2e8f0;border-radius:10px;font-family:inherit;box-sizing:border-box}
.preview{width:100%;height:120px;background:#f1f5f9;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-bottom:14px;font-size:13px;color:#94a3b8;overflow:hidden}
.preview img{width:100%;height:100%;object-fit:cover}
.btns{display:flex;gap:8px;margin-top:14px}
.btn-save{flex:1;padding:12px;background:#2563eb;color:#fff;border:none;border-radius:10px;font-weight:800;cursor:pointer;font-family:inherit}
.btn-cancel{flex:1;padding:12px;background:#e2e8f0;border:none;border-radius:10px;font-weight:800;cursor:pointer;font-family:inherit}
.loading{text-align:center;padding:40px;color:#64748b}
</style>
</head>
<body>

<div class="header">
    <h1>📦 محصولات</h1>
    <button class="btn-add" onclick="openAdd()">+ افزودن</button>
</div>

<div class="grid" id="grid">
    <div class="loading">در حال بارگذاری...</div>
</div>

<div class="modal" id="modal">
    <div class="modal-box">
        <h2 id="modalTitle">افزودن محصول</h2>
        <input type="hidden" id="productId">
        
        <div class="preview" id="preview" onclick="document.getElementById('fileInput').click()">
            <span id="previewText">📸 برای انتخاب عکس کلیک کن</span>
        </div>
        <input type="file" id="fileInput" accept="image/*" style="display:none">
        
        <div class="field">
            <label>نام محصول *</label>
            <input type="text" id="name" placeholder="مثلاً: گتر کوهنوردی">
        </div>
        
        <div class="field">
            <label>قیمت (تومان)</label>
            <input type="number" id="price" placeholder="150000">
        </div>
        
        <div class="field">
            <label>توضیحات</label>
            <textarea id="description" placeholder="توضیح مختصر..."></textarea>
        </div>
        
        <div class="btns">
            <button class="btn-cancel" onclick="closeModal()">انصراف</button>
            <button class="btn-save" id="saveBtn" onclick="saveProduct()">ذخیره</button>
        </div>
    </div>
</div>

<script type="module">
import { supabase } from './js/supabase.js';

let products = [];
let me = null;
let imageUrl = '';

const { data: { session } } = await supabase.auth.getSession();
if (!session) { window.location.href = 'login.html'; }
me = session.user;

window.openAdd = function() {
    document.getElementById('modalTitle').textContent = 'افزودن محصول';
    document.getElementById('productId').value = '';
    document.getElementById('name').value = '';
    document.getElementById('price').value = '';
    document.getElementById('description').value = '';
    document.getElementById('preview').innerHTML = '<span id="previewText">📸 برای انتخاب عکس کلیک کن</span>';
    imageUrl = '';
    document.getElementById('modal').classList.add('show');
};

window.closeModal = function() {
    document.getElementById('modal').classList.remove('show');
};

document.getElementById('fileInput').onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = (ev) => {
        document.getElementById('preview').innerHTML = '<img src="' + ev.target.result + '">';
    };
    reader.readAsDataURL(file);
    
    try {
        const ext = file.name.split('.').pop();
        const fileName = me.id + '-' + Date.now() + '.' + ext;
        const { error } = await supabase.storage.from('product-images').upload(fileName, file);
        if (error) throw error;
        const { data } = supabase.storage.from('product-images').getPublicUrl(fileName);
        imageUrl = data.publicUrl;
    } catch (err) {
        alert('خطا در آپلود عکس: ' + err.message);
    }
};

window.saveProduct = async function() {
    const name = document.getElementById('name').value.trim();
    if (!name) { alert('نام محصول رو وارد کن'); return; }
    
    const btn = document.getElementById('saveBtn');
    btn.disabled = true;
    btn.textContent = 'در حال ذخیره...';
    
    const payload = {
        user_id: me.id,
        name: name,
        price: parseInt(document.getElementById('price').value) || 0,
        description: document.getElementById('description').value.trim() || null,
        image_url: imageUrl || null
    };
    
    try {
        const id = document.getElementById('productId').value;
        let res;
        if (id) {
            res = await supabase.from('products').update(payload).eq('id', id);
        } else {
            res = await supabase.from('products').insert(payload);
        }
        if (res.error) throw res.error;
        
        closeModal();
        await loadProducts();
    } catch (err) {
        alert('خطا: ' + err.message);
    } finally {
        btn.disabled = false;
        btn.textContent = 'ذخیره';
    }
};

async function loadProducts() {
    const { data, error } = await supabase.from('products').select('*').eq('user_id', me.id).order('created_at', { ascending: false });
    
    if (error) {
        document.getElementById('grid').innerHTML = '<div class="loading">خطا: ' + error.message + '</div>';
        return;
    }
    
    products = data || [];
    render();
}

function render() {
    const grid = document.getElementById('grid');
    if (!products.length) {
        grid.innerHTML = '<div class="loading">هنوز محصولی نداری</div>';
        return;
    }
    
    grid.innerHTML = '';
    products.forEach(p => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = 
            (p.image_url ? '<img src="' + p.image_url + '">' : '<div class="no-img">📦</div>') +
            '<h3>' + p.name + '</h3>' +
            '<div class="price">' + (parseInt(p.price) || 0).toLocaleString('fa-IR') + ' تومان</div>';
        card.onclick = () => {
            document.getElementById('modalTitle').textContent = 'ویرایش محصول';
            document.getElementById('productId').value = p.id;
            document.getElementById('name').value = p.name || '';
            document.getElementById('price').value = p.price || '';
            document.getElementById('description').value = p.description || '';
            imageUrl = p.image_url || '';
            if (p.image_url) {
                document.getElementById('preview').innerHTML = '<img src="' + p.image_url + '">';
            } else {
                document.getElementById('preview').innerHTML = '<span>📸 برای انتخاب عکس کلیک کن</span>';
            }
            document.getElementById('modal').classList.add('show');
        };
        grid.appendChild(card);
    });
}

loadProducts();
</script>
</body>
  </html>
