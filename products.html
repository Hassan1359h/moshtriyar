<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2563eb">
<title>محصولات | مشتری‌یار</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
<link rel="icon" href="icon-192.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:#f8fafc;color:#0f172a;line-height:1.7;padding-bottom:90px}
.header{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.05);padding:12px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.header h1{font-size:17px;font-weight:800}
.btn-logout{background:#fee2e2;color:#dc2626;border:none;padding:8px 14px;border-radius:10px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer}
.container{max-width:900px;margin:0 auto;padding:20px}
.top-bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.search{flex:1;min-width:200px;padding:12px;border:2px solid #e2e8f0;border-radius:12px;font-family:inherit;font-size:14px;background:#fff}
.btn-add{background:#2563eb;color:#fff;border:none;padding:12px 20px;border-radius:12px;font-family:inherit;font-weight:800;font-size:14px;cursor:pointer;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.product{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.04);cursor:pointer;transition:transform .1s}
.product:hover{transform:translateY(-2px)}
.product-img{width:100%;height:160px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;font-size:40px;color:#cbd5e1;overflow:hidden}
.product-img img{width:100%;height:100%;object-fit:cover}
.product-body{padding:12px}
.product-name{font-weight:800;font-size:14px;margin-bottom:4px}
.product-price{color:#2563eb;font-weight:900;font-size:15px}
.product-cat{font-size:11px;color:#94a3b8;margin-top:4px}
.empty{text-align:center;padding:60px 20px;color:#94a3b8;background:#fff;border-radius:14px;grid-column:1/-1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:20px;z-index:200;overflow-y:auto}
.modal.open{display:flex}
.modal-box{background:#fff;border-radius:18px;max-width:420px;width:100%;padding:24px;max-height:90vh;overflow-y:auto;margin:auto}
.modal-box h2{font-size:18px;font-weight:800;margin-bottom:16px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:700;color:#475569;margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;padding:11px;border:2px solid #e2e8f0;border-radius:10px;font-family:inherit;font-size:14px;background:#f8fafc;color:#0f172a}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:#3b82f6;background:#fff}
.field textarea{min-height:70px;resize:vertical}
.image-upload{border:2px dashed #cbd5e1;border-radius:12px;padding:20px;text-align:center;cursor:pointer;background:#f8fafc;position:relative}
.image-upload img{max-width:100%;max-height:180px;border-radius:10px}
.image-upload .placeholder{color:#94a3b8;font-size:13px}
.image-upload input{display:none}
.modal-btns{display:flex;gap:10px;margin-top:16px}
.btn-save{flex:1;padding:12px;background:#2563eb;color:#fff;border:none;border-radius:10px;font-family:inherit;font-weight:800;font-size:14px;cursor:pointer}
.btn-cancel{flex:1;padding:12px;background:#e2e8f0;color:#0f172a;border:none;border-radius:10px;font-family:inherit;font-weight:800;font-size:14px;cursor:pointer}
.btn-danger{width:100%;padding:12px;background:#fee2e2;color:#dc2626;border:none;border-radius:10px;font-family:inherit;font-weight:800;font-size:14px;cursor:pointer;margin-top:10px}
.loading{text-align:center;padding:60px;color:#64748b;grid-column:1/-1}
.hidden{display:none!important}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<header class="header">
    <h1>📦 محصولات</h1>
    <button class="btn-logout" id="logoutBtn">خروج</button>
</header>

<div class="container">
    <div class="top-bar">
        <input type="text" class="search" id="search" placeholder="🔍 جستجوی محصول...">
        <button class="btn-add" id="addBtn">+ افزودن محصول</button>
    </div>

    <div id="grid" class="grid">
        <div class="loading">در حال بارگذاری...</div>
    </div>
</div>

<!-- مودال -->
<div class="modal" id="modal">
    <div class="modal-box">
        <h2 id="modalTitle">افزودن محصول</h2>
        <form id="productForm">
            <input type="hidden" id="productId">

            <div class="field">
                <label>📸 عکس محصول</label>
                <div class="image-upload" id="imageUpload">
                    <div class="placeholder" id="imagePlaceholder">برای انتخاب عکس کلیک کن</div>
                    <img id="imagePreview" class="hidden">
                    <input type="file" id="imageInput" accept="image/*">
                </div>
            </div>

            <div class="field">
                <label>نام محصول *</label>
                <input type="text" id="name" required placeholder="مثلاً: گتر کوهنوردی">
            </div>

            <div class="field">
                <label>💰 قیمت (تومان)</label>
                <input type="number" id="price" placeholder="1500000" style="direction:ltr;text-align:right;">
            </div>

            <div class="field">
                <label>📂 دسته‌بندی</label>
                <input type="text" id="category" placeholder="مثلاً: پوشاک، تجهیزات">
            </div>

            <div class="field">
                <label>📝 توضیحات</label>
                <textarea id="description" placeholder="توضیح مختصر..."></textarea>
            </div>

            <div class="modal-btns">
                <button type="button" class="btn-cancel" id="cancelBtn">انصراف</button>
                <button type="submit" class="btn-save" id="saveBtn">ذخیره</button>
            </div>
            <button type="button" class="btn-danger hidden" id="deleteBtn">🗑️ حذف محصول</button>
        </form>
    </div>
</div>

<script type="module">
import { supabase } from './js/supabase.js';

const $ = id => document.getElementById(id);
let products = [];
let me = null;
let uploadedImageUrl = '';

const { data: { session } } = await supabase.auth.getSession();
if (!session) { window.location.href = 'login.html'; return; }
me = session.user;

// انتخاب عکس
$('imageUpload').onclick = () => $('imageInput').click();

$('imageInput').onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    // نمایش پیش‌نمایش
    const reader = new FileReader();
    reader.onload = (ev) => {
        $('imagePreview').src = ev.target.result;
        $('imagePreview').classList.remove('hidden');
        $('imagePlaceholder').classList.add('hidden');
    };
    reader.readAsDataURL(file);

    // آپلود به Supabase Storage
    try {
        $('imagePlaceholder').textContent = 'در حال آپلود...';
        const fileExt = file.name.split('.').pop();
        const fileName = `${me.id}-${Date.now()}.${fileExt}`;

        const { error } = await supabase.storage
            .from('product-images')
            .upload(fileName, file);

        if (error) throw error;

        const { data: urlData } = supabase.storage
            .from('product-images')
            .getPublicUrl(fileName);

        uploadedImageUrl = urlData.publicUrl;
        $('imagePlaceholder').classList.add('hidden');

    } catch (err) {
        alert('❌ خطا در آپلود: ' + err.message);
        $('imagePlaceholder').textContent = 'دوباره امتحان کن';
    }
};

async function loadProducts() {
    const { data, error } = await supabase
        .from('products')
        .select('*')
        .eq('user_id', me.id)
        .order('created_at', { ascending: false });

    if (error) {
        $('grid').innerHTML = '<div class="empty">⚠️ ' + error.message + '</div>';
        return;
    }

    products = data || [];
    render();
}

function render() {
    const q = $('search').value.trim().toLowerCase();
    const grid = $('grid');

    if (!products.length) {
        grid.innerHTML = '<div class="empty">📦 هنوز محصولی اضافه نکردی<br><small>روی «+ افزودن محصول» بزن</small></div>';
        return;
    }

    const filtered = q
        ? products.filter(p =>
            p.name.toLowerCase().includes(q) ||
            (p.category && p.category.toLowerCase().includes(q)))
        : products;

    if (!filtered.length) {
        grid.innerHTML = '<div class="empty">🔍 نتیجه‌ای پیدا نشد</div>';
        return;
    }

    grid.innerHTML = '';
    filtered.forEach(p => {
        const div = document.createElement('div');
        div.className = 'product';
        div.innerHTML = `
            <div class="product-img">
                ${p.image_url ? `<img src="${p.image_url}" alt="${p.name}">` : '📦'}
            </div>
            <div class="product-body">
                <div class="product-name">${p.name}</div>
                <div class="product-price">${(parseInt(p.price) || 0).toLocaleString('fa-IR')} تومان</div>
                ${p.category ? `<div class="product-cat">📂 ${p.category}</div>` : ''}
            </div>
        `;
        div.onclick = () => openEdit(p);
        grid.appendChild(div);
    });
}

function openAdd() {
    $('modalTitle').textContent = 'افزودن محصول';
    $('productForm').reset();
    $('productId').value = '';
    $('deleteBtn').classList.add('hidden');
    uploadedImageUrl = '';
    $('imagePreview').classList.add('hidden');
    $('imagePlaceholder').classList.remove('hidden');
    $('imagePlaceholder').textContent = 'برای انتخاب عکس کلیک کن';
    $('modal').classList.add('open');
}

function openEdit(p) {
    $('modalTitle').textContent = 'ویرایش محصول';
    $('productId').value = p.id;
    $('name').value = p.name || '';
    $('price').value = p.price || '';
    $('category').value = p.category || '';
    $('description').value = p.description || '';
    uploadedImageUrl = p.image_url || '';

    if (p.image_url) {
        $('imagePreview').src = p.image_url;
        $('imagePreview').classList.remove('hidden');
        $('imagePlaceholder').classList.add('hidden');
    } else {
        $('imagePreview').classList.add('hidden');
        $('imagePlaceholder').classList.remove('hidden');
        $('imagePlaceholder').textContent = 'برای انتخاب عکس کلیک کن';
    }

    $('deleteBtn').classList.remove('hidden');
    $('modal').classList.add('open');
}

$('addBtn').onclick = openAdd;
$('cancelBtn').onclick = () => $('modal').classList.remove('open');
$('search').oninput = render;

$('productForm').onsubmit = async (e) => {
    e.preventDefault();
    const btn = $('saveBtn');
    btn.disabled = true;
    btn.textContent = 'در حال ذخیره...';

    const id = $('productId').value;
    const payload = {
        user_id: me.id,
        name: $('name').value.trim(),
        price: parseInt($('price').value) || 0,
        category: $('category').value.trim() || null,
        description: $('description').value.trim() || null,
        image_url: uploadedImageUrl || null
    };

    try {
        if (id) {
            const { error } = await supabase.from('products').update(payload).eq('id', id);
            if (error) throw error;
        } else {
            const { error } = await supabase.from('products').insert(payload);
            if (error) throw error;
        }
        $('modal').classList.remove('open');
        await loadProducts();
    } catch (err) {
        alert('❌ ' + err.message);
    } finally {
        btn.disabled = false;
        btn.textContent = 'ذخیره';
    }
};

$('deleteBtn').onclick = async () => {
    const id = $('productId').value;
    if (!id) return;
    if (!confirm('از حذف این محصول مطمئنید؟')) return;

    const { error } = await supabase.from('products').delete().eq('id', id);
    if (error) { alert('❌ ' + error.message); return; }
    $('modal').classList.remove('open');
    await loadProducts();
};

$('logoutBtn').onclick = async () => {
    await supabase.auth.signOut();
    window.location.href = 'index.html';
};

loadProducts();
</script>
</body>
  </html>
