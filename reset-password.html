<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تعیین رمز جدید | مشتری‌یار</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
    <link rel="icon" href="icon-192.png">
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:Vazirmatn,Tahoma,sans-serif;background:linear-gradient(135deg,#eff6ff,#f5f3ff);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
        .box{background:#fff;border-radius:24px;box-shadow:0 20px 60px rgba(59,130,246,.15);max-width:420px;width:100%;padding:40px 32px;text-align:center}
        h1{font-size:22px;font-weight:800;margin-bottom:8px;color:#1e293b}
        p.sub{color:#64748b;font-size:14px;margin-bottom:24px}
        input{width:100%;padding:12px 14px;border:2px solid #e2e8f0;border-radius:12px;font-family:inherit;font-size:15px;margin-bottom:14px;direction:ltr;text-align:right}
        input:focus{outline:none;border-color:#3b82f6}
        button{width:100%;padding:14px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff;border:none;border-radius:12px;font-family:inherit;font-weight:800;font-size:16px;cursor:pointer}
        button:disabled{opacity:.6}
        .msg{margin-top:14px;font-size:14px;font-weight:700;min-height:20px}
        .success{color:#16a34a}.error{color:#dc2626}
    </style>
</head>
<body>
    <div class="box">
        <h1>🔐 تعیین رمز جدید</h1>
        <p class="sub">رمز عبور جدید خود را وارد کنید.</p>
        <form id="resetForm">
            <input type="password" id="password" placeholder="رمز جدید (حداقل ۶ کاراکتر)" required minlength="6">
            <button type="submit" id="submitBtn">ذخیره رمز جدید</button>
        </form>
        <p class="msg" id="msg"></p>
    </div>

    <script type="module">
        import { supabase } from './js/supabase.js';

        const form = document.getElementById('resetForm');
        const msg = document.getElementById('msg');
        const passwordInput = document.getElementById('password');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = passwordInput.value;
            submitBtn.disabled = true;
            msg.textContent = 'در حال ذخیره...';
            msg.className = 'msg';

            const { error } = await supabase.auth.updateUser({ password });

            if (error) {
                msg.textContent = '❌ ' + error.message;
                msg.className = 'msg error';
                submitBtn.disabled = false;
            } else {
                msg.textContent = '✅ رمز با موفقیت تغییر کرد! در حال انتقال...';
                msg.className = 'msg success';
                setTimeout(() => { window.location.href = 'login.html'; }, 2000);
            }
        });
    </script>
</body>
</html>
