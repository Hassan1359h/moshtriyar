<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل پیامک | مشتری‌یار</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
<style>
    :root { --primary: #4f46e5; --bg: #f8fafc; --card: #ffffff; --text-main: #1e293b; --text-muted: #64748b; --danger: #ef4444; --success: #10b981; }
    *{box-sizing:border-box;margin:0;padding:0;font-family:'Vazirmatn', sans-serif;}
    body{background:var(--bg);color:var(--text-main);line-height:1.7;padding-bottom:80px;}
    .header{background:var(--card);padding:16px 20px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 4px 20px rgba(0,0,0,.03);}
    .header a{text-decoration:none;color:var(--text-muted);font-weight:700;font-size:14px;}
    .container{max-width:650px;margin:20px auto;padding:0 16px;}
    .dashboard-stats {display: grid;grid-template-columns: 1fr 1fr;gap: 12px;margin-bottom: 24px;}
    .stat-box {border-radius: 20px;padding: 16px;display: flex;align-items: center;gap: 12px;transition: transform 0.2s ease;}
    .credit-box {background: linear-gradient(135deg, var(--primary), #8b5cf6);color: white;box-shadow: 0 10px 20px rgba(79,70,229,0.2);}
    .buy-box {background: var(--card);color: var(--text-main);border: 2px solid #e2e8f0;box-shadow: 0 4px 15px rgba(0,0,0,0.03);cursor: pointer;}
    .stat-icon {font-size: 22px;width: 46px;height: 46px;display: flex;align-items: center;justify-content: center;border-radius: 14px;}
    .credit-box .stat-icon {background: rgba(255,255,255,0.2);}
    .buy-box .stat-icon {background: #eff6ff;color: var(--primary);}
    .stat-info {display: flex;flex-direction: column;}
    .stat-label {font-size: 12px;opacity: 0.8;margin-bottom: 2px;font-weight: 700;}
    .credit-box .stat-value {font-size: 22px;font-weight: 900;}
    .buy-box .stat-action {font-size: 14px;font-weight: 900;color: var(--primary);}
    .form-group{margin-bottom:16px;}
    label{display:block;font-weight:800;margin-bottom:8px;font-size:13px;}
    select, input[type="text"], textarea {width:100%;padding:14px;border:1px solid #e2e8f0;border-radius:12px;font-family:inherit;font-size:14px;background:var(--card);}
    .customer-list {background: var(--card);border-radius: 16px;padding: 8px;border: 1px solid #f1f5f9;max-height: 250px;overflow-y: auto;display: none;}
    .customer-item {display: flex;align-items: center;gap: 12px;padding: 12px;border-bottom: 1px solid #f1f5f9;}
    .customer-item input {width: 20px;height: 20px;accent-color: var(--primary);}
    .btn-send {position: fixed;bottom: 20px;left: 20px;right: 20px;max-width: 618px;margin: 0 auto;padding: 18px;background: var(--primary);color: #fff;border: none;border-radius: 16px;font-family: inherit;font-weight: 800;font-size: 16px;cursor: pointer;z-index: 90;box-shadow: 0 10px 25px rgba(79,70,229,0.3);}
    .log-item {background:var(--card);border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin-bottom:8px;font-size:12px;}
    .log-header {display:flex;justify-content:space-between;font-weight:800;margin-bottom:6px;color:var(--primary);}
    .modal-overlay {position: fixed;top: 0;left: 0;right: 0;bottom: 0;background: rgba(15, 23, 42, 0.6);backdrop-filter: blur(4px);display: none;justify-content: center;align-items: center;z-index: 9999;padding: 20px;overflow-y: auto;}
    .modal-content {background: var(--card);border-radius: 24px;padding: 24px;max-width: 450px;width: 100%;margin: auto;}
    .bank-card-box {background: linear-gradient(135deg, #0f172a, #334155);color: white;border-radius: 16px;padding: 20px;margin-bottom: 20px;direction: ltr;}
    .chip {width: 40px;height: 30px;background: linear-gradient(135deg, #fcd34d, #f59e0b);border-radius: 6px;margin-bottom: 16px;}
    .bank-card-number {font-size: 20px;font-weight: 700;letter-spacing: 2px;margin-bottom: 12px;font-family: 'Courier New', monospace;}
    .copy-btn {background: rgba(255,255,255,0.15);color: white;border: 1px solid rgba(255,255,255,0.3);padding: 6px 12px;border-radius: 6px;font-family: inherit;font-size: 11px;cursor: pointer;}
    .sms-packages-grid{display:grid;grid-template-columns:repeat(2, 1fr);gap:10px;margin-bottom:16px;}
    .sms-pack-card{border:2px solid #e2e8f0;border-radius:12px;padding:12px;text-align:center;cursor:pointer;}
    .sms-pack-card.selected {border-color:var(--primary); background:#f5f3ff;}
    .sms-pack-count{font-size:18px;font-weight:900;}
    .modal-btns{display:flex;gap:10px;margin-top:16px;}
    .btn-cancel{flex:1;padding:12px;background:#f1f5f9;border:none;border-radius:12px;font-family:inherit;font-weight:800;}
    .btn-submit{flex:2;padding:12px;background:var(--primary);color:#fff;border:none;border-radius:12px;font-family:inherit;font-weight:800;}
</style>
</head>
<body>
<div class="header"><a href="dashboard.html">← بازگشت</a><div style="font-weight:800;">پنل پیامک هوشمند</div><div style="width:20px;"></div></div>

<div class="container">
    <div class="dashboard-stats">
        <div class="stat-box credit-box">
            <div class="stat-icon">💼</div>
            <div class="stat-info">
                <span class="stat-label">اعتبار مانده</span>
                <span class="stat-value" id="quotaDisplay">...</span>
            </div>
        </div>
        <div class="stat-box buy-box" onclick="openBuyModal()">
            <div class="stat-icon">💳</div>
            <div class="stat-info">
                <span class="stat-label">خرید پیامک</span>
                <span class="stat-action">افزایش اعتبار +</span>
            </div>
        </div>
    </div>

    <div class="form-group">
        <label>انتخاب سر خط ارسال:</label>
        <select id="senderLine">
            <option value="98500039586936605">98500039586936605</option>
        </select>
    </div>

    <div class="form-group">
        <label>ارسال به:</label>
        <select id="recipientType" onchange="handleRecipientTypeChange()">
            <option value="single">تکی (انتخاب از لیست)</option>
            <option value="all">همه مشتریان</option>
            <option value="debtors">بدهکاران</option>
        </select>
    </div>

    <div class="customer-list" id="customerList"></div>

    <div class="form-group" style="margin-top:16px;">
        <label>متن پیامک:</label>
        <textarea id="messageText" rows="4" placeholder="متن خود را بنویسید..." oninput="updateCharCount()"></textarea>
        <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-muted);margin-top:8px;">
            <span id="charCount">۰ کاراکتر</span>
            <span id="smsCountDisplay">۰ پیامک</span>
        </div>
    </div>

    <div class="section-title" style="margin-top:24px;font-weight:800;font-size:15px;">📋 گزارش ارسال‌ها</div>
    <div id="smsLogsList"><p style="color:var(--text-muted);font-size:13px;">در حال دریافت...</p></div>
</div>

<button class="btn-send" id="sendBtn" onclick="sendBulkSms()">🚀 ارسال پیامک</button>

<div class="modal-overlay" id="buyModal">
    <div class="modal-content">
        <h3 style="text-align:center;margin-bottom:16px;">خرید اعتبار پیامک</h3>
        <div class="bank-card-box">
            <div class="chip"></div>
            <div style="font-size:12px;opacity:0.7;margin-bottom:6px;text-align:right;direction:rtl;">شماره کارت جهت واریز</div>
            <div class="bank-card-number" id="cardNumberText">6037 9977 1234 5678</div>
            <button class="copy-btn" onclick="copyCardNumber()">📋 کپی شماره کارت</button>
        </div>
        <label style="text-align:center; display:block; margin-bottom:10px;">پکیج مورد نظر را انتخاب کنید:</label>
        <div class="sms-packages-grid">
            <div class="sms-pack-card" onclick="selectPack(this, 'sms500', '۵۰۰ پیامک', 150000)"><div class="sms-pack-count">۵۰۰</div><div style="font-size:12px;color:var(--primary);font-weight:700;">۱۵۰,۰۰۰ تومان</div></div>
            <div class="sms-pack-card" onclick="selectPack(this, 'sms1000', '۱۰۰۰ پیامک', 300000)"><div class="sms-pack-count">۱۰۰۰</div><div style="font-size:12px;color:var(--primary);font-weight:700;">۳۰۰,۰۰۰ تومان</div></div>
            <div class="sms-pack-card" onclick="selectPack(this, 'sms1500', '۱۵۰۰ پیامک', 450000)"><div class="sms-pack-count">۱۵۰۰</div><div style="font-size:12px;color:var(--primary);font-weight:700;">۴۵۰,۰۰۰ تومان</div></div>
            <div class="sms-pack-card" onclick="selectPack(this, 'sms2000', '۲۰۰۰ پیامک', 600000)"><div class="sms-pack-count">۲۰۰۰</div><div style="font-size:12px;color:var(--primary);font-weight:700;">۶۰۰,۰۰۰ تومان</div></div>
        </div>
        <div class="modal-btns">
            <button class="btn-cancel" onclick="document.getElementById('buyModal').style.display='none'">انصراف</button>
            <button class="btn-submit" id="nextToPayBtn" onclick="goToPaymentStep()" disabled>ادامه و ثبت پرداخت</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="paymentModal">
    <div class="modal-content">
        <h3 id="modalTitle" style="text-align:center;margin-bottom:16px;">ثبت اطلاعات پرداخت</h3>
        <p id="modalDesc" style="font-size:14px; color:var(--primary); font-weight:800; margin-bottom:16px; text-align:center;"></p>
        <div class="form-group">
            <label>شماره پیگیری / ۴ رقم آخر کارت:</label>
            <input type="text" id="trackingCode" placeholder="مثلاً 1234" style="direction:ltr; text-align:left;">
        </div>
        <div class="modal-btns">
            <button class="btn-cancel" onclick="document.getElementById('paymentModal').style.display='none'">انصراف</button>
            <button class="btn-submit" id="submitPayBtn" onclick="submitManualPayment()">ثبت نهایی</button>
        </div>
        <div id="paymentMsg" style="text-align:center; font-size:12px; font-weight:700; margin-top:12px;"></div>
    </div>
</div>

<script type="module">
import { supabase } from './js/supabase.js'; 
const $ = id => document.getElementById(id);
let currentUserId = null;
let userSmsLimit = 0; let userSmsUsed = 0;
let allCustomers = []; let selectedMobiles = new Set();
let selectedPackage = {};
let isAdmin = false;

async function init() {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) { window.location.href = 'login.html'; return; }
    currentUserId = session.user.id;

    // 🌟 خواندن و رمزگشایی متن از آدرس (Base64)
    const urlParams = new URLSearchParams(window.location.search);
    const encodedText = urlParams.get('text');
    
    if (encodedText) {
        try {
            const decodedText = decodeURIComponent(escape(atob(encodedText)));
            $('messageText').value = decodedText;
            updateCharCount();
        } catch (e) {
            console.error("خطا در خواندن متن:", e);
        }
    }

    const { data: profile } = await supabase.from('profiles').select('sms_limit, sms_used, plan').eq('id', currentUserId).maybeSingle();
    
    if (profile?.plan === 'admin') {
        isAdmin = true;
        $('quotaDisplay').textContent = 'نامحدود ♾️';
        $('sendBtn').disabled = false;
    } else {
        userSmsLimit = profile?.sms_limit || 0; userSmsUsed = profile?.sms_used || 0;
        updateQuotaUI();
    }

    await loadCustomers();
    loadLogs();
}

function updateQuotaUI() {
    if(isAdmin) return;
    const remaining = userSmsLimit - userSmsUsed;
    if (remaining <= 0) {
        $('quotaDisplay').textContent = '۰';
        $('sendBtn').disabled = true; 
        $('sendBtn').textContent = '❌ اعتبار کافی نیست (خرید کنید)';
    } else {
        $('quotaDisplay').textContent = remaining.toLocaleString('fa-IR');
        $('sendBtn').disabled = false; 
        $('sendBtn').textContent = '🚀 ارسال پیامک';
    }
}

window.openBuyModal = function() {
    $('buyModal').style.display = 'flex';
    document.querySelectorAll('.sms-pack-card').forEach(el => el.classList.remove('selected'));
    selectedPackage = {};
    $('nextToPayBtn').disabled = true;
}
window.selectPack = function(element, type, name, price) {
    document.querySelectorAll('.sms-pack-card').forEach(el => el.classList.remove('selected'));
    element.classList.add('selected');
    selectedPackage = { type, name, price };
    $('nextToPayBtn').disabled = false;
}
window.copyCardNumber = function() {
    navigator.clipboard.writeText($('cardNumberText').innerText.replace(/\s/g, '')).then(() => alert('✅ کپی شد!'));
}
window.goToPaymentStep = function() {
    if(!selectedPackage.type) return;
    $('buyModal').style.display = 'none';
    $('modalDesc').textContent = `خرید: ${selectedPackage.name} - مبلغ: ${selectedPackage.price.toLocaleString('fa-IR')} تومان`;
    $('trackingCode').value = ''; $('paymentMsg').textContent = '';
    $('paymentModal').style.display = 'flex';
}
window.submitManualPayment = async function() {
    const trackingCode = $('trackingCode').value.trim();
    if (!trackingCode) return alert('شماره پیگیری الزامی است.');
    
    const btn = $('submitPayBtn'); btn.disabled = true; btn.textContent = 'در حال ثبت...';
    try {
        const { error } = await supabase.from('payments').insert({ user_id: currentUserId, plan: selectedPackage.type, amount: selectedPackage.price, tracking_code: trackingCode, status: 'pending' });
        if (error) throw error;
        $('paymentMsg').textContent = '✅ پرداخت ثبت شد. در انتظار تایید مدیر.';
        $('paymentMsg').style.color = '#16a34a';
        setTimeout(() => { $('paymentModal').style.display = 'none'; }, 2000);
    } catch (error) {
        $('paymentMsg').textContent = `❌ ${error?.message}`; $('paymentMsg').style.color = '#dc2626';
    } finally { btn.disabled = false; btn.textContent = 'ثبت نهایی'; }
}

async function loadCustomers() {
    const { data } = await supabase.from('customers').select('id, name, phone, status, total_purchase').eq('user_id', currentUserId);
    allCustomers = data || [];
    renderCustomerList(allCustomers);
}
function renderCustomerList(customers) {
    const listDiv = $('customerList'); listDiv.innerHTML = '';
    customers.forEach(c => {
        if(!c.phone) return;
        const isChecked = selectedMobiles.has(c.phone) ? 'checked' : '';
        listDiv.innerHTML += `<label class="customer-item"><input type="checkbox" value="${c.phone}" ${isChecked} onchange="toggleCustomer(this)"><span style="flex:1;">${c.name} <small style="color:var(--text-muted);">(${c.phone})</small></span></label>`;
    });
}
window.toggleCustomer = function(cb) {
    if(cb.checked) selectedMobiles.add(cb.value); else selectedMobiles.delete(cb.value);
}
window.handleRecipientTypeChange = function() {
    const type = $('recipientType').value; selectedMobiles.clear();
    if (type === 'single') { $('customerList').style.display = 'block'; renderCustomerList(allCustomers); }
    else if (type === 'all') { $('customerList').style.display = 'none'; allCustomers.forEach(c => { if(c.phone) selectedMobiles.add(c.phone); }); }
    else if (type === 'debtors') { $('customerList').style.display = 'none'; allCustomers.filter(c => c.status === 'debtor' || c.total_purchase < 0).forEach(c => { if(c.phone) selectedMobiles.add(c.phone); }); }
}
window.updateCharCount = function() {
    const len = $('messageText').value.length;
    $('charCount').textContent = len.toLocaleString('fa-IR') + ' کاراکتر';
    $('smsCountDisplay').textContent = (len === 0 ? 0 : Math.ceil(len / 70)).toLocaleString('fa-IR') + ' پیامک';
}

window.sendBulkSms = async function() {
    const message = $('messageText').value.trim();
    const mobiles = Array.from(selectedMobiles);
    if (mobiles.length === 0) return alert('گیرنده‌ای انتخاب نشده است.');
    if (!message) return alert('متن پیامک خالی است.');

    
if (!isAdmin && mobiles.length > (userSmsLimit - userSmsUsed)) {
    return alert('اعتبار پیامک شما کافی نیست.');
}

// تأیید نهایی پیش از ارسال واقعی
const recipientLabel =
    $('recipientType').value === 'all'
        ? 'همه مشتریان'
        : $('recipientType').value === 'debtors'
            ? 'مشتریان بدهکار'
            : 'مشتریان انتخاب‌شده';

const estimatedParts = Math.ceil(message.length / 70);
const estimatedTotal = mobiles.length * estimatedParts;

const confirmed = window.confirm(
    `آیا ارسال این پیامک را تأیید می‌کنید؟\n\n` +
    `گروه گیرندگان: ${recipientLabel}\n` +
    `تعداد شماره‌ها: ${mobiles.length}\n` +
    `تعداد تقریبی بخش‌های هر پیام: ${estimatedParts}\n` +
    `مجموع تقریبی بخش‌های پیامک: ${estimatedTotal}\n\n` +
    `متن پیام:\n${message}\n\n` +
    `توجه: با تأیید، درخواست ارسال واقعی ثبت می‌شود.`
);

if (!confirmed) return;

const btn = $('sendBtn');

    try {
        const { data, error } = await supabase.functions.invoke('send-sms', {
            body: { mobiles, message, lineNumber: $('senderLine').value, recipientType: $('recipientType').value }
        });
        if (error) throw error;
        if (data && data.success && data.data.status === 1) {
            alert('✅ پیامک‌ها با موفقیت ارسال شدند!');
            $('messageText').value = ''; updateCharCount(); selectedMobiles.clear(); handleRecipientTypeChange();
            if(!isAdmin) { userSmsUsed += mobiles.length; updateQuotaUI(); }
            loadLogs();
        } else { throw new Error(data?.data?.message || 'خطا در ارسال'); }
    } catch (err) { alert(`❌ خطا: ${err.message}`); } 
    finally { btn.innerHTML = '🚀 ارسال پیامک'; if(isAdmin || userSmsLimit - userSmsUsed > 0) btn.disabled = false; }
}

async function loadLogs() {
    const { data } = await supabase.from('sms_logs').select('*').eq('user_id', currentUserId).order('created_at', { ascending: false }).limit(5);
    const list = $('smsLogsList');
    if (!data || !data.length) { list.innerHTML = '<p style="color:var(--text-muted);font-size:13px;">گزارشی یافت نشد.</p>'; return; }
    list.innerHTML = '';
    data.forEach(log => {
        list.innerHTML += `<div class="log-item"><div class="log-header"><span>${log.recipient_type === 'all' ? 'همه مشتریان' : log.recipient_type === 'debtors' ? 'بدهکاران' : 'تکی'}</span><span style="color:var(--success);">${log.status}</span></div><div style="color:var(--text-muted);margin-bottom:4px;">${new Date(log.created_at).toLocaleString('fa-IR')} | خط: ${log.line_number}</div><div>${log.message_text.substring(0, 30)}... (${log.recipient_count} نفر)</div></div>`;
    });
}

init();
</script>
</body>
</html>
