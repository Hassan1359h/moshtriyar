<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل پیامک | مشتری‌یار</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
<style>
    :root { --primary: #4f46e5; --bg: #f8fafc; --card: #ffffff; --text-main: #1e293b; --text-muted: #64748b; --danger: #ef4444; --success: #10b981; }
    *{box-sizing:border-box;margin:0;padding:0;font-family:'Vazirmatn', sans-serif;}
    body{background:var(--bg);color:var(--text-main);line-height:1.7;padding-bottom:80px;}
    .header{background:var(--card);padding:16px 20px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 4px 20px rgba(0,0,0,.03);}
    .header a{text-decoration:none;color:var(--text-muted);font-weight:700;font-size:14px;}
    .container{max-width:650px;margin:20px auto;padding:0 16px;}
    .quota-card {background: linear-gradient(135deg, var(--primary), #8b5cf6);color: white;border-radius: 20px;padding: 20px;margin-bottom: 20px;display: flex;justify-content: space-between;align-items: center;box-shadow: 0 10px 25px rgba(79,70,229,0.2);}
    .quota-value {font-size: 26px;font-weight: 900;}
    
    .form-group{margin-bottom:16px;}
    label{display:block;font-weight:800;margin-bottom:8px;font-size:13px;}
    select, input[type="text"], textarea {width:100%;padding:14px;border:1px solid #e2e8f0;border-radius:12px;font-family:inherit;font-size:14px;background:var(--card);}
    select:focus, textarea:focus {outline:none;border-color:var(--primary);}
    
    .customer-list {background: var(--card);border-radius: 16px;padding: 8px;border: 1px solid #f1f5f9;max-height: 250px;overflow-y: auto;display: none;}
    .customer-item {display: flex;align-items: center;gap: 12px;padding: 12px;border-bottom: 1px solid #f1f5f9;}
    .customer-item:last-child {border-bottom: none;}
    .customer-item input {width: 20px;height: 20px;accent-color: var(--primary);}
    
    .btn-send {position: fixed;bottom: 20px;left: 20px;right: 20px;max-width: 618px;margin: 0 auto;padding: 18px;background: var(--primary);color: #fff;border: none;border-radius: 16px;font-family: inherit;font-weight: 800;font-size: 16px;cursor: pointer;z-index: 90;box-shadow: 0 10px 25px rgba(79,70,229,0.3);}
    
    .log-item {background:var(--card);border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin-bottom:8px;font-size:12px;}
    .log-header {display:flex;justify-content:space-between;font-weight:800;margin-bottom:6px;color:var(--primary);}
</style>
</head>
<body>
<div class="header"><a href="dashboard.html">← بازگشت</a><div style="font-weight:800;">پنل پیامک هوشمند</div><div style="width:20px;"></div></div>

<div class="container">
    <div class="quota-card">
        <div><div style="font-size:13px;opacity:.9;">اعتبار پیامک</div><div class="quota-value" id="quotaDisplay">...</div></div>
        <div style="font-size:36px;opacity:.8;">✉️</div>
    </div>

    <!-- انتخاب خط ارسال -->
    <div class="form-group">
        <label>انتخاب سر خط ارسال:</label>
        <select id="senderLine">
            <option value="500039586936605">5000xxxx (خط اصلی)</option>
            <!-- خطوط بعدی را اینجا اضافه کنید -->
        </select>
    </div>

    <!-- نوع گیرندگان -->
    <div class="form-group">
        <label>ارسال به:</label>
        <select id="recipientType" onchange="handleRecipientTypeChange()">
            <option value="single">تکی (انتخاب از لیست)</option>
            <option value="all">همه مشتریان</option>
            <option value="debtors">بدهکاران</option>
        </select>
    </div>

    <!-- لیست مشتریان -->
    <div class="customer-list" id="customerList"></div>

    <!-- متن پیام -->
    <div class="form-group" style="margin-top:16px;">
        <label>متن پیامک:</label>
        <textarea id="messageText" rows="4" placeholder="متن خود را بنویسید..." oninput="updateCharCount()"></textarea>
        <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-muted);margin-top:8px;">
            <span id="charCount">۰ کاراکتر</span>
            <span id="smsCountDisplay">۰ پیامک</span>
        </div>
    </div>

    <!-- گزارش ارسال -->
    <div class="section-title" style="margin-top:24px;font-weight:800;font-size:15px;">📋 گزارش ارسال‌ها</div>
    <div id="smsLogsList"><p style="color:var(--text-muted);font-size:13px;">در حال دریافت...</p></div>

</div>

<button class="btn-send" id="sendBtn" onclick="sendBulkSms()">🚀 ارسال پیامک</button>

<script type="module">
import { supabase } from './js/supabase.js'; 
const $ = id => document.getElementById(id);
let currentUserId = null;
let userSmsLimit = 0; let userSmsUsed = 0;
let allCustomers = []; let selectedMobiles = new Set();

async function init() {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) { window.location.href = 'login.html'; return; }
    currentUserId = session.user.id;

    const { data: profile } = await supabase.from('profiles').select('sms_limit, sms_used').eq('id', currentUserId).maybeSingle();
    userSmsLimit = profile?.sms_limit || 0; userSmsUsed = profile?.sms_used || 0;
    updateQuotaUI();

    await loadCustomers();
    loadLogs();
}

function updateQuotaUI() {
    const remaining = userSmsLimit - userSmsUsed;
    $('quotaDisplay').textContent = remaining.toLocaleString('fa-IR') + ' عدد';
    if (remaining <= 0) {
        $('quotaDisplay').textContent = '۰ (ارتقا دهید)';
        $('sendBtn').disabled = true; $('sendBtn').textContent = '❌ اعتبار کافی نیست';
    }
}

async function loadCustomers() {
    const { data } = await supabase.from('customers').select('id, name, phone, status, total_purchase').eq('user_id', currentUserId);
    allCustomers = data || [];
    renderCustomerList(allCustomers);
}

function renderCustomerList(customers) {
    const listDiv = $('customerList');
    listDiv.innerHTML = '';
    customers.forEach(c => {
        if(!c.phone) return;
        const isChecked = selectedMobiles.has(c.phone) ? 'checked' : '';
        listDiv.innerHTML += `
            <label class="customer-item">
                <input type="checkbox" value="${c.phone}" ${isChecked} onchange="toggleCustomer(this)">
                <span style="flex:1;">${c.name} <small style="color:var(--text-muted);">(${c.phone})</small></span>
            </label>
        `;
    });
}

window.toggleCustomer = function(cb) {
    if(cb.checked) selectedMobiles.add(cb.value); else selectedMobiles.delete(cb.value);
}

window.handleRecipientTypeChange = function() {
    const type = $('recipientType').value;
    selectedMobiles.clear();
    
    if (type === 'single') {
        $('customerList').style.display = 'block';
        renderCustomerList(allCustomers);
    } else if (type === 'all') {
        $('customerList').style.display = 'none';
        allCustomers.forEach(c => { if(c.phone) selectedMobiles.add(c.phone); });
    } else if (type === 'debtors') {
        $('customerList').style.display = 'none';
        const debtors = allCustomers.filter(c => c.status === 'debtor' || c.total_purchase < 0);
        debtors.forEach(c => { if(c.phone) selectedMobiles.add(c.phone); });
    }
}

window.updateCharCount = function() {
    const len = $('messageText').value.length;
    $('charCount').textContent = len.toLocaleString('fa-IR') + ' کاراکتر';
    $('smsCountDisplay').textContent = (len === 0 ? 0 : Math.ceil(len / 70)).toLocaleString('fa-IR') + ' پیامک';
}

window.sendBulkSms = async function() {
    const message = $('messageText').value.trim();
    const mobiles = Array.from(selectedMobiles);
    const lineNumber = $('senderLine').value;
    const recipientType = $('recipientType').value;
    const btn = $('sendBtn');

    if (mobiles.length === 0) return alert('گیرنده‌ای انتخاب نشده است.');
    if (!message) return alert('متن پیامک خالی است.');

    btn.innerHTML = 'در حال ارسال...'; btn.disabled = true;

    try {
        const { data, error } = await supabase.functions.invoke('send-sms', {
            body: { mobiles, message, lineNumber, recipientType }
        });

        if (error) throw error;
        if (data && data.success && data.data.status === 1) {
            alert('✅ پیامک‌ها با موفقیت ارسال شدند!');
            $('messageText').value = ''; updateCharCount();
            selectedMobiles.clear(); handleRecipientTypeChange();
            userSmsUsed += mobiles.length; updateQuotaUI();
            loadLogs();
        } else {
            throw new Error(data?.data?.message || 'خطا در ارسال');
        }
    } catch (err) { alert(`❌ خطا: ${err.message}`); } 
    finally { btn.innerHTML = '🚀 ارسال پیامک'; if(userSmsLimit - userSmsUsed > 0) btn.disabled = false; }
}

async function loadLogs() {
    const { data } = await supabase.from('sms_logs').select('*').eq('user_id', currentUserId).order('created_at', { ascending: false }).limit(5);
    const list = $('smsLogsList');
    if (!data || !data.length) { list.innerHTML = '<p style="color:var(--text-muted);font-size:13px;">گزارشی یافت نشد.</p>'; return; }
    
    list.innerHTML = '';
    data.forEach(log => {
        list.innerHTML += `
            <div class="log-item">
                <div class="log-header">
                    <span>${log.recipient_type === 'all' ? 'همه مشتریان' : log.recipient_type === 'debtors' ? 'بدهکاران' : 'تکی'}</span>
                    <span style="color:var(--success);">${log.status}</span>
                </div>
                <div style="color:var(--text-muted);margin-bottom:4px;">${new Date(log.created_at).toLocaleString('fa-IR')} | خط: ${log.line_number}</div>
                <div>${log.message_text.substring(0, 30)}... (${log.recipient_count} نفر)</div>
            </div>
        `;
    });
}

init();
</script>
</body>
</html>
