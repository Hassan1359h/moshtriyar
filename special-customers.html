<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مشتریان ویژه | مشتری‌یار</title>

<link
    href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css"
    rel="stylesheet"
>

<link rel="icon" href="icon-192.png">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Vazirmatn,Tahoma,sans-serif;
    background:#f1f5f9;
    color:#0f172a;
    line-height:1.7;
    padding-bottom:40px;
}

.header{
    background:#1e293b;
    color:#fff;
    padding:14px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    position:sticky;
    top:0;
    z-index:100;
}

.header h1{
    font-size:16px;
    font-weight:800;
    margin-left:auto;
}

.header a{
    color:#fff;
    text-decoration:none;
    background:#334155;
    padding:8px 14px;
    border-radius:10px;
    font-size:13px;
    font-weight:700;
    white-space:nowrap;
}

.header a.blue{
    background:#2563eb;
}

.container{
    max-width:1000px;
    margin:0 auto;
    padding:20px;
}

.card{
    background:#fff;
    border-radius:16px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 2px 10px rgba(0,0,0,.04);
}

.card h2{
    font-size:16px;
    font-weight:800;
    margin-bottom:14px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-bottom:18px;
}

.stat{
    background:#f8fafc;
    border-radius:12px;
    padding:14px;
    text-align:center;
}

.stat b{
    font-size:24px;
    display:block;
    font-weight:900;
}

.stat span{
    font-size:11px;
    color:#64748b;
    font-weight:700;
}

.search{
    width:100%;
    padding:13px 14px;
    border:2px solid #e2e8f0;
    border-radius:12px;
    font-family:inherit;
    font-size:14px;
    outline:none;
    background:#f8fafc;
}

.search:focus{
    border-color:#2563eb;
    background:#fff;
}

.customer{
    background:#fff;
    border-radius:14px;
    padding:16px;
    margin-bottom:12px;
    border-right:5px solid #2563eb;
    box-shadow:0 2px 8px rgba(0,0,0,.04);
}

.customer.expired{
    border-right-color:#dc2626;
}

.customer-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
    margin-bottom:12px;
}

.customer-name{
    font-size:15px;
    font-weight:900;
}

.customer-email{
    font-size:11px;
    color:#64748b;
    direction:ltr;
    text-align:right;
    margin-top:3px;
}

.badge{
    padding:4px 10px;
    border-radius:20px;
    font-size:10px;
    font-weight:800;
    white-space:nowrap;
}

.badge.active{
    background:#dcfce7;
    color:#166534;
}

.badge.expired{
    background:#fee2e2;
    color:#991b1b;
}

.info{
    background:#f8fafc;
    border-radius:10px;
    padding:10px;
}

.info div{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:4px 0;
    font-size:12px;
}

.info span:first-child{
    color:#64748b;
    font-weight:600;
}

.info span:last-child{
    font-weight:700;
    text-align:left;
}

.phone{
    direction:ltr;
}

.days-active{
    color:#16a34a;
    font-weight:900!important;
}

.days-expired{
    color:#dc2626;
    font-weight:900!important;
}

.empty{
    text-align:center;
    padding:40px 20px;
    color:#94a3b8;
    background:#fff;
    border-radius:14px;
}

.loading{
    text-align:center;
    padding:40px;
    color:#64748b;
}

.error{
    color:#dc2626;
    text-align:center;
    padding:30px;
    background:#fff;
    border-radius:14px;
}
.actions{
    display:flex;
    gap:8px;
    margin-top:12px;
}

.btn-extend{
    flex:1;
    border:none;
    background:#16a34a;
    color:#fff;
    padding:10px;
    border-radius:10px;
    font-family:inherit;
    font-size:12px;
    font-weight:800;
    cursor:pointer;
}

.btn-extend:disabled{
    opacity:.6;
    cursor:not-allowed;
    }
@media(max-width:600px){

    .stats{
        grid-template-columns:1fr;
    }

    .header{
        flex-wrap:wrap;
    }

    .header h1{
        width:100%;
    }

    .customer-head{
        flex-direction:column;
    }

}

</style>
</head>


<body>

<header class="header">

    <h1>
        👑 مشتریان ویژه
    </h1>

    <a
        class="blue"
        href="admin.html"
    >
        ⚙️ مدیریت
    </a>

    <a
        href="dashboard.html"
    >
        ← داشبورد
    </a>

</header>


<div class="container">

    <div class="card">

        <h2>
            📊 آمار مشتریان ویژه
        </h2>

        <div class="stats">

            <div class="stat">

                <b id="totalCount">
                    0
                </b>

                <span>
                    کل مشتریان ویژه
                </span>

            </div>


            <div class="stat">

                <b id="activeCount">
                    0
                </b>

                <span>
                    اشتراک فعال
                </span>

            </div>


            <div class="stat">

                <b id="expiredCount">
                    0
                </b>

                <span>
                    اشتراک منقضی
                </span>

            </div>

        </div>


        <input
            id="search"
            class="search"
            type="search"
            placeholder="🔍 جستجو بر اساس نام، ایمیل یا شماره..."
        >

    </div>


    <div id="list">

        <div class="loading">
            در حال بارگذاری مشتریان ویژه...
        </div>

    </div>

</div>


<script type="module">

import { supabase } from './js/supabase.js';


const list =
    document.getElementById('list');

const search =
    document.getElementById('search');

const totalCount =
    document.getElementById('totalCount');

const activeCount =
    document.getElementById('activeCount');

const expiredCount =
    document.getElementById('expiredCount');


let customers = [];


const esc = (value) =>
    String(value ?? '')
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#039;');


function formatDate(value){

    if(!value){
        return '-';
    }

    try{

        return new Date(value)
            .toLocaleDateString('fa-IR');

    }catch{

        return '-';

    }

}


function getSubscriptionStatus(date){

    if(!date){

        return {
            active:false,
            days:0
        };

    }


    const end =
        new Date(date);

    const now =
        new Date();


    const diff =
        end.getTime() -
        now.getTime();


    const days =
        Math.ceil(
            diff / 86400000
        );


    return {
        active: days > 0,
        days: Math.max(days,0)
    };

}


async function checkAdmin(){

    const {
        data:{
            session
        },
        error
    } =
        await supabase.auth.getSession();


    if(error){

        throw error;

    }


    if(!session){

        window.location.replace(
            'login.html'
        );

        return false;

    }


    const role =
        session.user
            ?.user_metadata
            ?.role;


    if(role !== 'admin'){

        list.innerHTML = `

            <div class="error">

                ⛔ دسترسی غیرمجاز

                <br>

                <small>
                    فقط مدیر سیستم می‌تواند
                    مشتریان ویژه را مشاهده کند.
                </small>

            </div>

        `;

        return false;

    }


    return true;

}


async function loadCustomers(){

    const allowed =
        await checkAdmin();


    if(!allowed){

        return;

    }


    const {
        data,
        error
    } =
        await supabase
            .from('profiles')
            .select(
                'id,full_name,phone,created_at,updated_at,email,role,subscription_end_date'
            )
            .order(
                'created_at',
                {
                    ascending:false
                }
            );


    if(error){

        throw error;

    }


   const adminEmail = 'hahass12na@gmail.com';

customers =
    (data || [])
        .filter(user => {
            const role =
                String(user.role || '').toLowerCase();

            const email =
                String(user.email || '').toLowerCase();

            return (
                role !== 'admin' &&
                email !== adminEmail
            );
        }); 


    updateStats();

    render();

}


function updateStats(){

    totalCount.textContent =
        customers.length;


    const active =
        customers.filter(
            user =>
                getSubscriptionStatus(
                    user.subscription_end_date
                ).active
        ).length;


    const expired =
        customers.length -
        active;


    activeCount.textContent =
        active;


    expiredCount.textContent =
        expired;

}


function render(){

    const q =
        search.value
            .trim()
            .toLowerCase();


    const filtered =
        customers.filter(user => {

            const text = [

                user.full_name,

                user.email,

                user.phone

            ]
            .filter(Boolean)
            .join(' ')
            .toLowerCase();


            return text.includes(q);

        });


    if(!filtered.length){

        list.innerHTML = `

            <div class="empty">

                📭
                ${
                    q
                    ? 'موردی پیدا نشد.'
                    : 'هنوز مشتری ویژه‌ای ثبت نشده است.'
                }

            </div>

        `;

        return;

    }


    list.innerHTML = '';


    filtered.forEach(user => {

        const subscription =
            getSubscriptionStatus(
                user.subscription_end_date
            );


        const div =
            document.createElement('div');


        div.className =
            subscription.active
            ? 'customer'
            : 'customer expired';


        const statusBadge =
            subscription.active
            ? `
                <span class="badge active">
                    🟢 اشتراک فعال
                </span>
            `
            : `
                <span class="badge expired">
                    🔴 اشتراک منقضی
                </span>
            `;


        const daysText =
            subscription.active
            ? `
                <span class="days-active">
                    ${subscription.days}
                    روز باقی‌مانده
                </span>
            `
            : `
                <span class="days-expired">
                    منقضی شده
                </span>
            `;


        div.innerHTML = `

            <div class="customer-head">

                <div>

                    <div class="customer-name">

                        👑
                        ${esc(
                            user.full_name ||
                            'بدون نام'
                        )}

                    </div>


                    <div class="customer-email">

                        ${esc(
                            user.email ||
                            '-'
                        )}

                    </div>

                </div>


                ${statusBadge}

            </div>


     <div class="info">

    <div>

        <span>
            📱 شماره تماس
        </span>

        <span class="phone">

            ${esc(
                user.phone ||
                '-'
            )}

        </span>

    </div>


    <div>

        <span>
            📅 تاریخ ثبت‌نام
        </span>

        <span>

            ${formatDate(
                user.created_at
            )}

        </span>

    </div>       


                <div>

                    <span>
                        💳 وضعیت اشتراک
                    </span>

                    ${daysText}

                </div>


                <div>

                    <span>
                        📅 پایان اشتراک
                    </span>

                    <span>

                        ${formatDate(
                            user.subscription_end_date
                        )}

                    </span>

                </div>


                <div>

                    <span>
                        🔄 آخرین بروزرسانی
                    </span>

                    <span>

                        ${formatDate(
                            user.updated_at
                        )}

                    </span>

                </div>

            </div>
            </div>

            <div class="actions">

                <button
                    class="btn-extend"
                    data-user-id="${esc(user.id)}"
                >
                    ➕ تمدید اشتراک
                </button>

            </div>

        `;


        list.appendChild(div);

    });

}

list.addEventListener('click', async (event) => {

    const button =
        event.target.closest('.btn-extend');

    if(!button){
        return;
    }

    const userId =
        button.dataset.userId;

    const daysInput =
        prompt(
            'چند روز به اشتراک اضافه شود؟\nمثلاً: 30'
        );

    if(daysInput === null){
        return;
    }

    const days =
        Number(daysInput);

    if(!Number.isInteger(days) || days <= 0){
        alert('❌ تعداد روز واردشده معتبر نیست.');
        return;
    }

    if(days > 3650){
        alert('❌ حداکثر مدت تمدید 3650 روز است.');
        return;
    }

    const {
        data:{
            session
        }
    } =
        await supabase.auth.getSession();

    if(!session){
        alert('❌ جلسه مدیر منقضی شده است.');
        return;
    }

    const oldText =
        button.textContent;

    button.disabled = true;
    button.textContent = '⏳ در حال تمدید...';

    try{

        const response =
            await fetch(
                '/api/extend-subscription',
                {
                    method:'POST',

                    headers:{
                        'Content-Type':'application/json',
                        'Authorization':
                            `Bearer ${session.access_token}`
                    },

                    body:JSON.stringify({
                        userId,
                        days
                    })
                }
            );

        const result =
            await response.json();

        if(!response.ok || !result.success){
            throw new Error(
                result.error ||
                'تمدید اشتراک انجام نشد.'
            );
        }

        alert(
            `✅ ${result.message}\n\n` +
            `📅 پایان جدید: ${
                formatDate(result.endDate)
            }`
        );

        await loadCustomers();

    }catch(error){

        console.error(
            'Extend subscription error:',
            error
        );

        alert(
            '❌ خطا در تمدید اشتراک:\n' +
            error.message
        );

        button.disabled = false;
        button.textContent = oldText;

    }

});
search.addEventListener(
    'input',
    render
);


loadCustomers()
    .catch(error => {

        console.error(
            'Special customers error:',
            error
        );


        list.innerHTML = `

            <div class="error">

                ⚠️ خطا در بارگذاری اطلاعات

                <br>

                <small>
                    ${esc(error.message)}
                </small>

            </div>

        `;

    });

</script>

</body>
</html>
