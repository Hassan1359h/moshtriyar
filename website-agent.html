<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2563eb">
<title>تنظیمات دستیار | مشتری‌یار</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
<link rel="icon" href="icon-192.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:#f8fafc;color:#0f172a;line-height:1.7;padding-bottom:80px}
.header{background:#1e293b;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;flex-wrap:wrap;gap:8px}
.header h1{font-size:16px;font-weight:800}
.header a{color:#fff;text-decoration:none;background:#334155;padding:8px 14px;border-radius:10px;font-size:13px;font-weight:700;margin-right:6px}
.container{max-width:700px;margin:0 auto;padding:20px}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.card h2{font-size:15px;font-weight:800;margin-bottom:12px}
.card p.desc{font-size:13px;color:#475569;line-height:1.9;margin-bottom:14px}
.btn-save{padding:12px 16px;border:0;border-radius:12px;font-family:inherit;font-weight:800;font-size:14px;cursor:pointer;display:block;width:100%;background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;margin-top:8px}
.btn-save:disabled{opacity:.5;cursor:not-allowed}
.msg{margin-top:10px;font-size:13px;font-weight:700;text-align:center}
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f1f5f9}
.setting-row:last-child{border-bottom:0}
.setting-row label{font-size:13px;font-weight:700;color:#334155}
.checkbox{width:20px;height:20px;accent-color:#2563eb}
.green-card{background:linear-gradient(135deg,#f0fdf4,#dcfce7);border:2px solid #86efac;border-radius:14px;padding:18px;margin-bottom:16px;text-align:center}
.green-card h3{color:#166534;font-size:15px;font-weight:800;margin-bottom:8px}
.green-card p{color:#15803d;font-size:13px;line-height:1.9}
.green-card .big-btn{margin-top:14px;padding:14px 20px;border:0;border-radius:12px;font-family:inherit;font-weight:800;font-size:15px;cursor:pointer;background:linear-gradient(135deg,#16a34a,#059669);color:#fff;width:100%}
.green-card .big-btn:disabled{opacity:.6}
#wpMsg{margin-top:12px;font-size:13px;font-weight:700}
</style>
</head>
<body>

<header class="header">
    <h1>🎨 تنظیمات دستیار</h1>
    <div>
        <a href="dashboard.html">← داشبورد</a>
        <a href="#" id="logoutBtn" style="background:#dc2626;">خروج</a>
    </div>
</header>

<div class="container">

    <div class="card">
        <h2>⚙️ وضعیت</h2>
        <div class="setting-row">
            <label>دستیار فعال باشد</label>
            <input type="checkbox" class="checkbox" id="agentEnabled" checked>
        </div>
    </div>

    <div class="green-card">
        <h3>🟢 نصب آسان وردپرس</h3>
        <p>اگر سایتت با وردپرس ساخته شده، با یه کلیک افزونه مخصوص خودت رو دریافت کن. بعد نصب و فعال‌سازی، اتصال خودکار انجام می‌شه.</p>
        <button class="big-btn" id="wpInstallBtn">🟢 دریافت افزونه وردپرس</button>
        <p id="wpMsg"></p>
    </div>

    <div class="card">
        <h2>📋 کد اتصال سایت</h2>
        <p class="desc">کد اسکریپت مشتری‌یار رو ببین و توی سایتت قرار بده.</p>
        <button class="btn-save" id="showScriptBtn">📋 نمایش کد اتصال</button>
    </div>

    <button class="btn-save" id="saveBtn">💾 ذخیره تنظیمات</button>

</div>

<script type="module">
import { supabase } from './js/supabase.js';

const $ = (id) => document.getElementById(id);
let currentUser = null;
let currentWebsite = { domain: '' };

async function init() {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) { window.location.href = 'login.html'; return; }
    currentUser = session.user;

    // گرفتن سایت کاربر
    const { data: website } = await supabase
        .from('websites')
        .select('domain')
        .eq('user_id', currentUser.id)
        .maybeSingle();

    if (website) currentWebsite = website;

    // بارگذاری تنظیمات
    const { data: settings } = await supabase
        .from('website_agent_settings')
        .select('*')
        .eq('user_id', currentUser.id)
        .maybeSingle();

    if (settings?.enabled !== undefined) {
        $('agentEnabled').checked = settings.enabled;
    }
}

// 🎯 ذخیره تنظیمات
$('saveBtn')?.addEventListener('click', async () => {
    const btn = $('saveBtn');
    btn.disabled = true;
    btn.textContent = '⏳ در حال ذخیره...';

    try {
        const enabled = $('agentEnabled').checked;
        const { error } = await supabase
            .from('website_agent_settings')
            .upsert({
                user_id: currentUser.id,
                enabled,
                updated_at: new Date().toISOString()
            }, { onConflict: 'user_id' });

        if (error) throw error;
        btn.textContent = '✅ ذخیره شد';
        setTimeout(() => { btn.textContent = '💾 ذخیره تنظیمات'; }, 2000);
    } catch (e) {
        alert('خطا: ' + e.message);
        btn.textContent = '💾 ذخیره تنظیمات';
    } finally {
        btn.disabled = false;
    }
});

// 🎯 خروج
$('logoutBtn')?.addEventListener('click', async (e) => {
    e.preventDefault();
    await supabase.auth.signOut();
    window.location.href = 'login.html';
});

// 🎯 نمایش کد اتصال
$('showScriptBtn')?.addEventListener('click', () => {
    if (!currentWebsite?.domain) {
        alert('❌ آدرس سایت پیدا نشد');
        return;
    }
    const scriptCode = `<script src="https://moshtriyar.ir/api/website-agent.js"
    data-user-id="${currentUser.id}"
    data-site="${currentWebsite.domain}"
    data-enabled="true"><\/script>`;

    const w = window.open('', '_blank');
    w.document.write(`
        <html dir="rtl"><head><title>کد اتصال</title>
        <style>body{font-family:Tahoma;padding:20px;background:#f8fafc}
        pre{background:#0f172a;color:#e2e8f0;padding:16px;border-radius:10px;direction:ltr;text-align:left;word-break:break-all;white-space:pre-wrap}
        button{padding:12px 20px;background:#2563eb;color:#fff;border:0;border-radius:8px;font-weight:700;cursor:pointer;margin-top:10px}</style>
        </head><body>
        <h2>کد اتصال سایت</h2>
        <pre id="code">${scriptCode.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</pre>
        <button onclick="navigator.clipboard.writeText(document.getElementById('code').innerText);this.textContent='✅ کپی شد'">📋 کپی کد</button>
        </body></html>
    `);
});

// 🎯 دریافت افزونه وردپرس
$('wpInstallBtn')?.addEventListener('click', async () => {
    const btn = $('wpInstallBtn');
    const msg = $('wpMsg');

    if (!currentWebsite?.domain) {
        msg.textContent = '❌ آدرس سایت پیدا نشد';
        msg.style.color = '#dc2626';
        return;
    }

    btn.disabled = true;
    btn.textContent = '⏳ در حال ساخت افزونه...';
    msg.textContent = '';
    msg.style.color = '';

    try {
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) throw new Error('جلسه ورود منقضی شده');

        msg.textContent = '🔑 دریافت توکن امن...';
        msg.style.color = '#2563eb';

        const connectRes = await fetch('/api/wordpress-connect', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + session.access_token
            },
            body: JSON.stringify({ siteUrl: currentWebsite.domain })
        });

        const connectData = await connectRes.json();

        if (!connectRes.ok || !connectData.token) {
            throw new Error(connectData.error || 'خطا در دریافت توکن');
        }

        // 🎯 ساخت لینک دانلود (فقط GET، بدون POST)
        const serverUrl = `https://moshtriyar.ir/api/wordpress-plugin?token=${connectData.token}&siteUrl=${encodeURIComponent(currentWebsite.domain)}`;

        msg.innerHTML = `
            <div style="margin-top:12px;padding:14px;background:#eff6ff;border-radius:12px;border:2px solid #2563eb;text-align:right;">
                <p style="color:#1e40af;font-weight:800;font-size:13px;margin-bottom:10px;line-height:1.7;">
                    ✅ افزونه آماده شد!
                </p>
                <a href="${serverUrl}"
                   style="display:block;background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;padding:12px;border-radius:10px;text-decoration:none;font-weight:800;text-align:center;font-size:14px;margin-bottom:10px;">
                    ⬇️ دانلود افزونه
                </a>
                <p style="color:#64748b;font-size:12px;margin-bottom:6px;font-weight:700;">
                    💡 اگر دانلود نشد، این لینک را کپی کن و در Chrome باز کن:
                </p>
                <div id="manualLink" style="background:#f1f5f9;padding:10px;border-radius:8px;font-size:11px;direction:ltr;text-align:left;word-break:break-all;color:#1e40af;border:1px dashed #2563eb;margin-bottom:8px;font-family:monospace;">
                    ${serverUrl}
                </div>
                <button id="copyLinkBtn"
                        style="display:block;width:100%;background:#16a34a;color:#fff;padding:10px;border-radius:10px;border:0;font-weight:800;font-size:13px;font-family:inherit;cursor:pointer;">
                    📋 کپی لینک
                </button>
                <p id="copyMsg" style="color:#16a34a;font-size:12px;text-align:center;margin-top:8px;font-weight:700;"></p>
            </div>
        `;

        msg.style.color = '#16a34a';
        btn.textContent = '✅ آماده شد — دریافت مجدد';

        setTimeout(() => {
            const copyBtn = document.getElementById('copyLinkBtn');
            const copyMsgEl = document.getElementById('copyMsg');
            if (copyBtn) {
                copyBtn.addEventListener('click', async () => {
                    const link = document.getElementById('manualLink').textContent.trim();
                    try {
                        await navigator.clipboard.writeText(link);
                        copyMsgEl.textContent = '✅ لینک کپی شد!';
                    } catch (e) {
                        const range = document.createRange();
                        range.selectNode(document.getElementById('manualLink'));
                        window.getSelection().removeAllRanges();
                        window.getSelection().addRange(range);
                        document.execCommand('copy');
                        window.getSelection().removeAllRanges();
                        copyMsgEl.textContent = '✅ لینک کپی شد!';
                    }
                    setTimeout(() => copyMsgEl.textContent = '', 4000);
                });
            }
        }, 100);

    } catch (err) {
        console.error('WP install error:', err);
        msg.textContent = '❌ ' + (err.message || 'خطا در دریافت افزونه');
        msg.style.color = '#dc2626';
        btn.textContent = '🟢 دریافت افزونه وردپرس';
    } finally {
        btn.disabled = false;
    }
});

init();
</script>

</body>
</html>
