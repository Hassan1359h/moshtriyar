<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🌐 اتصال وب‌سایت | مشتری‌یار</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:#f1f5f9;
    color:#1e293b
}
header{
    background:#fff;
    padding:14px 18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 1px 5px #0001
}
header b{font-size:17px}
a{
    text-decoration:none;
    color:#2563eb;
    font-weight:bold
}
main{
    width:min(700px,calc(100% - 24px));
    margin:20px auto
}
.card{
    background:#fff;
    padding:18px;
    border-radius:16px;
    margin-bottom:15px;
    box-shadow:0 2px 10px #00000008
}
h2{font-size:18px;margin:0 0 8px}
h3{font-size:15px;margin:0 0 15px}
p{
    font-size:13px;
    line-height:1.9;
    color:#64748b
}
label{
    display:block;
    font-size:13px;
    font-weight:bold;
    margin:12px 0 6px
}
input,textarea{
    width:100%;
    padding:11px;
    border:1px solid #cbd5e1;
    border-radius:10px;
    font:inherit
}
textarea{min-height:80px}
button{
    width:100%;
    border:0;
    border-radius:10px;
    padding:12px;
    margin-top:12px;
    font:inherit;
    font-weight:bold;
    cursor:pointer
}
.blue{background:#2563eb;color:#fff}
.green{background:#16a34a;color:#fff}
.gray{background:#e2e8f0;color:#334155}
button:disabled{opacity:.6}
.msg{
    display:none;
    padding:11px;
    border-radius:10px;
    margin-bottom:15px;
    font-size:13px;
    font-weight:bold;
    line-height:1.8
}
.success{display:block;background:#dcfce7;color:#166534}
.error{display:block;background:#fee2e2;color:#991b1b}
.hidden{display:none!important}
.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px
}
pre{
    direction:ltr;
    text-align:left;
    white-space:pre-wrap;
    word-break:break-word;
    background:#0f172a;
    color:#e2e8f0;
    padding:13px;
    border-radius:10px;
    font-size:11px;
    line-height:1.7
}
@media(max-width:600px){
    .row{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
    <b>🌐 مشتری‌یار</b>
    <a href="dashboard.html">← داشبورد</a>
</header>

<main id="loading">
    <div class="card">
        در حال بررسی حساب...
    </div>
</main>

<main id="app" class="hidden">

    <div id="message" class="msg"></div>

    <section class="card">
        <h2>🌐 اتصال وب‌سایت</h2>
        <p>
            وب‌سایت خود را به مشتری‌یار متصل کنید و دستیار هوشمند فروش
            را روی سایت فعال کنید.
        </p>

        <label>نام کسب‌وکار</label>
        <input id="businessName" placeholder="مثلاً فروشگاه من">

        <label>آدرس وب‌سایت</label>
        <input id="websiteUrl"
               type="url"
               placeholder="https://example.com">

        <label>عنوان دستیار</label>
        <input id="agentTitle"
               placeholder="دستیار هوشمند">

        <label>پیام خوشامدگویی</label>
        <textarea id="welcomeMessage"
                  placeholder="سلام 👋 چطور می‌توانم کمکتان کنم؟"></textarea>

        <div class="row">
            <div>
                <label>رنگ دستیار</label>
                <input id="agentColor"
                       type="color"
                       value="#2563eb"
                       style="height:45px;padding:3px">
            </div>

            <div>
                <label>وضعیت</label>
                <button id="enableBtn"
                        class="gray"
                        type="button">
                    فعال کردن
                </button>
            </div>
        </div>

        <button id="saveBtn"
                class="blue"
                type="button">
            💾 ذخیره تنظیمات
        </button>
    </section>

    <section class="card">
        <h3>🟢 نصب آسان وردپرس</h3>

        <p>
            با این گزینه افزونه مخصوص حساب شما ساخته و دانلود می‌شود.
        </p>

        <button id="wordpressBtn"
                class="green"
                type="button">
            🟢 اتصال و دریافت افزونه وردپرس
        </button>

        <div id="wordpressBox"
             class="msg"
             style="margin-top:12px;margin-bottom:0">
        </div>
    </section>

    <section class="card">
        <h3>🔌 کد اتصال مستقیم</h3>

        <pre id="embedCode"></pre>

        <button id="copyBtn"
                class="gray"
                type="button">
            📋 کپی کد اتصال
        </button>
    </section>

</main>

<script type="module">

import { supabase } from "./js/supabase.js";

const $ = id => document.getElementById(id);

let me = null;
let enabled = false;

function message(text,type="success"){
    const box = $("message");
    box.className = "msg " + type;
    box.textContent = text;
}

function wordpressMessage(text,type="success"){
    const box = $("wordpressBox");
    box.className = "msg " + type;
    box.textContent = text;
}

function config(){
    return {
        businessName:$("businessName").value.trim(),
        websiteUrl:$("websiteUrl").value.trim(),
        agentTitle:
            $("agentTitle").value.trim() ||
            "دستیار هوشمند",
        welcomeMessage:
            $("welcomeMessage").value.trim() ||
            "سلام 👋 چطور می‌توانم کمکتان کنم؟",
        agentColor:$("agentColor").value,
        enabled
    };
}

function generateCode(){

    const c = config();

    $("embedCode").textContent =
`<!-- مشتری‌یار -->
<script
src="https://moshtriyar.vercel.app/api/website-agent.js"
data-user-id="${me?.id || ""}"
data-site="${c.websiteUrl}"
data-color="${c.agentColor}"
data-title="${c.agentTitle}"
data-enabled="${c.enabled}">
<\/script>`;

}

async function load(){

    const {
        data:{session}
    } = await supabase.auth.getSession();

    if(!session){

        location.href = "login.html";
        return;

    }

    me = session.user;

    const saved =
        me.user_metadata?.website_agent || {};

    $("businessName").value =
        saved.businessName || "";

    $("websiteUrl").value =
        saved.websiteUrl || "";

    $("agentTitle").value =
        saved.agentTitle || "دستیار هوشمند";

    $("welcomeMessage").value =
        saved.welcomeMessage ||
        "سلام 👋 چطور می‌توانم کمکتان کنم؟";

    $("agentColor").value =
        saved.agentColor || "#2563eb";

    enabled = saved.enabled === true;

    $("enableBtn").textContent =
        enabled ? "🟢 دستیار فعال است" : "فعال کردن";

    generateCode();

    $("loading").classList.add("hidden");
    $("app").classList.remove("hidden");
}

$("enableBtn").onclick = () => {

    enabled = !enabled;

    $("enableBtn").textContent =
        enabled
            ? "🟢 دستیار فعال است"
            : "دستیار غیرفعال است";

    generateCode();

};

$("saveBtn").onclick = async () => {

    if(!me) return;

    const c = config();

    if(!c.websiteUrl){

        message(
            "آدرس وب‌سایت را وارد کنید.",
            "error"
        );

        return;
    }

    $("saveBtn").disabled = true;
    $("saveBtn").textContent = "⏳ در حال ذخیره...";

    try{

        const {
            error
        } =
        await supabase.auth.updateUser({
            data:{
                website_agent:c
            }
        });

        if(error) throw error;

        message(
            "✅ تنظیمات با موفقیت ذخیره شد.",
            "success"
        );

        generateCode();

    }catch(error){

        console.error(error);

        message(
            "❌ ذخیره تنظیمات انجام نشد.",
            "error"
        );

    }finally{

        $("saveBtn").disabled = false;
        $("saveBtn").textContent =
            "💾 ذخیره تنظیمات";

    }

};

$("wordpressBtn").onclick = async () => {

    if(!me){

        wordpressMessage(
            "کاربر وارد حساب نشده است.",
            "error"
        );

        return;
    }

    const siteUrl =
        $("websiteUrl").value.trim();

    if(!siteUrl){

        wordpressMessage(
            "ابتدا آدرس وب‌سایت را وارد کنید.",
            "error"
        );

        return;
    }

    const button = $("wordpressBtn");

    button.disabled = true;

    try{

        wordpressMessage(
            "⏳ در حال ایجاد اتصال امن...",
            "success"
        );

        const {
            data:{session}
        } = await supabase.auth.getSession();

        if(!session)
            throw new Error("جلسه ورود منقضی شده است.");

        const connect =
            await fetch(
                "/api/wordpress-connect",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                            "application/json",
                        "Authorization":
                            "Bearer " +
                            session.access_token
                    },
                    body:JSON.stringify({
                        siteUrl
                    })
                }
            );

        const connection =
            await connect.json();

        if(!connect.ok)
            throw new Error(
                connection.error ||
                "ایجاد اتصال انجام نشد."
            );

        wordpressMessage(
            "⏳ در حال ساخت افزونه...",
            "success"
        );

        const plugin =
            await fetch(
                "/api/wordpress-plugin",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                            "application/json",
                        "Authorization":
                            "Bearer " +
                            session.access_token
                    },
                    body:JSON.stringify({
                        token:connection.token,
                        siteUrl:connection.siteUrl
                    })
                }
            );

        if(!plugin.ok){

            let result = {};

            try{
                result = await plugin.json();
            }catch{}

            throw new Error(
                result.error ||
                "ساخت افزونه انجام نشد."
            );

        }

        const blob =
            await plugin.blob();

        if(!blob.size)
            throw new Error(
                "فایل افزونه خالی است."
            );

        const url =
            URL.createObjectURL(blob);

        const a =
            document.createElement("a");

        a.href = url;
        a.download =
            "moshtriyar-ai-agent.zip";

        document.body.appendChild(a);
        a.click();
        a.remove();

        setTimeout(
            () => URL.revokeObjectURL(url),
            3000
        );

        wordpressMessage(
            "✅ افزونه با موفقیت آماده و دانلود شد.",
            "success"
        );

    }catch(error){

        console.error(
            "WordPress:",
            error
        );

        wordpressMessage(
            "❌ " +
            (error.message ||
            "دریافت افزونه انجام نشد."),
            "error"
        );

    }finally{

        button.disabled = false;

    }

};

$("copyBtn").onclick = async () => {

    const code =
        $("embedCode").textContent;

    if(!code){

        message(
            "کدی برای کپی وجود ندارد.",
            "error"
        );

        return;
    }

    try{

        if(
            navigator.clipboard &&
            window.isSecureContext
        ){

            await navigator.clipboard.writeText(code);

        }else{

            const area =
                document.createElement("textarea");

            area.value = code;
            area.style.position = "fixed";
            area.style.opacity = "0";

            document.body.appendChild(area);

            area.focus();
            area.select();

            if(!document.execCommand("copy"))
                throw new Error("copy failed");

            area.remove();

        }

        message(
            "✅ کد با موفقیت کپی شد.",
            "success"
        );

    }catch(error){

        console.error(error);

        message(
            "❌ کپی انجام نشد.",
            "error"
        );

    }

};

[
    "businessName",
    "websiteUrl",
    "agentTitle",
    "welcomeMessage",
    "agentColor"
].forEach(id => {

    $(id).addEventListener(
        "input",
        generateCode
    );

});

load();

</script>

</body>
</html>
